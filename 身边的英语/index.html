<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#5E8B7E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>身边的英语 · 一个上班族的一天</title>
<style>
  :root{
    --bg:#FBF7F0;
    --card:#FFFFFF;
    --ink:#2E2E2E;
    --muted:#7A7468;
    --line:#ECE4D6;
    --accent:#5E8B7E;      /* 柔和鼠尾草绿 */
    --accent-soft:#E4EEEA;
    --sand:#E8DCC4;
    --me:#5E8B7E;
    --partner:#7FA6C9;
    --coworker:#D9A05B;
    --shadow:0 2px 10px rgba(60,50,30,.07);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.55;
    font-size:16px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px;}
  header.top{
    background:linear-gradient(180deg,#FFFFFF 0%,#FBF7F0 100%);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:30;
    padding-top:env(safe-area-inset-top);
  }
  .top-inner{padding:12px 14px 10px;}
  .brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px;}
  .brand .sub{font-size:13px;color:var(--muted);}
  .controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .search{flex:1 1 160px;min-width:140px;position:relative;}
  .search input{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:10px 14px 10px 36px;font-size:15px;color:var(--ink);outline:none;
  }
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;}
  .toggle{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:9px 14px;font-size:14px;cursor:pointer;color:var(--ink);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .toggle b{color:var(--accent);font-weight:700;}

  /* Tabs */
  .tabs{display:flex;gap:8px;margin-top:10px;}
  .tab{
    flex:1;text-align:center;padding:11px 8px;border-radius:12px 12px 0 0;
    background:var(--accent-soft);color:var(--muted);font-weight:700;font-size:15px;
    cursor:pointer;border:1px solid transparent;border-bottom:none;
  }
  .tab.active{background:#fff;color:var(--accent);border-color:var(--line);}

  /* Module chips nav */
  .chips{
    display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;
  }
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* Progress */
  .progress-bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:4px 0 2px;}
  .progress-fill{height:100%;width:0;background:var(--accent);transition:width .3s;}
  .progress-text{font-size:12px;color:var(--muted);margin-bottom:10px;}

  section.module{margin:18px 0;}
  .mod-head{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .mod-head .en{font-size:18px;font-weight:700;}
  .mod-head .zh{font-size:14px;color:var(--muted);margin-top:2px;}
  .mod-head .scene{font-size:13px;color:var(--muted);margin-top:8px;font-style:italic;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-top:10px;box-shadow:var(--shadow);
  }
  .who{display:inline-block;font-size:12px;font-weight:700;color:#fff;padding:2px 9px;border-radius:999px;margin-bottom:7px;}
  .who.Me{background:var(--me);}
  .who.Partner{background:var(--partner);}
  .who.Coworker{background:var(--coworker);}
  .en-line{font-size:17px;font-weight:600;cursor:pointer;line-height:1.45;}
  .en-line:active{color:var(--accent);}
  .zh-line{font-size:15px;color:#444;margin-top:3px;}
  .alts{font-size:13px;color:var(--muted);margin-top:7px;padding-left:2px;}
  .alts .lab{font-weight:700;color:var(--accent);}
  .row{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
  .btn{
    border:1px solid var(--line);background:#fff;border-radius:11px;
    padding:9px 13px;font-size:14px;cursor:pointer;color:var(--ink);
    display:inline-flex;align-items:center;gap:6px;min-height:42px;
  }
  .btn.play{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:700;}
  .btn.slow{background:#fff;}
  .btn.star{margin-left:auto;background:#fff;font-size:18px;padding:9px 12px;}
  .btn.star.on{background:#FFF3D6;border-color:#F0D79A;}

  /* Key phrases */
  .kp{background:var(--accent-soft);border:1px solid #CFE0D8;border-radius:var(--radius);padding:13px 15px;margin-top:12px;}
  .kp h4{margin:0 0 9px;font-size:15px;color:var(--accent);}
  .kp-item{margin-bottom:10px;}
  .kp-item:last-child{margin-bottom:0;}
  .kp-en{font-weight:700;font-size:15px;}
  .kp-zh{font-size:14px;color:#444;margin-top:1px;}
  .kp-ex{font-size:13px;color:var(--muted);margin-top:3px;font-style:italic;}

  .placeholder{
    background:#fff;border:1px dashed var(--line);border-radius:var(--radius);
    padding:22px 16px;text-align:center;color:var(--muted);margin-top:10px;font-size:14px;
  }

  .no-match{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;}

  /* Back to top */
  .totop{
    position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
    width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;
    border:none;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;
  }
  .totop.show{opacity:1;pointer-events:auto;}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px 40px;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>身边的英语</h1>
      <span class="sub">一个广州上班族完整的一天 · 地道口语</span>
    </div>
    <div class="controls">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="search" placeholder="搜英文或中文，如 snooze / 地铁" />
      </div>
      <button class="toggle" id="accentBtn">口音：<b id="accentLab">美音</b></button>
      <button class="toggle" id="speedBtn">语速：<b id="speedLab">正常</b></button>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="weekday">工作日</div>
      <div class="tab" data-tab="weekend">休息日</div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<div class="wrap">
  <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
  <div class="progress-text" id="ptext"></div>
  <div id="content"></div>
  <footer>点击任意英文句子或 🔊 即可朗读 · 数据保存在本机 · 慢速 0.75x 帮你听清连读</footer>
</div>

<button class="totop" id="totop" aria-label="回到顶部">↑</button>

<script>

  /* ---------- 1 ---------- */

      {en:"veg out / brain off", zh:"瘫着 / 放空", ex:"I just wanna veg out tonight."},
      {en:"wash the day off", zh:"洗掉一天的疲惫", ex:"A hot shower washes the day off."},
      {en:"lights out", zh:"关灯睡觉", ex:"Lights out at eleven, strict."},
      {en:"I'm out", zh:"我睡着了 / 撤了", ex:"Five min later, he was out."},
      {en:"sleep tight", zh:"睡个好觉（晚安）", ex:"Big day tomorrow, sleep tight."}
    ]
  },

  /* ---------- 休息日（占位，确认风格后补充） ---------- */
  {id:"sleeping-in", tab:"weekend", en:"Sleeping In", zh:"睡懒觉", scene:"", placeholder:true,
    lines:[], kp:[]},
  {id:"brunch", tab:"weekend", en:"Brunch", zh:"早午餐", scene:"", placeholder:true,
    lines:[], kp:[]},
  {id:"chores", tab:"weekend", en:"Chores", zh:"家务", scene:"", placeholder:true,
    lines:[], kp:[]},
  {id:"going-out", tab:"weekend", en:"Going Out & Having Fun", zh:"出去玩", scene:"", placeholder:true,
    lines:[], kp:[]},
  {id:"sunday-evening", tab:"weekend", en:"Sunday Evening", zh:"周日晚上", scene:"", placeholder:true,
    lines:[], kp:[]}
];

/* ============== 状态 ============== */
const state = { tab:"weekday", accent:"en-US", slow:false, search:"" };

/* 发音 */
let voices = [];
function loadVoices(){ try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ voices = []; } }
loadVoices();
if (typeof window.speechSynthesis !== "undefined" && "onvoiceschanged" in window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(lang){
  if(!voices.length) return null;
  let v = voices.find(x => x.lang === lang);
  if(!v) v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith(lang.split("-")[0].toLowerCase()));
  if(!v) v = voices.find(x => /en/i.test(x.lang));
  return v || null;
}
function speak(text, forceSlow){
  if(!text) return;
  if(!("speechSynthesis" in window)){ alert("当前浏览器不支持语音朗读，建议用 Safari / Chrome。"); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = state.accent;
  const v = pickVoice(state.accent);
  if(v) u.voice = v;
  u.rate = (forceSlow ? 0.75 : (state.slow ? 0.75 : 1.0));
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

/* 收藏（已会） */
const MK = "ey_master_";
function isMastered(modId, i){ return localStorage.getItem(MK + modId + "_" + i) === "1"; }
function toggleMaster(modId, i){
  const k = MK + modId + "_" + i;
  if(localStorage.getItem(k) === "1") localStorage.removeItem(k);
  else localStorage.setItem(k, "1");
}

/* 匹配搜索 */
function matches(line, q){
  if(!q) return true;
  q = q.toLowerCase();
  if(line.en.toLowerCase().includes(q)) return true;
  if(line.zh.toLowerCase().includes(q)) return true;
  if((line.alts||[]).some(a => a.toLowerCase().includes(q))) return true;
  return false;
}

/* ============== 渲染 ============== */
function modsForTab(tab){ return MODULES.filter(m => m.tab === tab); }

function renderChips(){
  const wrap = document.getElementById("chips");
  const list = modsForTab(state.tab);
  wrap.innerHTML = list.map(m =>
    `<div class="chip" data-goto="${m.id}">${m.en.split(" ")[0]} · ${m.zh}</div>`
  ).join("");
}

function renderContent(){
  const q = state.search.trim();
  const list = modsForTab(state.tab);
  let html = "";
  let total = 0, mastered = 0;

  list.forEach(m => {
    if(m.placeholder){
      html += `<section class="module" id="mod-${m.id}">
        <div class="mod-head"><div class="en">${m.en}</div><div class="zh">${m.zh}</div></div>
        <div class="placeholder">休息日模块（${m.zh}）待补充 —— 确认工作日风格地道后我会接着写。</div>
      </section>`;
      return;
    }
    // 统计（仅非占位）
    const visibleLines = m.lines.filter(l => matches(l, q));
    total += m.lines.length;
    m.lines.forEach((l, i) => { if(isMastered(m.id, i)) mastered++; });

    if(q && visibleLines.length === 0){
      // 整个模块无匹配，仍显示标题但不显示卡片
      html += `<section class="module" id="mod-${m.id}">
        <div class="mod-head"><div class="en">${m.en}</div><div class="zh">${m.zh}</div>
        <div class="scene">${m.scene||""}</div></div>
        <div class="no-match">此模块无匹配「${q}」</div></section>`;
      return;
    }

    let cards = "";
    m.lines.forEach((l, i) => {
      if(!matches(l, q)) return;
      const star = isMastered(m.id, i);
      const altsHtml = (l.alts && l.alts.length)
        ? `<div class="alts"><span class="lab">也可以说：</span>${l.alts.join(" / ")}</div>` : "";
      cards += `<div class="card">
        <span class="who ${l.who}">${l.who}</span>
        <div class="en-line" data-play="${m.id}|${i}">${l.en}</div>
        <div class="zh-line">${l.zh}</div>
        ${altsHtml}
        <div class="row">
          <button class="btn play" data-act="play" data-mod="${m.id}" data-i="${i}">🔊 朗读</button>
          <button class="btn slow" data-act="slow" data-mod="${m.id}" data-i="${i}">🐢 慢速</button>
          <button class="btn star ${star?'on':''}" data-act="master" data-mod="${m.id}" data-i="${i}" title="标记已会">${star?'★':'☆'}</button>
        </div>
      </div>`;
    });

    let kpHtml = "";
    if(m.kp && m.kp.length && !q){
      kpHtml = `<div class="kp"><h4>Key Phrases 重点表达</h4>` +
        m.kp.map(k => `<div class="kp-item"><div class="kp-en">${k.en}</div>
          <div class="kp-zh">${k.zh}</div><div class="kp-ex">例：${k.ex}</div></div>`).join("") +
        `</div>`;
    }

    html += `<section class="module" id="mod-${m.id}">
      <div class="mod-head">
        <div class="en">${m.en}</div><div class="zh">${m.zh}</div>
        ${m.scene?`<div class="scene">${m.scene}</div>`:""}
      </div>
      ${cards}
      ${kpHtml}
    </section>`;
  });

  document.getElementById("content").innerHTML = html;

  // 进度（仅统计当前 tab 非占位模块）
  const pct = total ? Math.round(mastered/total*100) : 0;
  document.getElementById("pfill").style.width = pct + "%";
  document.getElementById("ptext").textContent = `本板块共 ${total} 句 · 已会 ${mastered} 句（${pct}%）`;
}

function renderAll(){ renderChips(); renderContent(); updateChipActive(); }

function updateChipActive(){
  // 高亮当前视口模块（简化：不强制）
}

/* ============== 事件 ============== */
document.getElementById("accentBtn").addEventListener("click", () => {
  state.accent = (state.accent === "en-US") ? "en-GB" : "en-US";
  document.getElementById("accentLab").textContent = (state.accent === "en-US") ? "美音" : "英音";
  // 触发一次空发音以确保语音已加载
  if("speechSynthesis" in window) window.speechSynthesis.getVoices();
});
document.getElementById("speedBtn").addEventListener("click", () => {
  state.slow = !state.slow;
  document.getElementById("speedLab").textContent = state.slow ? "慢速 0.75x" : "正常";
});
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    state.tab = t.dataset.tab;
    // 切到休息日时清空搜索避免无结果
    if(state.tab === "weekend"){ document.getElementById("search").value=""; state.search=""; }
    renderAll();
    window.scrollTo({top:0, behavior:"smooth"});
  });
});
document.getElementById("search").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderContent();
});
document.getElementById("chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if(!c) return;
  const el = document.getElementById("mod-" + c.dataset.goto);
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
});
document.getElementById("content").addEventListener("click", (e) => {
  // 朗读按钮
  const btn = e.target.closest("[data-act]");
  if(btn){
    const mod = MODULES.find(m => m.id === btn.dataset.mod);
    const line = mod.lines[+btn.dataset.i];
    if(btn.dataset.act === "play") speak(line.en, false);
    else if(btn.dataset.act === "slow") speak(line.en, true);
    else if(btn.dataset.act === "master"){
      toggleMaster(btn.dataset.mod, +btn.dataset.i);
      renderContent();
    }
    return;
  }
  // 点击英文句子朗读
  const en = e.target.closest("[data-play]");
  if(en){
    const [modId, i] = en.dataset.play.split("|");
    const mod = MODULES.find(m => m.id === modId);
    speak(mod.lines[+i].en, false);
  }
});

/* 回到顶部 */
const totop = document.getElementById("totop");
window.addEventListener("scroll", () => {
  if(window.scrollY > 300) totop.classList.add("show");
  else totop.classList.remove("show");
});
totop.addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));

/* 首次交互兜底加载语音 */
document.body.addEventListener("click", function once(){
  if("speechSynthesis" in window) loadVoices();
  document.body.removeEventListener("click", once);
});

/* 初始化 */
renderAll();
</script>
</body>
</html>
