          <h1>袁世凯</h1>
          <p class="hook">一手逼退清帝、缔造共和的人，却忍不住自己戴上那顶皇冠，旋即身败名裂</p>
          <div class="body"><p>袁世凯小站练兵练出北洋班底，辛亥革命中逼清帝退位、逼孙中山让位，本可做大总统。可1915年称帝洪宪，八十三天即众叛亲离、郁郁而死。他终结了两千年帝制，却又贪恋那最后一点龙袍——成也权术，败也权术，历史给他开了个最辛辣的玩笑。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他手握北洋六镇确是当时最强武力，也确在逼清帝退位时推出『共和』；称帝失败后全国护国讨伐，军阀时代自此打开。</p></div>
