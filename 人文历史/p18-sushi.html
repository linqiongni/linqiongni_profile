          <h1>苏轼</h1>
          <p class="hook">宋朝最讨喜的天才，一辈子都在被流放，却把流放活成了逍遥游</p>
          <div class="body"><p>苏轼廿一岁中制科、名动京师，却因不站队新旧两党，从乌台诗案贬黄州，再贬惠州、儋州，越贬越远。他在黄州开荒东坡、发明东坡肉，在海南办学育人，到哪儿都能把日子过出滋味。世人爱他，不只因词好，更因他教人：被命运按在地上，也能笑着拍拍灰。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>王安石变法与元祐更替，把士大夫切成两半，苏轼两边都不肯全站——于是两边都贬他。乌台诗案是宋代文字狱著名一案，也逼出一个写『前后赤壁赋』的东坡。</p></div>
