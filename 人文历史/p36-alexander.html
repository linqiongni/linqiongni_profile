          <h1>亚历山大大帝</h1>
          <p class="hook">用十年征服已知世界的三十二岁青年，临死竟为『再无地方可征服』而落泪</p>
          <div class="body"><p>亚历山大二十岁继位，十年间荡平波斯、兵抵印度，建起空前帝国，却于三十二岁高烧暴亡，未留继承人，帝国随即四分五裂。传记里写他眺望已知世界的尽头时落泪——不是喜，是怅。最贪婪的征服者，输给了自己寿命的短。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他死后留下的『希腊化世界』从埃及延伸到印度河，犍陀罗佛教艺术正是他东征的文化余数。刀锋停下的地方，思想才继续走。</p></div>
