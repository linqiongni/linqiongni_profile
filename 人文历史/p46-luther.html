          <h1>马丁·路德</h1>
          <p class="hook">一个修士的不满之所以燎原，靠的不只是勇气，更是一台新机器——印刷机</p>
          <div class="body"><p>1517年路德贴出《九十五条论纲》批评赎罪券，真正的引爆点是：印刷术让他的德文小册子在几周内传遍德意志，人人都能读圣经。宗教改革一半是信仰，一半是技术。思想要成运动，往往得先等来传播的翅膀。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他把圣经译成德文，直接塑造了标准德语；又因改革分裂出无数新教派，欧洲打了百年宗教战争。『因信称义』解放了个人，也拆开了基督教的一体性。</p></div>
