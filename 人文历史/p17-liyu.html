          <h1>李煜</h1>
          <p class="hook">中国最差劲的皇帝，却写出了最好的词，最后被一杯毒酒赐死</p>
          <div class="body"><p>李煜治国昏聩、沉迷文艺，国破被俘后从『一国之主』沦为『违命侯』，却在囚禁中写出『问君能有几多愁，恰似一江春水向东流』这等绝唱。宋太宗赐他牵机药毒杀，年仅四十二。政治上的废物，文学的巨匠——历史有时残忍地用一个人的死，成全另一种不朽。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他填词不避市井俗语，把词从『乐府余绪』拉进文人直抒，为宋词铺路；又精书画、收藏、修订《韩熙载夜宴图》题材者多受其影响。亡国者成了后来所有『愁』的版权所有者。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《千古风流人物》》 · 《《中国通史·五代十国》》</div>
