          <h1>曾国藩</h1>
          <p class="hook">考了七次才中秀才的『笨人』，靠一个『熬』字撑起了将倾的清王朝</p>
          <div class="body"><p>曾国藩少年愚钝，连考七回秀才，可他日课十二条、结硬寨打呆仗，组建湘军扑灭太平天国，又首倡派遣留美幼童、办洋务。他一生屡败屡战，屡战屡败，靠的不是才气是韧性。一个不算聪明的人，用最笨的功夫，活成了『半个圣人』。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他以在籍绅士的身份『团练』起家，把地方士绅的武力收归朝廷，是晚清『督抚专政』的开端；随后洋务、海防、留学全从他这个口子出。</p></div>
