          <h1>牛顿</h1>
          <p class="hook">经典物理之父，花在炼金术上的年头，比研究引力还多</p>
          <div class="body"><p>牛顿写下《原理》确立运动三定律，可他留下的手稿中，关于炼金术与神学的文字以百万字计，一生痴迷点石成金、推算圣经预言，还与莱布尼茨为微积分发明权缠斗不休。教科书里的理性之神，私下是个沉迷秘术、多疑孤僻的老人。科学史也该诚实写下他的暗面。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他任皇家铸币局主管时查办伪造货币案，把物理学家变成了最狠的铁腕官僚——又一位『科学天才 + 制度执行者』的双面人。</p></div>
