          <h1>王羲之</h1>
          <p class="hook">『书圣』最负盛名的真迹，被一位皇帝爱到带进了坟墓</p>
          <div class="body"><p>王羲之在兰亭雅集微醺之际写下《兰亭集序》，被誉『天下第一行书』。他爱鹅成癖，曾为换一群鹅为人抄经。可这幅真迹后来落到唐太宗手里，帝王爱不释手，死时下令以真迹殉葬昭陵——人间从此再无《兰亭》原墨，只有摹本流传。最美的东西，有时恰恰毁于最深的痴迷。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>此刻东晋偏安江左，士族清谈、北伐无功，王羲之却以书法把『晋人风度』实实在在固化成了肌肉记忆。此后唐人学王，宋人学唐，整个东亚的笔迹都在他一醉之后。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《书简阅中国》》 · 《《中国通史·东晋》》</div>
