          <h1>林则徐</h1>
          <p class="hook">虎门销烟的民族英雄，转眼成了替皇帝背锅、发配新疆的罪臣</p>
          <div class="body"><p>林则徐禁烟坚决、睁眼看世界，组织翻译西事、仿制西炮，是当时最清醒的疆臣。可鸦片战争一败，道光为求和把他革职查办、流放伊犁。他到边塞仍屯田兴水利，默默赎着本不属于他的罪。英雄的悲剧，常不在于战败，而在于被自己誓死效忠的朝廷推出的那一步。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他组织翻译《四洲志》，是『开眼看世界』第一人；魏源据此编《海国图志》，提出『师夷长技以制夷』。替罪羊成了启蒙者，而朝廷却把他流放了。</p></div>
