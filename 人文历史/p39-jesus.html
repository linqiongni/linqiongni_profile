          <h1>耶稣</h1>
          <p class="hook">罗马人要借处死扑灭的『异端』，结果被钉十字架的信仰，后来成了罗马的国教</p>
          <div class="body"><p>耶稣在巴勒斯坦传道、医病、收门徒，被犹大出卖，以『犹太人的王』之罪被钉十字架。罗马本想以此吓阻运动，谁知三百年后，君士坦丁皈依，基督教竟成帝国正统。一场处决，反酿出笼罩西方千年的宗教。历史的反讽，莫过于此。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>『加利利』乡间的一场死刑，靠信徒口传与保罗的向外传播成为普世宗教；十字架本是罗马最羞辱的刑罚，最后被当作救赎符号。</p></div>
