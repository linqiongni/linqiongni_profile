          <h1>海瑞</h1>
          <p class="hook">史上第一清官，却被同僚当怪物躲着走，连嘉靖都被他的奏折气到发抖</p>
          <div class="body"><p>海瑞任知县时穿布袍、吃粗粮、老母祝寿才割二斤肉；他买好棺材、遣散仆从，上《治安疏》直骂嘉靖『家家净也』，吓得皇帝暴怒又惜才，关而不杀。同僚怕与他同列——太干净的人，照得旁人都不堪。清官的孤独，恰是体制的羞耻。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他死时同僚凑钱才办丧，箱内仅俸金八两、葛布一段、旧衣数件。『为公』到这种程度，对官僚系统就是一间无解的照妖镜。</p></div>
