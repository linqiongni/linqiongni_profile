          <h1>曹操</h1>
          <p class="hook">历史上最大的『公关受害者』：真实的他，是诗人、能臣，一辈子没称帝</p>
          <div class="body"><p>戏曲和《三国演义》把曹操钉死成白脸奸雄，可正史里的他，二十岁棒杀权贵、执法严明，迎汉献帝、屯田安民、唯才是举，写得出『东临碣石，以观沧海』的苍茫。他终其一生只做魏王，称帝的是他儿子。那个被脸谱化的『奸』，多半是胜者写的剧本。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他『唯才是举』不问品德，起用降俘、偷盗之徒也能成栋梁；又修水利、复农桑、抑制豪强，是实打实的治国能臣。『奸雄』二字，本就出自许劭之口的评价，后来被说书人坐实成性格。</p></div>
