          <h1>凯撒</h1>
          <p class="hook">终结罗马共和的人，死在元老院里最信任的朋友那一刀下</p>
          <div class="body"><p>凯撒跨过卢比孔河、打赢内战、自任终身独裁官，距称王只一步。公元前44年3月15日，他在元老院被包括养子布鲁图斯在内的六十余名元老刺了二十三刀。弥留那句『还有你吗，布鲁图斯？』成了背叛的代名词。他亲手埋葬了共和，共和也亲手埋了他。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>『布鲁图斯，你也在吗？』拉丁原文更有力。他留下一篇《高卢战记》当自我辩白——西方最早的『公关式历史写作』之一，两千年后仍在教人怎样讲自己的故事。</p></div>
