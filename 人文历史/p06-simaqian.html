          <h1>司马迁</h1>
          <p class="hook">中国史学的父亲，是个受了宫刑、靠忍辱活下来才写完书的囚徒</p>
          <div class="body"><p>司马迁承父志写《史记》，却因替兵败投降的李陵说情，触怒汉武帝，被判宫刑。这对士人比死还耻辱，他本想一死了之，只为『究天人之际，通古今之变』的未竟之书而活了下来。一部被鲁迅誉为『史家之绝唱』的巨著，底色是一个男人用余身换来的尊严。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>《史记》写帝王也写游侠、商贾、刺客，是‘通史’里少见的「给人立传」的气度。他写黄帝到汉武三千年，用的正是中国最早的纪传体骨架——这一写法影响了之后两千年正史。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《典籍里的中国·史记》》 · 《《书简阅中国》》</div>
