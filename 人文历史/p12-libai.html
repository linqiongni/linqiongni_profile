          <h1>李白</h1>
          <p class="hook">人人叫他『诗仙』，可他一生真正追逐的，是权力与门路而非山水</p>
          <div class="body"><p>李白纵情诗酒、天子呼来不上船，看似不慕荣利，实则年少便有『申管晏之谈，谋帝王之术』的雄心，两次入赘富家、广结权贵，还一头扎进永王李璘幕府想博功名，结果获罪流放。他至死都放不下那点经世念想，传说醉中揽月溺亡。诗里的仙气，盖住的是一辈子没当成的政治家。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>唐代文人进身有『行卷』『温卷』——考前把诗作投给权贵显达求推荐，李白正是此中高手，也正因此最服不了科举。他的浪漫，底下是一套极清醒的社交计算。</p></div>
