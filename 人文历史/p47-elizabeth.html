          <h1>伊丽莎白一世</h1>
          <p class="hook">终身不嫁的『童贞女王』，治国的一大法宝竟是法律化的国家海盗</p>
          <div class="body"><p>伊丽莎白一世以不婚维系权力平衡，又暗中颁发『私掠许可证』，让德雷克之类船长去抢西班牙船队、分赃入国库，1588年更凭这些海上亡命徒击溃无敌舰队。『荣耀女王』的光环下，是一套国家背书、以劫掠为财政的灰色生意。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>她执政四十年，英格兰从边的穷岛变成海权玩家；『私掠』后来成了满清、近代日本都学过的手法——国家给海盗发执照，胜利者称之为海军。</p></div>
