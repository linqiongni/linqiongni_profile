          <h1>韩信</h1>
          <p class="hook">受过胯下之辱的『兵仙』，帮刘邦打下半壁江山，却被萧何骗进长乐宫诛杀</p>
          <div class="body"><p>韩信早年穷得蹭饭、甘受市井无赖胯下之辱，一朝拜将，明修栈道暗度陈仓，灭魏破赵降燕吞齐，战无不胜。可他功高震主又迟疑不决，犹豫要不要三分天下，最终被吕后诱杀，临死方悟『成也萧何，败也萧何』。一个能指挥千军的人，却算不透庙堂里的一寸人心。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他伐魏用陈仓、破赵用背水、命令行军「半渡而击」，是把兵法学到骨子里的人，却不懂政治里最重要的是『别让人害怕你』。齐王、楚王、淮阴侯三起三落，每一步都被别人的一句话决定。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《中国通史·西汉》》 · 《《书简阅中国》》</div>
