          <h1>路易十四</h1>
          <p class="hook">『太阳王』把贵族们请进凡尔赛的金笼，用奢华软禁换来了王权独断</p>
          <div class="body"><p>路易十四修凡尔赛宫，不是为享受，而是把桀骜的法国大贵族悉数迁来，用晨礼、晚宴、假发与舞会的繁文缛节，把他们的精力耗在争宠里，再无力在地方作乱。他一句『朕即国家』，背后是精密的软控制。绝对权力，往往先把人喂饱再捆住。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他每日『起床礼、穿衣礼、就寝礼』都要官员在场，等于把权力写成流程。法国宫廷礼仪至今是外交礼仪的母版——软性控制的长期样本。</p></div>
