          <h1>但丁</h1>
          <p class="hook">意大利语文学之父，是在流放途中、客死异乡时写下《神曲》的</p>
          <div class="body"><p>但丁三十五岁卷入佛罗伦萨党争，被判永久流放、回乡即烧死。他再未踏足故乡，在颠沛中历时十余年写成《神曲》，用托斯卡纳方言而非拉丁文写作，无意间奠定了意大利语。故乡把他放逐，他却用故乡的方言为它立了不朽。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他旨在写『一部人类之书』，把托马斯·阿奎那的经院哲学、柏拉图、亚里士多德全塞进地狱与天堂的几何结构里——中世纪世界观的终极总结。</p></div>
