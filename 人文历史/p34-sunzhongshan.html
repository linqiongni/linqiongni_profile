          <h1>孙中山</h1>
          <p class="hook">中华民国之父，前半生基本是个屡败屡战的流亡失败者</p>
          <div class="body"><p>孙中山十次起义九败，长期流亡海外、被列国驱逐，最惨时连房租都付不出，靠华侨接济。直到1911年武昌一声枪响，他尚在海外，革命却成功了。他喊出『革命尚未成功，同志仍须努力』，是真心话。伟大的开创者，往往先认领了漫长的不被理解。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他提出三民主义、五权宪法，是第一个把现代国家方案系统写出来的中国人；可直到死都未能真正掌握军队与预算。理想很硬，工具很软。</p></div>
