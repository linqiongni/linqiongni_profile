          <h1>孟郊</h1>
          <p class="hook">写下『慈母手中线，游子身上衣』的人，母亲去世时竟穷得立不起一块像样的碑</p>
          <div class="body"><p>孟郊四十六岁才中进士，半生潦倒，五十岁做溧阳尉，把老母接来奉养，写下那首催泪的《游子吟》。可他官微禄薄、一生清苦，母亲亡故时，竟无力治办像样的丧事与墓碑。一句温柔的诗，背后是一个儿子最深的愧疚与无力——这正是读史最戳心的地方：名篇的光，照不见作者身后的暗。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>唐代进士及第后仍多任低阶判佐，孟郊的『沾衣欲湿杏花雨』式的清贫，是当时大量中层文官的真实处境。诗愈真，生活愈薄。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《千古风流人物》》 · 《《书简阅中国》》</div>
