<script>(function(){if(window.__aqKitV3)return;window.__aqKitV3=1;try{
var cv=document.getElementById('aq-scene');if(!cv)return;var g=cv.getContext('2d');if(!g)return;
var host=document.getElementById('aq-bg');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var mobile=matchMedia('(max-width: 768px)').matches;
var N=mobile?3:6,PH=8,STEP=33.3,PI2=6.283185307179586;
var w=0,h=0,d=1,raf=0,last=0,el=0,lp=0,amb=0,rt=0,built=0,vis=1;
var mouse={x:-9999,y:-9999},rips=[],sprites=[],fish=[];
var dark=1,TON=null,EYE='',GAIN=1,RIP=null,COMP='source-over';
function lum(){var s=getComputedStyle(document.body).backgroundColor||'rgb(255,255,255)';
var m=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(s);if(!m)return 255;
return 0.2126*(+m[1])+0.7152*(+m[2])+0.0722*(+m[3]);}
/* 配色随底色自适应：深底用金鱼、浅底用墨金剪影；切换主题后重算即可 */
function palette(){
dark=lum()<128?1:0;
TON=dark
?[['rgba(87,108,128,.22)','rgba(168,152,120,.72)','rgba(210,176,106,.60)','rgba(96,122,147,.16)'],
['rgba(80,104,124,.20)','rgba(150,146,126,.66)','rgba(196,168,112,.54)','rgba(92,118,142,.14)'],
['rgba(94,114,134,.18)','rgba(176,158,124,.62)','rgba(216,182,110,.52)','rgba(104,128,150,.14)']]
:[['rgba(58,74,92,.20)','rgba(96,104,116,.52)','rgba(150,116,58,.44)','rgba(70,88,108,.14)'],
['rgba(52,68,86,.18)','rgba(88,104,120,.48)','rgba(132,110,62,.40)','rgba(64,82,102,.12)'],
['rgba(62,78,96,.17)','rgba(104,112,124,.46)','rgba(158,126,64,.38)','rgba(74,92,112,.12)']];
EYE=dark?'rgba(235,210,156,.88)':'rgba(120,96,48,.5)';
GAIN=dark?1:0.92;
RIP=dark?['rgba(150,172,200,','rgba(218,186,126,']:['rgba(150,160,176,','rgba(176,140,70,'];
COMP=dark?'lighter':'source-over';}
function initFish(){fish=[];
for(var i=0;i<N;i++){fish.push({x:(i%2===0?-0.12+i*0.17:1.12-i*0.13),y:0.51+(i%4)*0.09,
s:mobile?20+(i%3)*7:23+(i%4)*10,v:0.000012+(i%4)*0.000003,a:(0.17+(i%3)*0.05)*GAIN,
dir:(i%2===0?1:-1),ph:i*1.37,depth:0.48+(i%4)*0.12,t:i%3,
vx:0,vy:0,ang:(i%2===0?0:Math.PI)});}}
function paint(c,s,t,bend,tail){
var gr=c.createLinearGradient(-s,0,s,0);
gr.addColorStop(0,t[0]);gr.addColorStop(.42,t[1]);gr.addColorStop(.72,t[2]);gr.addColorStop(1,t[3]);
c.fillStyle=gr;
c.beginPath();c.moveTo(-s*.72,bend*.18);
c.bezierCurveTo(-s*.42,-s*.34,s*.34,-s*.30,s*.80,-s*.05);
c.quadraticCurveTo(s*.95,0,s*.80,s*.07);
c.bezierCurveTo(s*.34,s*.30,-s*.42,s*.34,-s*.72,bend*.18);
c.closePath();c.fill();
c.save();c.translate(-s*.68,bend*.18);c.rotate(tail);
c.beginPath();c.moveTo(0,0);
c.bezierCurveTo(-s*.30,-s*.08,-s*.62,-s*.42,-s*.78,-s*.32);
c.quadraticCurveTo(-s*.55,0,-s*.78,s*.32);
c.bezierCurveTo(-s*.62,s*.42,-s*.30,s*.08,0,0);
c.fill();c.restore();
c.beginPath();c.moveTo(-s*.10,-s*.25);c.quadraticCurveTo(s*.05,-s*.52,s*.28,-s*.22);c.closePath();c.fill();
c.beginPath();c.moveTo(s*.12,s*.20);c.quadraticCurveTo(s*.28,s*.43,s*.40,s*.14);c.closePath();c.fill();}
function build(){sprites=[];
for(var i=0;i<fish.length;i++){var f=fish[i],blur=(1-f.depth)*2.1;
var pw=f.s*2.2+blur*8,ph=f.s*1.3+blur*8,arr=[];
for(var k=0;k<PH;k++){var swim=Math.sin(k/PH*PI2);
var c=document.createElement('canvas');
c.width=Math.max(1,Math.ceil(pw*d));c.height=Math.max(1,Math.ceil(ph*d));
var q=c.getContext('2d');if(!q)continue;
q.setTransform(d,0,0,d,0,0);q.translate(pw/2,ph/2);q.scale(1,0.72);
if(blur>0.05)q.filter='blur('+blur+'px)';
paint(q,f.s,TON[f.t],swim*f.s*.10,swim*.24);
q.filter='none';q.fillStyle=EYE;q.globalAlpha=.5;
q.beginPath();q.arc(f.s*.68,-f.s*.055,Math.max(1.15,f.s*.032),0,PI2);q.fill();

function size(){d=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;
cv.width=Math.max(1,Math.floor(w*d));cv.height=Math.max(1,Math.floor(h*d));
cv.style.width=w+'px';cv.style.height=h+'px';g.setTransform(d,0,0,d,0,0);}
function addRip(x,y,s){if(rips.length>12)rips.shift();rips.push({x:x,y:y,r:5,l:1,s:s});}
function ring(o){var base=o.l*o.s;if(base<=0.004)return;
var R=o.r+26;g.save();g.translate(o.x,o.y);g.scale(1,0.36);g.globalCompositeOperation=COMP;
var gr=g.createLinearGradient(-R,0,R,0);
gr.addColorStop(0,RIP[0]+'0)');gr.addColorStop(.3,RIP[0]+'.5)');
gr.addColorStop(.58,RIP[1]+'1)');gr.addColorStop(1,RIP[0]+'0)');
g.strokeStyle=gr;
for(var i=0;i<3;i++){g.globalAlpha=base*(1-i/3.4)*(dark?.5:.42);
g.beginPath();g.ellipse(0,0,o.r+i*12,o.r+i*12,0,0,PI2);
g.lineWidth=i?0.7:1.2;g.stroke();}
g.restore();}
function render(t){if(!w||!h)return;g.clearRect(0,0,w,h);
for(var i=0;i<rips.length;i++)ring(rips[i]);
if(!built)return;
var ord=fish.slice().sort(function(a,b){return a.depth-b.depth;});
for(var k=0;k<ord.length;k++){var f=ord[k],fr=sprites[fish.indexOf(f)];
if(!fr||!fr.length)continue;
var x=f.x*w,y=f.y*h+Math.sin(t*0.00032+f.ph)*14*f.depth;
var idx=Math.floor(((t*0.0032+f.ph)/PI2)*PH)%PH;
var sp=fr[(idx+PH)%PH];
/* 鱼头朝向真实游动方向（鼠标方向）：水平镜像 + 俯仰，避免翻转后肚皮朝上 */
var flip=Math.cos(f.ang)<0;
g.save();g.globalAlpha=f.a;g.translate(x,y);
g.rotate(Math.sin(f.ang)*(flip?-1:1)*0.9+Math.sin(t*0.00055+f.ph)*0.03);

g.drawImage(sp.i,-sp.w/2,-sp.h/2,sp.w,sp.h);g.restore();}}
function step(){if(!reduce){
var act=mouse.x>-9000;
for(var i=0;i<fish.length;i++){var f=fish[i],tx,ty;
if(act){
/* 朝鼠标游：吸引力 + 轻微切向绕游，避免整群叠在指针上 */
var nx=mouse.x/w,ny=mouse.y/h;
var dx=nx-f.x,dy=ny-f.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
var pull=Math.min(0.0024,0.0005+dist*0.02),sw=0.0007*(1-f.depth);
tx=f.x+dx/dist*pull-dy/dist*sw;ty=f.y+dy/dist*pull+dx/dist*sw;
}else{tx=f.x+f.v*STEP*f.dir;ty=f.y;}
f.vx+=(tx-f.x)*0.12;f.vy+=(ty-f.y)*0.12;
var vm=Math.sqrt(f.vx*f.vx+f.vy*f.vy),vmax=0.0045;
if(vm>vmax){f.vx=f.vx/vm*vmax;f.vy=f.vy/vm*vmax;}
f.x+=f.vx;f.y+=f.vy;
var vl=Math.sqrt(f.vx*f.vx+f.vy*f.vy);
if(vl>1e-6){var want=Math.atan2(f.vy,f.vx),df=want-f.ang;
while(df>Math.PI)df-=PI2;while(df<-Math.PI)df+=PI2;f.ang+=df*0.14;}
if(f.x>1.16)f.x=-0.16;else if(f.x<-0.16)f.x=1.16;
if(f.y>1.12)f.y=-0.12;else if(f.y<-0.12)f.y=1.12;}
if(el-amb>4400){amb=el;addRip(w*(0.56+Math.random()*0.3),h*(0.46+Math.random()*0.26),0.22);}
for(var j=rips.length-1;j>=0;j--){rips[j].r+=1.1;rips[j].l-=0.0116;if(rips[j].l<=0)rips.splice(j,1);}}
render(el);}
function loop(now){raf=requestAnimationFrame(loop);
var dt=now-last;if(dt<STEP)return;last=now-(dt%STEP);el+=STEP;
if(!built)build();

function stop(){if(raf)cancelAnimationFrame(raf);raf=0;}
function start(){if(reduce||raf||!vis)return;last=performance.now();raf=requestAnimationFrame(loop);}
function onSize(){clearTimeout(rt);rt=setTimeout(function(){size();build();render(el);},160);}
function retheme(){var wasDark=dark;palette();if(wasDark!==dark){initFish();}
built=0;build();render(el);}
size();palette();initFish();build();
addEventListener('resize',onSize);
addEventListener('pointermove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;
var n=performance.now();if(n-lp>190){lp=n;addRip(e.clientX,e.clientY,dark?0.52:0.46);
if(reduce){if(!built)build();render(el);}}},{passive:true});
addEventListener('mouseleave',function(){mouse.x=-9999;mouse.y=-9999;});
window.addEventListener('site-theme',function(){setTimeout(retheme,0);});
window.addEventListener('message',function(e){var m=e.data||{};if(m.type==='theme')setTimeout(retheme,60);});

if(window.IntersectionObserver&&host){new IntersectionObserver(function(es){
vis=es[0].isIntersecting?1:0;vis?start():stop();},{threshold:0}).observe(host);}
addRip(innerWidth*0.72,innerHeight*0.58,0.26);
if(reduce){render(0);}else{start();}
}catch(e){}})();</script>

<script>(function(){
  if(window.__themeBridge)return;window.__themeBridge=1;
  var r=document.documentElement;
  function apply(m){
    m=(m==='light')?'light':'dark';
    r.setAttribute('data-theme',m);
    try{ r.setAttribute('data-theme-default',m); }catch(e){}
    try{ window.dispatchEvent(new CustomEvent('site-theme',{detail:m})); }catch(e){}
  }
  // 主站导航栏的太阳/月亮按钮 → ThemeIframe 用 postMessage 把模式推进来
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='theme'&&(d.mode==='light'||d.mode==='dark')){ apply(d.mode); }
  });
  function standalone(){ try{ return window.parent===window; }catch(e){ return false; } }
  function addBtn(){
    if(!standalone()||document.getElementById('theme-toggle-btn'))return;
    // 子站自带的 assets/app.js 已经提供了主题按钮（#themeBtn）时不要再加，避免出现两个。
    if(document.getElementById('themeBtn'))return;
    var b=document.createElement('button');
    b.id='theme-toggle-btn';b.type='button';
    b.style.cssText=[
      'position:fixed','top:56px','right:16px','z-index:9999',
      'padding:6px 14px','border-radius:999px','cursor:pointer',
      'font-size:13px','font-family:inherit',
      'border:1px solid var(--line,#CFCABE)',
      'background:var(--card,#FFFFFF)',
      'color:var(--txt,#23201B)',
      'box-shadow:0 1px 3px rgba(0,0,0,.08)',
      'transition:border-color .15s,color .15s'
    ].join(';');
    if(window.matchMedia&&window.matchMedia('(max-width: 640px)').matches){
      b.style.top='auto';b.style.bottom='16px';b.style.right='12px';b.style.padding='5px 10px';
    }
    function paint(){ b.textContent = r.getAttribute('data-theme')==='dark' ? '切换浅色' : '切换深色'; }
    b.addEventListener('click',function(){
      apply(r.getAttribute('data-theme')==='dark'?'light':'dark');
      paint();
    });
    paint();
    (document.body||r).appendChild(b);
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',addBtn); }
  else { addBtn(); }
})();</script>
