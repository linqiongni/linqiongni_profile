<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>韩语课程对照本</title>
  <link rel="stylesheet" href="assets/style.css?v=20261026d" />
  <!-- 嵌入主站时立即透明，避免闪色（JS 慢一拍会闪）；同时先猜一次主站主题，
       让暗色模式首屏就是浅色字，不必等 postMessage 到达才切换。 -->
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('embedded');
      try {
        var _top = window.top.document.documentElement;
        var _dark = _top.classList.contains('dark') || _top.getAttribute('data-theme') === 'dark';
        if (_dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { /* 跨域（本地预览等）：留给父窗口的 theme 消息纠正 */ }
    }
  </script>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <button id="menuBtn" class="menu-btn" aria-label="目录">☰</button>
      <div class="brand">韩语课程对照本</div>
      <div class="spacer"></div>
      <input id="jump" class="jump" type="number" min="1" max="130" inputmode="numeric" placeholder="跳到第 N 单元" aria-label="跳到第 N 单元" />
      <input id="search" class="search" type="search" placeholder="搜标题 / 中文…" />
      <button id="themeBtn" class="menu-btn" aria-label="切换主题" title="切换深浅色">◐</button>
    </header>
    <div class="row">
      <aside id="side" class="side"></aside>
      <div class="mainwrap" id="mainwrap">
        <div class="progress" id="progress"><i></i></div>
        <div class="main" id="main"></div>
      </div>
      <aside id="toc" class="toc"></aside>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>

  <script src="assets/data.js?v=20261026d"></script>
  <script src="assets/app.js?v=20261026d"></script>
</body>
</html>
