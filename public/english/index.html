<script id="embedded-glassify">(function(){
try{
if(!window.parent||window.parent===window)return;
if(!document.documentElement.classList.contains("embedded"))return;
function dark(r,g,b){return (0.299*r+0.587*g+0.114*b)<130;}
/* 2026-09-30 白天模式修复：原判据「亮度<130 才算该清的深色底」在浅色主题下完全失效——
   子站白天模式的表面色（--bg #FDFCF9 / --card #FFFFFF / --bg-alt #F7F4EC）亮度都很高，
   一条都不命中，整片米白不透明地把主站固定背景 + 鱼影盖死（Andy 09-29 反馈）。
   新判据 = 「中性表面色一律清，彩色强调色保留」：
   - 中性（通道极差 < 32）→ 是背景板，清；
   - 彩色且非极暗（极差 >= 32 且亮度 >= 56）→ 强调色（金/红/绿/蓝一类的实心块、
     白字金底按钮、金色进度条），保留；顺带修掉旧逻辑的副作用：白天模式
     .stations a.on「白字 + 深金底 #8C7443」曾被判成深色清掉 = 白字隐形。
   - 极暗的彩色（#091A2E / #102943 这套深海渐变，亮度 < 56）→ 仍按背景板清。 */
function surface(r,g,b){var mx=Math.max(r,g,b),mn=Math.min(r,g,b),lum=0.299*r+0.587*g+0.114*b;return !((mx-mn)>=32&&lum>=56);}
function glass(el,force){
if(force){el.__gBF=0;el.__gImg=0;el.__gBg=0;}
var cs=getComputedStyle(el);
var bf=cs.backdropFilter||cs.webkitBackdropFilter;
if(bf&&bf!=="none"&&!el.__gBF){
el.__gBF=1;
el.style.setProperty("backdrop-filter","none","important");
el.style.setProperty("-webkit-backdrop-filter","none","important");
}
var __norm=function(s){return String(s).replace(/color\(\s*srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)(?:\s*\/\s*([\d.]+))?\s*\)/,function(_,r,g,b,a){return "rgba("+Math.round(parseFloat(r)*255)+","+Math.round(parseFloat(g)*255)+","+Math.round(parseFloat(b)*255)+","+(a===undefined?1:a)+")";});};
var __normAll=function(s){return String(s).replace(/color\(\s*srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)(?:\s*\/\s*([\d.]+))?\s*\)/g,function(_,r,g,b,a){return "rgba("+Math.round(parseFloat(r)*255)+","+Math.round(parseFloat(g)*255)+","+Math.round(parseFloat(b)*255)+","+(a===undefined?1:a)+")";});};
var gi=cs.backgroundImage;
if(gi&&gi.indexOf("gradient")>=0){
var stops=__normAll(gi).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/g)||[];
var heavySurface=false;
for(var si=0;si<stops.length;si++){
var sm=stops[si].match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
if(!sm)continue;
var sa=sm[4]===undefined?1:parseFloat(sm[4]);
if(sa>=0.3&&surface(+sm[1],+sm[2],+sm[3])){heavySurface=true;break;}
}
if(heavySurface&&!el.__gImg){
/* 2026-09-29c 尺寸保护彻底废除（两轮实锤：按尺寸豁免谁，谁就蓝）：除 .tab 外一律清透明。
   .tab 豁免原因=死锁：胶囊底色随选中态切换，被 inline transparent !important 永久压制后
   金底再也救不回（09-29 凌晨实锤）。渐变分支同口径 */
if(!(el.classList.contains("tab")||(el.closest&&el.closest("nav.tabs")))){
el.__gImg=1;
el.style.setProperty("background-image","none","important");
}}
}
var m=__norm(cs.backgroundColor).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
if(m){
var a=m[4]===undefined?1:parseFloat(m[4]);
if(a>=0.85&&!el.__gBg){
var r=+m[1],g=+m[2],b=+m[3];
/* 2026-09-29c 尺寸保护彻底废除：一律清透明（恢复用户认可的全透明基准），仅豁免 .tab
   2026-09-30 判据由 dark() 换成 surface()：深浅主题一视同仁，见上方注释 */
if(!(el.classList.contains("tab")||(el.closest&&el.closest("nav.tabs")))&&surface(r,g,b)){
el.__gBg=1;
el.style.setProperty("background-color","transparent","important");
var bm=__norm(cs.borderTopColor).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
if(bm){
var br=+bm[1],bg2=+bm[2],bb=+bm[3];
var ba=bm[4]===undefined?1:parseFloat(bm[4]);

el.style.setProperty("border-color","rgba("+br+","+bg2+","+bb+",0.4)","important");
}}
}}}
var bs=cs.boxShadow;
if(bs&&bs!=="none"&&cs.boxShadow){}
}
function run(force){
var els=document.querySelectorAll("*");
for(var i=0;i<els.length;i++)glass(els[i],force);
}
["DOMContentLoaded","load"].forEach(function(ev){window.addEventListener(ev,function(){run();setTimeout(function(){run(true);},400);setTimeout(function(){run(true);},1500);});});
var mo=new MutationObserver(function(muts){
for(var k=0;k<muts.length;k++){var adds=muts[k].addedNodes;
for(var i=0;i<adds.length;i++){var n=adds[i];

if(n.querySelectorAll){var ds=n.querySelectorAll("*");for(var j=0;j<ds.length;j++)glass(ds[j]);}}}}
});
mo.observe(document.documentElement,{childList:true,subtree:true});
/* 2026-09-29 隐藏面板补刀：tab 页 display:none 的面板在加载时尺寸为 0，
   会被上方 200x120 尺寸保护跳过（不清色也不打标记）；用户切 tab 后面板
   变得可见，深色纯底/渐变原样露出。class/style 变更不触发 childList 观察，
   所以这里单独监听属性变化，防抖后整页重扫（run 非强制，已标记元素会跳过，
   自身 setProperty 引起的变更不会再产生新改动，不会死循环）。 */
var __gDeb=null;
var __gForce=false;
var mo2=new MutationObserver(function(muts){
/* 2026-09-30 白天模式修复（第二处）：主题桥切的是 <html data-theme>，原先只监听
   class/style，切到 light 后整页底色由深翻浅，观察器不触发 → 浅色不透明底原样留在
   主站背景板之上（鱼影被盖）。这里补监听 data-theme，并且必须 force 重扫：
   非强制 run() 会跳过已打标元素，而深浅切换后同一元素的底色已经变了。 */
var themeChanged=false;
for(var k=0;k<muts.length;k++){if(muts[k].attributeName==="data-theme")themeChanged=true;}
if(themeChanged)__gForce=true;

__gDeb=setTimeout(function(){var f=__gForce;__gDeb=null;__gForce=false;run(f);},120);
});
mo2.observe(document.documentElement,{attributes:true,attributeFilter:["class","style","data-theme"],subtree:true});
}catch(e){}
})();</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>身边的英语 · 一个外企法务的一年</title>
<style>
  :root{
    --bg:#FBF9F4;
    --paper:#FFFFFF;
    --side:#F6F2E9;
    --ink:#26241F;
    --ink-soft:#4A463D;
    --muted:#8B8478;
    --line:#EAE3D6;
    --line-soft:#F1EBE0;
    --gold:#B89F6B;
    --gold-deep:#8A6E3B;
    --gold-soft:#F4EBD9;
    --hl:#F7EFDC;
    --hl-ink:#5A4520;
    --bar:#FFFFFF;
    --shadow:0 1px 2px rgba(60,50,30,.05);
    --side-w:272px;
    /* 英文：先取系统内最优雅的阅读衬线（Iowan / Baskerville / Palatino），Georgia 兜底 */
    --en-serif:"Iowan Old Style",Charter,Baskerville,"Palatino Linotype",Palatino,"Book Antiqua",Constantia,Georgia,"Times New Roman",serif;
    /* 大标题：Baskerville 系，清瘦、字腔开、不张扬 */
    --en-display:Baskerville,"Hoefler Text","Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
    /* 斜体：Georgia 的斜体过于花哨，改用更克制的 Baskerville 斜体 */
    --en-ital:Baskerville,"Iowan Old Style","Palatino Linotype","Times New Roman",Georgia,serif;
    --cjk-serif:"Songti SC",STSong,"Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    --serif:var(--en-serif),var(--cjk-serif);
    --display:var(--en-display),var(--cjk-serif);
    --ital:var(--en-ital),var(--cjk-serif);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#1C1C1E;
    --paper:#242426;
    --side:#242426;
    --ink:#F4EFE4;
    --ink-soft:#86868B;
    --muted:#86868B;
    --line:#2C2C2E;
    --line-soft:#2C2C2E;
    --gold:#C9A86A;
    --gold-deep:#C9A86A;
    --gold-soft:#3A342A;
    --hl:#2A2418;
    --hl-ink:#F4EFE4;
    --bar:#242426;
    --shadow:none;
  }

html[data-theme="dark"] ::-webkit-scrollbar { width: 10px; height: 10px; }
html[data-theme="dark"] ::-webkit-scrollbar-track { background: #1C1C1E; }
html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #2C2C2E; border-radius: 5px; border: 2px solid #1C1C1E; }
html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: #3A3A3C; }
html[data-theme="dark"] { scrollbar-width: thin; scrollbar-color: #2C2C2E #1C1C1E; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  .h-en,.p-en,.note .e,.brand{font-kerning:normal;font-variant-ligatures:common-ligatures contextual;}

  .app{display:flex;height:100%;}
  .side{
    flex:0 0 var(--side-w);width:var(--side-w);height:100%;
    background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;transition:transform .24s ease, margin-left .24s ease;z-index:40;
  }
  .app.collapsed .side{margin-left:calc(var(--side-w) * -1);}
  .side-top{padding:18px 16px 10px;}
  .brand{font-family:var(--display);font-size:18.5px;font-weight:500;letter-spacing:.6px;margin:0;}
  .brand-sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .side-search{padding:0 16px 10px;}
  .side-search input{
    width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:10px;padding:9px 11px;font-size:13px;outline:none;font-family:var(--sans);
  }
  .side-search input:focus{border-color:var(--gold);}
  .dir{flex:1;overflow-y:auto;padding:4px 10px 88px;overscroll-behavior:contain;}
  .dir-group{
    display:flex;align-items:center;gap:6px;width:100%;cursor:pointer;text-align:left;
    font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);
    margin:14px 0 4px;padding:7px 10px;background:var(--gold-soft);border:0;border-radius:9px;
  }
  .dir-group:hover{background:var(--hl);color:var(--gold-deep);}
  .dir-group .caret{flex:0 0 auto;font-size:10px;color:var(--muted);transition:transform .15s;}
  .grp.fold .grp-b{display:none;}
  .grp.fold .dir-group .caret{transform:rotate(-90deg);}
  .dir-group .en{font-weight:400;font-size:10.5px;color:var(--muted);font-family:var(--ital);font-style:italic;letter-spacing:.2px;}
  .dir-group .cnt{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .dir-day{
    display:flex;align-items:center;gap:6px;width:100%;cursor:pointer;text-align:left;
    font-family:var(--sans);font-size:11.5px;color:var(--muted);letter-spacing:.2px;
    margin:2px 0 2px 10px;padding:4px 10px;background:transparent;border:0;border-radius:9px;
  }
  .dir-day:hover{background:var(--gold-soft);color:var(--ink);}
  .dir-day .caret{flex:0 0 auto;font-size:9px;transition:transform .15s;}
  .day.fold .day-b{display:none;}
  .day.fold .dir-day .caret{transform:rotate(-90deg);}
  .dir-day .en{font-size:10px;color:var(--muted);font-family:var(--ital);font-style:italic;letter-spacing:.2px;}
  .day-b .item{margin-left:20px;}
  .grp-b>.item{margin-left:8px;}
  .dir-view{
    display:flex;align-items:center;gap:7px;width:100%;cursor:pointer;text-align:left;
    font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);
    margin:12px 0 2px;padding:8px 10px;background:var(--paper);
    border:1px solid var(--line);border-radius:10px;
  }
  .dir-view:hover{border-color:var(--gold);color:var(--gold-deep);}
  .dir-view .caret{flex:0 0 auto;font-size:10px;color:var(--muted);transition:transform .15s;}
  .view.fold .view-b{display:none;}
  .view.fold .dir-view .caret{transform:rotate(-90deg);}
  .dir-view .en{font-weight:400;font-size:10.5px;color:var(--muted);font-family:var(--ital);font-style:italic;letter-spacing:.2px;}
  .view .dir-group{margin:8px 0 4px;}
  .grp.hide,.day.hide,.view.hide{display:none;}
  .item{
    display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;
    cursor:pointer;border:1px solid transparent;
  }
  .item:hover{background:var(--gold-soft);}
  .item.on{background:var(--paper);border-color:var(--line);box-shadow:var(--shadow);}
  .item .tm{flex:0 0 46px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .item .tx{min-width:0;}
  .item .t1{display:block;font-size:13px;color:var(--ink);line-height:1.35;}
  .item .t2{display:block;font-size:11px;color:var(--muted);line-height:1.35;margin-top:2px;font-family:var(--ital);font-style:italic;letter-spacing:.2px;}
  .item .done{margin-left:auto;font-size:11px;color:var(--gold-deep);flex:0 0 auto;}
  .item.hide{display:none;}

  .main{flex:1;min-width:0;height:100%;overflow-y:auto;scroll-behavior:smooth;}
  .reader{max-width:720px;margin:0 auto;padding:28px 26px 120px;}
  @media (max-width:760px){ .reader{padding:20px 18px 120px;} }

  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
    background:var(--bg);border-bottom:1px solid var(--line-soft);
    margin:-28px -26px 20px;padding:10px 26px;
  }
  @media (max-width:760px){ .topbar{margin:-20px -18px 16px;padding:9px 18px;} }
  .menu{display:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;width:34px;height:32px;font-size:15px;cursor:pointer;}
  /* 全屏独立打开时（手机端从主站跳进来）才显示「← 主页」；嵌在 iframe 里时由浏览器返回兜底。
     注意：默认用 display:none，显示时加 .on 类切换——不能用 style.display="" 清空（会落回默认 none）。 */
  .back-home{display:none;text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  .back-home.on{display:inline-block;}
  @media (max-width:900px){
    .menu{display:block;}
    .side{position:fixed;left:0;top:0;}
    .app.collapsed .side{transform:translateX(-100%);margin-left:0;}
  }
  .crumb{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mini{
    border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
    border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;
  }
  .mini.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-deep);}

  .scene-head{margin-bottom:22px;}
  .kicker{font-size:10.5px;letter-spacing:2.2px;color:var(--gold-deep);text-transform:uppercase;font-weight:500;}
  .h-en{font-family:var(--display);font-size:28px;line-height:1.25;margin:9px 0 0;font-weight:500;letter-spacing:.3px;}
  @media (max-width:760px){ .h-en{font-size:23px;} }
  .h-zh{font-size:14px;color:var(--muted);margin-top:6px;}
  .lead{
    margin-top:14px;font-size:13.5px;color:var(--ink-soft);line-height:1.75;
    border-left:2px solid var(--gold);padding-left:12px;
  }
  .head-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center;}
  .play-this{
    display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
    background:var(--gold);color:#fff;border-radius:999px;padding:8px 16px;font-size:13.5px;font-family:var(--sans);
  }
  html[data-theme="dark"] .play-this{color:#1C1C1E;}
  .play-this:hover{background:var(--gold-deep);color:#fff;}

  .para{margin:0 0 18px;}
  .p-en{font-family:var(--serif);font-size:18.5px;line-height:1.95;color:var(--ink);letter-spacing:.06px;font-weight:400;}
  @media (max-width:760px){ .p-en{font-size:17px;} }
  .p-zh{font-size:13.5px;line-height:1.8;color:var(--muted);margin-top:7px;}
  .s{cursor:pointer;border-radius:3px;transition:background .15s;}
  .s:hover{background:var(--gold-soft);}
  .s.on{background:var(--hl);color:var(--hl-ink);}
  .para.say .p-en{padding-left:14px;border-left:2px solid var(--line);font-style:italic;font-family:var(--ital);}
  .who{display:inline-block;font-size:10px;letter-spacing:1.2px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;font-weight:500;}

  .notes{margin-top:30px;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:16px 18px;}
  .notes h3{font-size:12px;letter-spacing:1px;color:var(--muted);margin:0 0 12px;text-transform:uppercase;font-weight:600;}
  .note{margin-bottom:11px;}
  .note:last-child{margin-bottom:0;}
  .note .e{font-family:var(--serif);font-size:14.5px;color:var(--gold-deep);cursor:pointer;letter-spacing:.2px;}
  .note .c{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .note .x{font-family:var(--ital);font-size:12.5px;color:var(--muted);margin-top:2px;font-style:italic;letter-spacing:.2px;}

  body[data-mode="en"] .p-zh,body[data-mode="en"] .lead,body[data-mode="en"] .h-zh{display:none;}
  body[data-mode="zh"] .p-en,body[data-mode="zh"] .h-en{display:none;}
  body[data-mode="zh"] .p-zh{color:var(--ink);font-size:16px;margin-top:0;}
  body[data-mode="zh"] .s.on{background:transparent;}
  body[data-mode="zh"] .para.say .p-zh{padding-left:14px;border-left:2px solid var(--line);}
  body[data-mode="en"] .para.say .who{display:none;}

  .player{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--bar);border-top:1px solid var(--line);
    padding:9px 150px calc(9px + env(safe-area-inset-bottom)) 16px;
    display:flex;align-items:center;gap:14px;
  }
  .p-left{flex:0 0 auto;min-width:0;}
  .p-title{font-size:12.5px;color:var(--ink);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p-sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .p-ctrls{display:flex;align-items:center;gap:8px;}
  .pbtn{
    border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
    width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;
  }
  .pbtn:hover{border-color:var(--gold);color:var(--gold-deep);}

<script>
function EN_START(){
  "use strict";
  var synth = window.speechSynthesis;
  var voices = [];
  var runId = 0;
  /* ---- Kokoro 神经 TTS：地道美音，替代生硬的系统合成音 ---- */
  var KOKO = {
    ready: false, engine: "loading", tts: null, voice: "af_heart",
    presets: [
      { id: "af_heart", label: "美音·暖" },
      { id: "af_bella", label: "美音·叙" },
      { id: "am_adam", label: "美音·男" }
    ],
    pi: 0, src: null, t0: Date.now(), pct: 0, warned: false, warnedAudio: false
  };
  /* 音色选择持久化：上次选了哪个音色，下次打开还是它 */
  (function(){
    try {
      var v = localStorage.getItem("en-koko-voice");
      if(v){ for(var i = 0; i < KOKO.presets.length; i++){ if(KOKO.presets[i].id === v){ KOKO.pi = i; KOKO.voice = v; break; } } }
    } catch(e){}
  })();
  /* 把 kokoro 生成的 Float32 PCM 编码成 16-bit WAV Blob，交给 <audio> 元素播放。
     用 <audio> 而非 Web Audio 的 AudioContext：移动端（尤其 iOS Safari）对 AudioContext
     的自动播放限制极严，缓冲源常常停在 suspended 状态而毫无声音；<audio>.play() 在用户
     手势内被各端可靠放行，是跨设备最稳的播放方式。 */
  function encodeWav(samples, sr){
    var n = samples.length;
    var buf = new ArrayBuffer(44 + n * 2);
    var view = new DataView(buf);
    function wstr(off, s){ for(var i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); }
    wstr(0, "RIFF"); view.setUint32(4, 36 + n * 2, true);
    wstr(8, "WAVE"); wstr(12, "fmt "); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, sr, true); view.setUint32(28, sr * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    wstr(36, "data"); view.setUint32(40, n * 2, true);
    var off = 44;
    for(var i = 0; i < n; i++){
      var v = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
      off += 2;
    }
    return new Blob([view], { type: "audio/wav" });
  }
  /* 神经朗读彻底失败时的兜底：退回系统语音，至少让用户听到声音，绝不静默。
     （KOKO.ready 为 false 时 run() 已走系统语音；这里是 ready 但单句 generate 抛错的情形。） */
  function kokoFallback(text, opts){
    opts = opts || {};
    unlockTTS();
    if(synth){
      try { synth.cancel(); } catch(e){}
      var u = new SpeechSynthesisUtterance(text);
      u.lang = state.accent; u.rate = opts.rate || 1; u.pitch = 1;
      var v = pickVoice(state.accent); if(v){ u.voice = v; u.lang = v.lang; }
      u.onend = function(){ if(opts.onend) opts.onend(); };
      u.onerror = function(){ if(opts.onend) opts.onend(); };
      try { synth.speak(u); } catch(e){ if(opts.onend) opts.onend(); }
    } else if(opts.onend){ opts.onend(); }
  }
  function kokoPlay(text, opts){
    opts = opts || {};
    klog("kokoPlay: 生成中…「" + text.slice(0, 10) + "」");
    return KOKO.tts.generate(text, { voice: KOKO.voice }).then(function(audio){
      var samples = audio && audio.audio;
      if(!samples || !samples.length) throw new Error("no audio data");
      var sr = audio.sampling_rate || 24000;
      klog("kokoPlay: 生成OK samples=" + samples.length + " sr=" + sr);
      var url = URL.createObjectURL(encodeWav(samples, sr));
      var a = new Audio();
      a.src = url;
      var rate = (opts.rate && opts.rate !== 1) ? opts.rate : 1;
      if(rate !== 1) a.playbackRate = rate;
      var done = false;
      var finish = function(){
        if(done) return; done = true;
        try { a.pause(); } catch(e){}
        try { URL.revokeObjectURL(url); } catch(e){}
        KOKO.src = null;
        if(opts.onend) opts.onend();
      };
      /* 美音 <audio> 被拦截/出错：退回系统语音，绝不静默。done 守卫防止 onended 与兜底重复推进。 */
      var fallback = function(){
        if(done) return; done = true;
        KOKO.src = null;
        try { URL.revokeObjectURL(url); } catch(e){}
        if(!KOKO.warned){ KOKO.warned = true; kokoToast("美音播放被拦截，已自动改用系统语音"); }
        klog("kokoPlay: 退回系统语音兜底");
        kokoFallback(text, opts);
      };
      a.onended = finish;
      a.onerror = function(){ fallback(); };
      KOKO.src = a;
      var p = a.play();
      klog("kokoPlay: audio.play() 已调用");
      if(p && p.catch){ p.then(function(){ klog("kokoPlay: audio 已开始播放"); }).catch(function(){ klog("kokoPlay: play 被拒 -> 退回系统语音"); fallback(); }); }
      /* 兜底：个别设备不触发 onended，按时长强推一次，避免整段朗读卡在第一句不前进。 */
      setTimeout(finish, (samples.length / sr) / rate * 1000 + 900);
    }).catch(function(err){
      KOKO.src = null;
      if(!KOKO.warned){ KOKO.warned = true; kokoToast("美音引擎这一句没出声，已自动改用系统语音续播"); }
      klog("kokoPlay: generate 失败 -> 系统语音：" + (err && err.message ? err.message : err));
      kokoFallback(text, opts); /* 不静默：退回系统语音，onend 仍会推进下一句 */
      if(opts.onerror) opts.onerror(err);
    });
  }
  function updateKokoState(){
    var el = document.getElementById("kstate");
    if(!el) return;
    var a = (window.EN_AUDIO || {})[state.id];
    if(a && a.f){ el.textContent = "✓ 本篇为离线配音（地道美音 en-US-AriaNeural，点句可跟读）"; return; }
    if(KOKO.engine === "kokoro") el.textContent = "✓ 地道美音引擎已就绪（Kokoro 神经 TTS）";
    else if(KOKO.engine === "loading") el.textContent = "配音引擎加载中…（首次需联网下载模型）";
    else el.textContent = "系统语音模式（引擎未加载，可刷新重试）";
  }
  function kokoToast(msg){
    var t = document.getElementById("kktoast");
    if(!t){
      t = document.createElement("div"); t.id = "kktoast";
      t.style.cssText = "position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:9999;max-width:86vw;" +
        "background:rgba(28,28,30,.94);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;line-height:1.55;" +
        "box-shadow:0 6px 24px rgba(0,0,0,.28);transition:opacity .3s;pointer-events:none;";
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = "1";
    clearTimeout(kokoToast._t);
    kokoToast._t = setTimeout(function(){ if(t) t.style.opacity = "0"; }, 3400);
  }
  /* 调试诊断条：把播放链路的每一步实时显示在页面左上角，便于在真机上定位「没声音」根因。
     真机排障时让用户把这个面板的内容念/截给我即可，避免继续盲改。 */
  function klog(msg){
    /* 诊断信息现在只输出到控制台，不在页面上显示小窗口（避免遮挡内容）。需要排障时打开浏览器开发者工具看 Console 即可。 */
    try { console.log("[klog] " + msg); } catch(e){}
  }
  /* 让「美音」按钮的文案与当前实际音色保持一致（含上次持久化的音色） */
  function syncVoiceBtn(){
    var b = document.getElementById("voice");
    if(b && KOKO.ready) b.textContent = KOKO.presets[KOKO.pi].label;
  }
  /* 播放前置闸门：模型还在下载时不要静默退回系统语音（那正是「生硬」的来源） */
  function kokoGate(){
    if(KOKO.ready){ klog("gate: 通过(美音就绪)"); return true; }
    if(KOKO.engine === "loading" && (Date.now() - KOKO.t0) < 60000){
      kokoToast("地道配音模型还在下载 " + (KOKO.pct || 0) + "%，首次约十几秒，下完就是地道美音，稍等一下再点播放～");
      klog("gate: 拦截(模型下载中 " + (KOKO.pct || 0) + "%)");
      return false;
    }
    klog("gate: 通过(走系统语音 engine=" + KOKO.engine + ")");
    if(KOKO.engine === "web" && !KOKO.warned){
      KOKO.warned = true;
      kokoToast("配音引擎这次没加载成功，现在用的是系统语音（会比较生硬），刷新页面可以再试一次");
    }
    return true;
  }
  (function loadKoko(){
    /* HF 在部分网络环境不可达，且 kokoro-js 里 voices 地址是硬编码的 huggingface.co。
       统一拦截 fetch：把 .../Kokoro-82M-v1.0-ONNX/... 重写到本站同源 /english/models/...，
       使模型、tokenizer、voices 全部从 linqiongni.top 自身加载（jsDelivr 上的库仍正常加载）。 */
    var _fetch = window.fetch;
    if(_fetch && !_fetch.__kokoPatched){
      var patched = function(u, o){
        try {
          if(typeof u === "string" && u.indexOf("huggingface.co") > -1){
            var m = u.match(/Kokoro-82M-v1\.0-ONNX\/(?:resolve\/[^/]+\/)?(.+)$/);
            if(m){
              /* 主用国内镜像 hf-mirror.com（实测约 7MB/s，92MB 约 13 秒，且支持 CORS）；
                 本站 GitHub Pages 上的同名副本实测仅约 34KB/s，仅在镜像不可用时代偿。 */
              var mirror = "https://hf-mirror.com/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/" + m[1];
              var local = "/english/models/onnx-community/Kokoro-82M-v1.0-ONNX/" + m[1];
              return _fetch.call(window, mirror, o).catch(function(){ return _fetch.call(window, local, o); });
            }
          }
        } catch(e){}
        return _fetch.call(window, u, o);
      };
      patched.__kokoPatched = true;
      window.fetch = patched;
    }
    import("https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm").then(function(kmod){
      try { if(kmod.env){ kmod.env.allowRemoteModels = true; kmod.env.localModelPath = "/english/models/"; } } catch(e){}
      return kmod.KokoroTTS.from_pretrained("onnx-community/Kokoro-82M-v1.0-ONNX", { dtype: "q8", device: "wasm",
        progress_callback: function(p){
          if(p && p.total){
            var pct = Math.round((p.loaded || 0) / p.total * 100);
            var el = document.getElementById("kstate");
            if(el) el.textContent = "配音模型下载中… " + pct + "%";
            KOKO.pct = pct;
            if(pct % 20 === 0 || pct === 100) klog("模型下载 " + pct + "%");
          }
        } })
        .then(function(tts){ KOKO.tts = tts; KOKO.ready = true; KOKO.engine = "kokoro"; updateKokoState(); syncVoiceBtn(); klog("Kokoro 加载成功 ready=true voice=" + KOKO.voice); });
    }).catch(function(e){
      console.warn("Kokoro 加载失败，退回系统语音", e);
      KOKO.engine = "web"; updateKokoState(); klog("Kokoro 加载失败 -> 系统语音：" + (e && e.message ? e.message : e));
    });
  })();
  var store = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  };
  var state = {
    id: (store.get("en-id") || SCENES[0].id),
    idx: 0, playing: false, rate: 1, accent: "en-US", loop: false, mode: "both"
  };
  var done = {};
  try { done = JSON.parse(store.get("en-done") || "{}") || {}; } catch(e){ done = {}; }

  var RATES = [0.75, 0.9, 1.0, 1.15];
  function $(id){ return document.getElementById(id); }
  var reader = $("reader"), main = $("main"), dir = $("dir");
  var list = [];

  function loadVoices(){ if(synth) voices = synth.getVoices() || []; }
  if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }

  function pickVoice(lang){
    if(!voices.length) loadVoices();
    var want = lang.toLowerCase();
    var vs = voices.filter(function(v){ return (v.lang || "").replace("_","-").toLowerCase().indexOf(want) === 0; });
    if(!vs.length) return null;
    var pref = (want === "en-us")
      ? ["Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Samantha","Alex"]
      : ["Google UK English","Microsoft Libby","Microsoft Sonia","Daniel","Serena"];
    var i, j;
    for(i = 0; i < pref.length; i++){
      for(j = 0; j < vs.length; j++){ if((vs[j].name || "").indexOf(pref[i]) > -1) return vs[j]; }
    }
    return vs[0];
  }

  function groupById(gid){
    var i, g;
    for(i = 0; i < GROUPS.length; i++){ if(GROUPS[i].id === gid) return GROUPS[i]; }
    return null;
  }
  function fieldOf(g){ return (g && g.by) || "part"; }
  function kidsOf(g){ return (g && g.kids && g.kids.length) ? g.kids : [{ id: g.id, label: "", en: "" }]; }

  function pathOf(pid){
    var i, j, g, kids;
    for(i = 0; i < GROUPS.length; i++){
      g = GROUPS[i];
      if(g.by !== "part") continue;
      kids = kidsOf(g);
      for(j = 0; j < kids.length; j++){ if(kids[j].id === pid) return { g: g, d: kids[j] }; }
    }
    return { g: { label: "其他", en: "" }, d: { label: "", en: "" } };
  }

  /* 场景分类：由 scene.place 反查所属地点组 */
  function placeOf(pid){
    var i, j, g, kids;
    if(!pid) return null;
    for(i = 0; i < GROUPS.length; i++){
      g = GROUPS[i];
      if(g.by !== "place") continue;
      kids = kidsOf(g);
      for(j = 0; j < kids.length; j++){ if(kids[j].id === pid) return { g: g, d: kids[j] }; }
    }
    return null;
  }

  function currentScene(){
    var r = SCENES.filter(function(x){ return x.id === state.id; })[0];
    return r || null;
  }
  function groupHasCurrent(gid){
    var g = groupById(gid), cs = currentScene(), f, kids, i;
    if(!g || !cs) return false;
    f = fieldOf(g); kids = kidsOf(g);
    for(i = 0; i < kids.length; i++){ if(cs[f] === kids[i].id) return true; }
    return false;
  }
  function viewHasCurrent(vid){
    var cs = currentScene(), i, j, g, f, kids;
    if(!cs) return false;
    for(i = 0; i < GROUPS.length; i++){
      g = GROUPS[i];
      if((g.view || "type") !== vid) continue;
      f = fieldOf(g); kids = kidsOf(g);
      for(j = 0; j < kids.length; j++){ if(cs[f] === kids[j].id) return true; }
    }
    return false;
  }
  function isFold(k){
    var v = store.get("en-fold:" + k);
    if(v === "1") return true;
    if(v === "0") return false;
    /* 未记录过的默认态：只展开「当前篇目所在」的视角 / 组 / 日，其余收起来 */
    if(k.indexOf("v:") === 0) return !viewHasCurrent(k.slice(2));
    if(k.indexOf("g:") === 0) return !groupHasCurrent(k.slice(2));
    var cs = currentScene();
    if(k.indexOf("d:") === 0) return !cs || cs.part !== k.slice(2);
    return false;
  }
  function setFold(k, v){ store.set("en-fold:" + k, v ? "1" : "0"); }

  function itemHTML(s){
    var kw = (s.t + " " + s.z + " " + s.lead + " " +
      s.paras.map(function(x){ return x.p + " " + x.z; }).join(" ") + " " +
      (s.place || "")).toLowerCase().replace(/"/g, "");
    return '<div class="item' + (s.id === state.id ? " on" : "") + '" data-go="' + s.id + '" data-kw="' + kw + '">' +
      '<span class="tm">' + s.time + '</span>' +
      '<span class="tx"><span class="t1">' + s.z + '</span><span class="t2">' + s.t + '</span></span>' +
      (done[s.id] ? '<span class="done">已听</span>' : '') + '</div>';
  }

  function renderDir(){
    var html = "", v, gs, g, kids, d, items, count, f, i, j, m;
    var sub = document.querySelector(".brand-sub");
    if(sub) sub.textContent = "广州 · 一个外企法务的一年 · 场景短文 " + SCENES.length + " 篇";
    for(i = 0; i < VIEWS.length; i++){
      v = VIEWS[i];
      gs = GROUPS.filter(function(x){ return (x.view || "type") === v.id; });
      html += '<div class="view' + (isFold("v:" + v.id) ? " fold" : "") + '" data-v="' + v.id + '">' +
        '<button class="dir-view" data-toggle="v:' + v.id + '" type="button">' +
        '<span class="caret">&#9662;</span><span>' + v.label + '</span>' +

        if(!count) continue;
        html += '<div class="grp' + (isFold("g:" + g.id) ? " fold" : "") + '" data-g="' + g.id + '">' +
          '<button class="dir-group" data-toggle="g:' + g.id + '" type="button">' +
          '<span class="caret">&#9662;</span><span>' + g.label + '</span>' +
          '<span class="en">' + g.en + '</span><span class="cnt">' + count + '</span></button>' +
          '<div class="grp-b">';
        for(m = 0; m < kids.length; m++){
          d = kids[m];

          if(!items.length) continue;
          if(d.label){
            html += '<div class="day' + (isFold("d:" + d.id) ? " fold" : "") + '" data-d="' + d.id + '">' +
              '<button class="dir-day" data-toggle="d:' + d.id + '" type="button">' +
              '<span class="caret">&#9662;</span><span>' + d.label + '</span>' +
              '<span class="en">' + d.en + '</span></button><div class="day-b">';
            items.forEach(function(t){ html += itemHTML(t); });
            html += '</div></div>';
          } else {
            items.forEach(function(t){ html += itemHTML(t); });
          }
        }
        html += '</div></div>';
      }
      html += '</div></div>';

    dir.innerHTML = html;
    keepCurrentVisible();

  function keepCurrentVisible(){
    var on = dir.querySelector(".item.on");
    if(on && on.scrollIntoView){ try { on.scrollIntoView({ block: "nearest" }); } catch(e){ on.scrollIntoView(false); } }
  }

  function filterDir(q){
    q = (q || "").trim().toLowerCase();
    if(!q){ renderDir(); return; }
    Array.prototype.forEach.call(dir.querySelectorAll(".view"), function(el){ el.classList.remove("fold"); });
    Array.prototype.forEach.call(dir.querySelectorAll(".grp"), function(el){ el.classList.remove("fold"); });
    Array.prototype.forEach.call(dir.querySelectorAll(".day"), function(el){ el.classList.remove("fold"); });
    Array.prototype.forEach.call(dir.querySelectorAll(".item"), function(el){
      if(el.getAttribute("data-kw").indexOf(q) === -1) el.classList.add("hide");
      else el.classList.remove("hide");
    });
    Array.prototype.forEach.call(dir.querySelectorAll(".day"), function(d){
      d.classList.toggle("hide", d.querySelectorAll(".item:not(.hide)").length === 0);
    });
    Array.prototype.forEach.call(dir.querySelectorAll(".grp"), function(g){
      g.classList.toggle("hide", g.querySelectorAll(".item:not(.hide)").length === 0);
    });
    Array.prototype.forEach.call(dir.querySelectorAll(".view"), function(v){
      v.classList.toggle("hide", v.querySelectorAll(".item:not(.hide)").length === 0);
    });
  }

  function splitSents(text){
    var raw = text.split(/([.!?])\s+/), out = [], i;
    for(i = 0; i < raw.length; i++){
      if(raw[i] === "." || raw[i] === "!" || raw[i] === "?"){ if(out.length) out[out.length - 1] += raw[i]; }
      else if(raw[i]) out.push(raw[i]);
    }
    return out.filter(function(s){ return s.trim(); });
  }

  function renderScene(){
    var s = SCENES.filter(function(x){ return x.id === state.id; })[0];
    if(!s){ reader.innerHTML = '<div class="empty">没有找到这一篇</div>'; return; }
    var pt = pathOf(s.part);
    document.body.setAttribute("data-mode", state.mode);
    $("crumb").textContent = pt.g.label + (pt.d.label ? " · " + pt.d.label : "") + " · " + s.time + " · " + s.z;

    var pl = s.place ? placeOf(s.place) : null;
    var html = '<div class="scene-head">' +
      '<div class="kicker">scene · ' + s.time + '</div>' +
      '<h2 class="h-en">' + s.t + '</h2>' +
      '<div class="h-zh">' + s.z + '</div>' +
      '<div class="lead">' + s.lead + '</div>' +
      '<div class="head-tools">' +
        (pl ? '<button class="mini place-chip" data-place="' + s.place + '">&#9679; ' + pl.g.label + '</button>' : '') +
        '<button class="play-this" id="playThis">&#9654; 播放这一篇</button>' +
        '<button class="mini" id="down">' + (done[s.id] ? "取消标记" : "标记已听") + '</button>' +
      '</div></div>';

    s.paras.forEach(function(p){
      html += '<div class="para' + (p.w ? " say" : "") + '">';
      if(p.w) html += '<div class="who">' + p.w + '</div>';
      html += '<div class="p-en">';
      splitSents(p.p).forEach(function(sent){ html += '<span class="s">' + sent + '</span> '; });
      html += '</div><div class="p-zh">' + p.z + '</div></div>';
    });

    html += '<div class="notes"><h3>这一篇值得带走的说法</h3>';
    s.notes.forEach(function(n){
      html += '<div class="note"><div class="e" data-say="' + n.e.replace(/"/g, "&quot;") + '">' + n.e + '</div>' +
        '<div class="c">' + n.c + '</div><div class="x">' + n.x + '</div></div>';
    });
    html += '</div>';

    html += '<div class="foot">本篇配音为离线预生成的地道美音（en-US-AriaNeural，与《兰香如故》同音色），点任意一句可从该句跟读。进度与「已听」记在本机浏览器。<br><span id="kstate" class="kstate">配音引擎加载中…</span></div>';

    reader.innerHTML = html;
    $("playThis").onclick = function(){
      list = sents();
      if(state.playing){ var i = state.idx; stopAll(); state.idx = i; }
      else playFrom(0);
    };
    $("down").onclick = function(){
      if(done[s.id]) delete done[s.id]; else done[s.id] = 1;
      store.set("en-done", JSON.stringify(done));
      renderDir(); renderScene(); syncMark();
    };
    $("pTitle").textContent = s.z;
    syncMark();
    list = sents();
    state.idx = 0;
    updateBar();
    updateKokoState();
  }

  function syncMark(){
    var b = $("mark");
    b.textContent = done[state.id] ? "已听 ✓" : "标记已听";
    if(done[state.id]) b.classList.add("on"); else b.classList.remove("on");
  }

  function sents(){
    return Array.prototype.map.call(reader.querySelectorAll(".s"), function(el){
      return { el: el, txt: el.textContent.replace(/\s+/g, " ").trim() };
    });
  }

  function clearHi(){
    Array.prototype.forEach.call(reader.querySelectorAll(".s.on"), function(el){ el.classList.remove("on"); });
  }

  function highlight(i){
    clearHi();
    if(!list[i]) return;
    var el = list[i].el;
    el.classList.add("on");
    var box = el.getBoundingClientRect(), mbox = main.getBoundingClientRect();
    if(box.top < mbox.top + 70 || box.bottom > mbox.bottom - 40){
      var to = main.scrollTop + box.top - mbox.top - mbox.height * 0.38;
      if(main.scrollTo) main.scrollTo({ top: to, behavior: "smooth" }); else main.scrollTop = to;
    }
  }

  /* ---- 预生成配音（edge-tts en-US-AriaNeural @ -4%，与《兰香如故》同音色）----
     一篇一个 MP3 + 句级偏移表（audio/index.js），页面只播文件、不再实时合成：
     地道、不卡，「上一句/下一句/进度跳句」变成真正的 seek（原来整段 speak 时是假的）。
     没有配音的篇目、或偏移条数与句数对不上（内容改过而音频没重生成）→ 自动回落旧链路。 */
  var audEl = null, audRun = -1, audStopAt = -1;
  function audOf(id){
    var a = (window.EN_AUDIO || {})[id];
    if(!a || !a.f || !a.off) return null;
    if(!list || a.off.length !== list.length) return null;
    return a;
  }
  function audElGet(){
    if(audEl) return audEl;
    audEl = new Audio();
    audEl.preload = "auto";
    audEl.addEventListener("ended", function(){
      if(runId !== audRun) return;
      if(state.loop){ playFrom(0); } else { stopAll(); state.idx = 0; updateBar(); }
    });
    audEl.addEventListener("timeupdate", function(){
      var a = (window.EN_AUDIO || {})[state.id];
      if(!a || !a.off) return;
      var t = audEl.currentTime, k = 0, i;
      for(i = 0; i < a.off.length; i++){ if(a.off[i] <= t + 0.02) k = i; }
      if(k !== state.idx){ state.idx = k; highlight(k); updateBar(); }
      if(audStopAt >= 0 && t >= audStopAt){ audStopAt = -1; stopAll(); }
    });
    audEl.addEventListener("error", function(){
      /* 文件缺失/解码失败：这一篇退回系统语音，不至于没声音 */
      klog("audio error -> 回落系统语音");
      if(state.playing){ state.playing = false; synthPlayAll(state.idx, ++runId); }
    });
    return audEl;
  }
  /* oneShot=true → 只念这一句就停（点句跟读）；false → 从该句连续播到本篇结束 */
  function audPlay(i, oneShot){
    var a = audOf(state.id);
    if(!a) return false;
    var el = audElGet();
    unlockMedia();
    if(el.getAttribute("data-file") !== a.f){ el.setAttribute("data-file", a.f); el.src = a.f; }
    el.playbackRate = state.rate;
    audStopAt = oneShot ? ((a.off[i + 1] !== undefined) ? a.off[i + 1] : a.d + 0.05) : -1;
    try { el.currentTime = a.off[i]; } catch(e){}
    state.playing = true; state.idx = i; highlight(i); updateBar();
    audRun = runId;
    var p = el.play();
    if(p && p.catch) p.catch(function(){
      klog("audio play 被拒 -> 回落系统语音");
      synthPlayAll(i, ++runId);
    });
    return true;
  }

  function stopAll(){
    runId++;
    if(synth){ try { synth.cancel(); } catch(e){} }
    if(KOKO.src){ try { KOKO.src.pause(); } catch(e){} KOKO.src = null; }
    if(audEl){ try { audEl.pause(); } catch(e){} }
    audStopAt = -1;
    state.playing = false;
    clearHi();
    updateBar();
  }

  /* iOS Safari 限制：首次 speechSynthesis.speak() 必须在用户点击的手势内同步发生，
     否则引擎保持锁定、之后所有 speak 都静默失败（无声、无暂停态）。
     在点击处理器里先同步说一声静音 utterance 解锁引擎，后续程序触发的 speak 才正常。 */
  var ttsUnlocked = false;
  function unlockTTS(){
    if(ttsUnlocked || !synth) return;
    try {
      var u0 = new SpeechSynthesisUtterance(" ");
      u0.volume = 0;
      u0.rate = 2;
      synth.speak(u0);
      ttsUnlocked = true;
    } catch(e){}
  }
  /* iOS 媒体解锁：在首次用户手势内播一段静音 <audio>，之后 kokoPlay 异步生成的朗读
     （WASM 推理完成后才 new Audio().play()）也能被系统放行，避免「点了没声音」。 */
  var mediaUnlocked = false;
  function unlockMedia(){
    if(mediaUnlocked) return;
    try {
      /* iOS Safari 不会为「音量 0 / 全零静音」解锁音频会话，必须用一段真实（低振幅）音频。
         这里放 0.1s 的 220Hz 轻音（音量 0.25，几乎听不见），专门用来解锁，播放一次即可。 */
      var n = 2400, buf = new Float32Array(n), i;
      for(i = 0; i < n; i++) buf[i] = 0.04 * Math.sin(2 * Math.PI * 220 * i / 24000);
      var au = new Audio(URL.createObjectURL(encodeWav(buf, 24000)));
      au.volume = 0.25;
      var pp = au.play();
      if(pp && pp.catch) pp.catch(function(){});
      mediaUnlocked = true;
    } catch(e){}
  }
  /* 全局首批手势解锁：正文里点「朗读这一句」(.e) 直接走 kokoPlay，不经过 playFrom，
     若只在 playFrom 里 unlock 会漏掉它。故在页面首个用户交互里也解锁一次，
     保证无论先点哪个按钮，异步生成的 <audio>.play() 都能被 iOS/Android 放行。 */
  (function(){
    var evs = ["pointerdown", "touchstart", "click", "keydown"];
    function onFirst(){ unlockMedia(); unlockTTS(); for(var i = 0; i < evs.length; i++){ document.removeEventListener(evs[i], onFirst); } }
    for(var i = 0; i < evs.length; i++){ document.addEventListener(evs[i], onFirst, { passive: true }); }
  })();

  function playFrom(i){
    list = sents();
    if(!list.length) return;
    unlockTTS();
    unlockMedia();
    stopAll();
    if(i >= list.length) i = 0;
    if(i < 0) i = 0;
    state.idx = i;
    highlight(i);
    /* 本篇有离线配音 → 直接播文件（地道 + 不卡），不再走实时合成链路 */
    if(audPlay(i, false)) return;
    if(!kokoGate()){ state.playing = false; updateBar(); return; }
    if(!synth && !KOKO.ready){ state.playing = false; updateBar(); alert("当前浏览器不支持语音朗读，请换 Chrome / Edge / Safari。"); return; }
    state.playing = true;
    updateBar();
    run();
  }

  function run(){
    var myRun = ++runId, i = state.idx;
    if(i >= list.length){ stopAll(); state.idx = 0; updateBar(); return; }
    highlight(i);
    updateBar();
    /* 长文整篇播放强制走系统语音：Kokoro 在手机上逐句 WASM 推理会卡死 UI，
       且 iOS 对异步生成的 <audio>.play() 时常拒绝。单句点读仍走 Kokoro 美音（体验可接受）。 */
    klog("run: 整篇走系统语音 idx=" + i + " 共" + list.length + "句");
    synthPlayAll(i, myRun);
  }
  /* 系统语音整段播放：剩余句子拼成一段一次念完，避开 iOS 多句 speechSynthesis 卡死；
     高亮随估算时长逐句推进；结束（或循环）由 onend 统一决定。runId 与 stopAll 同套闸门，
     中途点暂停/切篇会令 runId 变化，所有 setTimeout 自检后自动作废。 */
  function synthPlayAll(startIdx, myRun){
    if(!synth){ state.playing = false; updateBar(); return; }
    list = list.length ? list : sents();
    if(startIdx >= list.length){ stopAll(); state.idx = 0; updateBar(); return; }
    var rest = [];
    for(var k = startIdx; k < list.length; k++) rest.push(list[k].txt);
    var full = rest.join("  ");
    var u = new SpeechSynthesisUtterance(full);
    var v = pickVoice(state.accent);
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = state.accent; }
    u.rate = state.rate; u.pitch = 1;
    state.playing = true; updateBar();
    /* 高亮按句子估算时长推进（系统语音模式不追求逐字精确，能跟着走即可） */
    var t = 0;
    for(var k2 = startIdx; k2 < list.length; k2++){
      (function(kk, delay){
        setTimeout(function(){ if(runId !== myRun) return; state.idx = kk; highlight(kk); updateBar(); }, delay);
      })(k2, t);
      t += Math.max(700, list[k2].txt.length * 60 / state.rate);
    }
    var finish = function(){
      if(runId !== myRun) return;
      klog("系统语音: 结束 onend/error");
      if(state.loop){ playFrom(0); } else { stopAll(); state.idx = 0; updateBar(); }
    };
    u.onend = finish;
    u.onerror = finish;
    klog("系统语音: 整段 speak " + rest.length + " 句");
    try { synth.cancel(); synth.speak(u); } catch(e){ if(runId === myRun){ stopAll(); updateBar(); } }
  }

  function toggle(){
    if(state.playing){ var i = state.idx; stopAll(); state.idx = i; }
    else playFrom(state.idx);
  }

  function updateBar(){
    var n = list.length || 0;
    $("pSub").textContent = (n ? (state.idx + 1) : 0) + " / " + n;
    $("fill").style.width = (n ? ((state.idx + 1) / n * 100) : 0) + "%";
    $("play").innerHTML = state.playing ? "&#10074;&#10074;" : "&#9654;";
    /* 正文里的播放按钮同步变暂停：手机上播放条在屏幕底部不显眼，
       暂停控件直接出现在用户点击的位置（iOS 暂停用 cancel 实现，恢复从当前句续播） */
    var pt = $("playThis");
    if(pt) pt.innerHTML = state.playing ? "&#10074;&#10074; 暂停播放" : "&#9654; 播放这一篇";
  }

  function closeSide(){ $("app").classList.add("collapsed"); }

  function go(id){
    if(id === state.id){ if(main.scrollTo) main.scrollTo({ top: 0, behavior: "smooth" }); else main.scrollTop = 0; if(window.innerWidth <= 900) closeSide(); return; }
    stopAll();
    state.id = id;
    store.set("en-id", id);
    state.idx = 0;
    renderDir();
    renderScene();
    if(main.scrollTo) main.scrollTo({ top: 0, behavior: "smooth" }); else main.scrollTop = 0;
    if(window.innerWidth <= 900) closeSide();
  }

  dir.addEventListener("click", function(e){
    var tg = e.target.closest("[data-toggle]");
    if(tg){
      var key = tg.getAttribute("data-toggle");
      var box = tg.parentNode;
      setFold(key, box.classList.toggle("fold"));
      return;
    }
    var it = e.target.closest(".item");
    if(it) go(it.getAttribute("data-go"));
  });

  function openSide(){ $("app").classList.remove("collapsed"); }
  function focusPlace(pid){
    var pl = placeOf(pid), el;
    if(!pl) return;
    setFold("v:place", false);
    setFold("g:" + pl.g.id, false);
    renderDir();
    el = dir.querySelector('.grp[data-g="' + pl.g.id + '"] .dir-group');
    if(el && el.scrollIntoView){ try { el.scrollIntoView({ block: "start" }); } catch(e){ el.scrollIntoView(true); } }
    if(window.innerWidth <= 900) openSide();
  }

  reader.addEventListener("click", function(e){
    var pc = e.target.closest("[data-place]");
    if(pc){ focusPlace(pc.getAttribute("data-place")); return; }
    var n = e.target.closest(".e");
    if(n && n.getAttribute("data-say")){
      var sayTxt = n.getAttribute("data-say");
      unlockTTS(); unlockMedia();
      klog(".e 朗读: " + (KOKO.ready ? "koko" : "system") + "「" + sayTxt.slice(0, 10) + "」");
      if(KOKO.ready){ kokoPlay(sayTxt, { rate: state.rate }); }
      else if(kokoGate() && synth){
        try { synth.cancel(); } catch(err){}
        var u = new SpeechSynthesisUtterance(sayTxt);
        u.lang = state.accent; u.rate = state.rate;
        var v = pickVoice(state.accent); if(v){ u.voice = v; u.lang = v.lang; }
        try { synth.speak(u); } catch(err){}
      }
      return;
    }
    var sp = e.target.closest(".s");
    if(sp){
      list = sents();
      var i = -1;
      for(var k = 0; k < list.length; k++){ if(list[k].el === sp){ i = k; break; } }
      if(i > -1) playFrom(i);
    }
  });

  $("q").addEventListener("input", function(e){ filterDir(e.target.value); });
  $("play").addEventListener("click", toggle);
  $("prev").addEventListener("click", function(){
    var i = Math.max(0, state.idx - 1);
    if(state.playing) playFrom(i);
    else { list = sents(); state.idx = i; highlight(i); updateBar(); }
  });
  $("next").addEventListener("click", function(){
    list = sents();
    var i = Math.min(list.length - 1, state.idx + 1);
    if(state.playing) playFrom(i);
    else { state.idx = i; highlight(i); updateBar(); }
  });
  $("track").addEventListener("click", function(e){
    if(!list.length) return;
    var r = this.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    var i = Math.floor(p * list.length);
    if(state.playing) playFrom(i);
    else { state.idx = i; highlight(i); updateBar(); }
  });
  $("rate").addEventListener("click", function(){
    var i = RATES.indexOf(state.rate);
    state.rate = RATES[(i + 1) % RATES.length];
    this.textContent = state.rate.toFixed(2).replace(/0$/, "") + "×";
    if(state.rate !== 1) this.classList.add("on"); else this.classList.remove("on");
    /* 离线配音模式：改 playbackRate 即可，不必从头重播（浏览器默认保持音高不变调） */
    if(audOf(state.id) && audEl){ audEl.playbackRate = state.rate; return; }
    if(state.playing) playFrom(state.idx);
  });
  $("voice").addEventListener("click", function(){
    if(audOf(state.id)){
      this.textContent = "美音";
      this.title = "本篇为离线预生成美音配音（en-US-AriaNeural），不提供英音切换";
      return;
    }
    if(KOKO.ready){
      KOKO.pi = (KOKO.pi + 1) % KOKO.presets.length;
      KOKO.voice = KOKO.presets[KOKO.pi].id;
      this.textContent = KOKO.presets[KOKO.pi].label;
      try { localStorage.setItem("en-koko-voice", KOKO.voice); } catch(e){}
    } else {
      state.accent = (state.accent === "en-US") ? "en-GB" : "en-US";
      this.textContent = (state.accent === "en-US") ? "美音" : "英音";
      if(synth) loadVoices();
    }
    if(state.playing) playFrom(state.idx);
  });
  $("loop").addEventListener("click", function(){
    state.loop = !state.loop;
    if(state.loop) this.classList.add("on"); else this.classList.remove("on");
    this.textContent = state.loop ? "循环 ✓" : "循环";
  });
  $("mark").addEventListener("click", function(){
    if(done[state.id]) delete done[state.id]; else done[state.id] = 1;
    store.set("en-done", JSON.stringify(done));
    renderDir(); syncMark();
    var d = $("down"); if(d) d.textContent = done[state.id] ? "取消标记" : "标记已听";
  });

  var modes = { both: "mBoth", en: "mEn", zh: "mZh" };
  Object.keys(modes).forEach(function(k){
    $(modes[k]).addEventListener("click", function(){
      state.mode = k;
      document.body.setAttribute("data-mode", k);
      Object.keys(modes).forEach(function(j){
        if(j === k) $(modes[j]).classList.add("on"); else $(modes[j]).classList.remove("on");
      });
    });
  });
  $(modes[state.mode]).classList.add("on");

  $("menu").addEventListener("click", function(){ $("app").classList.toggle("collapsed"); });
  /* 只有全屏独立打开（非 iframe 嵌入）时才显示返回主页：手机端由主站跳转进来就是这个形态 */
  if(window.self === window.top){ var bh = $("backHome"); if(bh) bh.classList.add("on"); }
  $("scrim").addEventListener("click", closeSide);
  if(window.innerWidth <= 900) closeSide();

  window.addEventListener("beforeunload", function(){ if(synth){ try { synth.cancel(); } catch(e){} } });

  function applyTheme(mode){
    document.documentElement.setAttribute("data-theme", mode);
    var mc = document.querySelector('meta[name="theme-color"]');
    if(mc) mc.setAttribute("content", mode === "dark" ? "#171614" : "#FBF9F4");
  }
  window.addEventListener("message", function(e){
    var d = e.data;
    if(d && d.type === "theme" && (d.mode === "dark" || d.mode === "light")) applyTheme(d.mode);
  });
  if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark");

  renderDir();
  renderScene();
}

/* 加载内容数据：把 iframe 上带的版本号透传给 scenes.js，避免命中旧缓存（旧 index + 新/旧数据不匹配会白屏） */
(function(){
  var m = location.search.match(/[?&]v=([^&]+)/);
  var v = m ? m[1] : "";
  function load(src, ok, err){
    var s = document.createElement("script");
    s.src = src + (v ? "?v=" + v : "");
    s.onload = ok; s.onerror = err;
    document.head.appendChild(s);
  }
  function fail(){
    var r = document.getElementById("reader");
    if(r) r.innerHTML = '<div class="empty">内容没加载出来，刷新一下试试</div>';
  }
  function start(){ try { EN_START(); } catch(e){ console.error(e); } }
  /* 先拉配音偏移表（渲染时要知道本篇有没有配音），它失败不影响正文，只回落系统语音 */
  load("audio/index.js", function(){ load("scenes.js", start, fail); },
       function(){ load("scenes.js", start, fail); });
})();
</script>

<script>(function(){
  if(window.__themeBridge)return;window.__themeBridge=1;
  var r=document.documentElement;
  function apply(m){
    m=(m==='light')?'light':'dark';
    r.setAttribute('data-theme',m);
    try{ r.setAttribute('data-theme-default',m); }catch(e){}
    try{ window.dispatchEvent(new CustomEvent('site-theme',{detail:m})); }catch(e){}
  }
  // 主站导航栏的太阳/月亮按钮 → ThemeIframe 用 postMessage 把模式推进来
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d.type==='theme'&&(d.mode==='light'||d.mode==='dark')){ apply(d.mode); }
  });
  function standalone(){ try{ return window.parent===window; }catch(e){ return false; } }
  function addBtn(){
    if(!standalone()||document.getElementById('theme-toggle-btn'))return;
    // 子站自带的 assets/app.js 已经提供了主题按钮（#themeBtn）时不要再加，避免出现两个。
    if(document.getElementById('themeBtn'))return;
    var b=document.createElement('button');
    b.id='theme-toggle-btn';b.type='button';
    b.style.cssText=[
      'position:fixed','top:56px','right:16px','z-index:9999',
      'padding:6px 14px','border-radius:999px','cursor:pointer',
      'font-size:13px','font-family:inherit',
      'border:1px solid var(--line,#CFCABE)',
      'background:var(--card,#FFFFFF)',
      'color:var(--txt,#23201B)',
      'box-shadow:0 1px 3px rgba(0,0,0,.08)',
      'transition:border-color .15s,color .15s'
    ].join(';');
    if(window.matchMedia&&window.matchMedia('(max-width: 640px)').matches){
      b.style.top='auto';b.style.bottom='16px';b.style.right='12px';b.style.padding='5px 10px';
    }
    function paint(){ b.textContent = r.getAttribute('data-theme')==='dark' ? '切换浅色' : '切换深色'; }
    b.addEventListener('click',function(){
      apply(r.getAttribute('data-theme')==='dark'?'light':'dark');
      paint();
    });
    paint();
    (document.body||r).appendChild(b);
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',addBtn); }
  else { addBtn(); }
})();</script>
