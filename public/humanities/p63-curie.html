          <h1>居里夫人</h1>
          <p class="hook">史上唯一两获诺奖且横跨两科的科学家，是被自己研究的射线慢慢杀死的</p>
          <div class="body"><p>居里夫人发现钋与镭、获1903物理与1911化学两枚诺奖，却因长期徒手接触放射性物质罹患再生障碍性贫血而死。她曾被法国科学院以性别为由拒之门外，却把奖牌拿给女儿当玩具。用命换来的光，她自己先被那光灼伤。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>她一吨矿渣提 0.1 克镭，价值远高于当时黄金；一战她改装汽车带 X 光机（人称『小居里』）开赴前线救伤兵——把科学直接推到战场。</p></div>
