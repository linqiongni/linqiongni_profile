          <h1>丘吉尔</h1>
          <p class="hook">刚带领英国赢得二战，转头就被选民一脚踢下台</p>
          <div class="body"><p>丘吉尔1940年临危受命、以铁血演说凝聚英国扛住纳粹，1945年欧战甫一胜利，国内大选却把他和保守党选下台，工党上台。救火英雄刚把房子保住，房东就换了物业。历史的健忘，有时冷酷得近乎无理。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他青年时是战地记者、写过《马拉坎德远征史》；一战时在前线蹲战壕，二战靠英国广播公司（BBC）的广播塑造『英国脊梁』——演说也是战斗力。</p></div>
          <div class="docs"><b>纪录片延伸</b>《BBC《The World at War》（1973 二十六集史诗）》 · 《BBC《The Valiant Years》（丘吉尔回忆录影像版）》</div>
