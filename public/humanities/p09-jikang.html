          <span class="tagline">D09 · 魏晋</span>
          <h1>嵇康</h1>
          <p class="hook">最酷的文人被权力处死，临刑前从容弹完一曲，从此成绝响</p>
          <div class="body"><p>嵇康是竹林七贤的灵魂，打铁自给、傲视权贵，因为不肯出仕、又替朋友写绝交书，触怒司马氏，被判死刑。刑场之上，三千太学生请愿无效，他索琴弹奏《广陵散》，曲终叹道『《广陵散》于今绝矣』，从容就义，年仅三十九。一个不肯低头的人，把风骨写进了最后一个音符。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>魏晋之际的『清谈』不是空话，是一种政治避祸与身份表态。嵇康打铁、阮籍哭穷、刘伶裸饮，都是同一套语言：用不合作证明我没被收买。</p></div>
