          <h1>白居易</h1>
          <p class="hook">写尽民间疾苦的『人民诗人』，本人却是优渥的朝廷大员，还在日本先于本国走红</p>
          <div class="body"><p>白居易《卖炭翁》《新丰折臂翁》字字为民请命，可他本人仕途平稳、晚年居洛阳履道里，畜妓蓄财、诗酒逍遥。他的诗刻意写得浅白，据说老妪能解，因此在日本平安朝风靡一时，嵯峨天皇手抄不辍，声望远超前朝任何诗人。讽喻是他良心，富贵是他运气。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他首创『新乐府』运动，主张‘文章合为时而著，歌诗合为事而作’，把诗当武器；可晚年转而沉溺『香山九老』式的闲适唱和。这转折，几乎是文人从『为民发声』到『为自我安顿』的缩影。</p></div>
