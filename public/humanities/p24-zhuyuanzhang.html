          <h1>朱元璋</h1>
          <p class="hook">唯一从乞丐和和尚做起，一路坐上龙椅的草根皇帝</p>
          <div class="body"><p>朱元璋十七岁那年，父母兄长接连死于瘟疫，他出家为僧、托钵乞食，几乎饿死。乱世中投军，从亲兵做起，凭眼光与狠劲扫平群雄，1368年称帝。他从最底层看尽人间苦毒，也由此建立起中国史上最严密的皇权监控。一个吃过树皮的人，最懂怎么把权力攥到指缝里。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他废丞相、设锦衣卫、八股取士、迁民实田，把帝国彻底改造成『皇帝—流官—小农』的扁平结构。看过饥饿的人，既最懂分配，也最不信任人。</p></div>
