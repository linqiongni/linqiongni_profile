          <h1>托尔斯泰</h1>
          <p class="hook">写出《战争与和平》的文豪，最后死在一座小火车站，只为逃离自己的豪宅</p>
          <div class="body"><p>托尔斯泰晚年否定私产与教会、主张平民化，却始终住在伯爵庄园、享尽仆役，内心撕裂。1910年，八十二岁的他终于离家出走，途中染病，死于阿斯达波沃车站。一个写下最多人间苦难的人，是被自己优渥的良心逼上路的。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他的《战争与和平》《安娜·卡列尼娜》至今是『如何写群体性历史』的范本；晚年主张非暴力、拒服兵役，直接影响了后来的甘地。</p></div>
