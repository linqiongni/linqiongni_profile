          <h1>文天祥</h1>
          <p class="hook">平日里并不出彩的文官，在亡国关头成了站得最直的那个人</p>
          <div class="body"><p>文天祥状元出身、早年风流，元军南下时才散尽家财起兵勤王，兵败被俘，囚禁三年，元世祖许以宰相劝降，他只答『愿赐一死』，留下『人生自古谁无死，留取丹心照汗青』。一个平庸的官僚，在末世被逼出了脊梁。英雄常常不是天生的，是时刻逼出来的。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>1275年他募兵『勤王』，在江西、广东转战数年，妻儿被俘仍不退。他的《正气歌》《过零丁洋》把『士大夫的死节』写成了一套可传续的精神谱系，此后七百年一直是读书人的道德教材。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《中国通史·南宋末》》 · 《《书简阅中国》》</div>
