          <h1>郑和</h1>
          <p class="hook">史上最强大的舰队统帅，归航后却被自己的国家彻底遗忘</p>
          <div class="body"><p>郑和七下西洋，船队长逾百米、规模百倍于半个世纪后的哥伦布，远抵非洲东岸，比达伽马早了近百年。可宣德之后明朝海禁，档案被付之一炬，举国上下仿佛这事从未发生。一位把当时中国海军推到人类顶峰的太监，被自己人从记忆里抹去——这是大明最可惜的一次转身。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他的船队是『宣威 + 朝贡 + 贸易』三合一，不带殖民、不留驻军，与后来的帝国逻辑完全不同。此后明船朽坏、档案成谜，是『转向内陆』的教科书级案例。</p></div>
