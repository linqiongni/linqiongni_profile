          <h1>辛弃疾</h1>
          <p class="hook">豪放派词人的真身，是五十骑冲进敌军大营擒贼的特种军官</p>
          <div class="body"><p>辛弃疾二十二岁在耿京义军中，亲率五十余骑突入金营数万军中，生擒叛徒张安国南归，何等悍勇。可南归后屡遭猜忌、投闲置散，一腔恢复中原的热血无处洒，只能『醉里挑灯看剑，梦回吹角连营』。他的词不是文人闲笔，是一个被夺了剑的将军，拿笔接着打。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>南归十七年他上《美芹十论》《九议》却无人采；于是把兵书、阵法、军中号的记忆全倒进词里。豪放派不是风格选择，是压抑不住的经历溢出。</p></div>
