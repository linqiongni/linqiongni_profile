          <h1>查理曼</h1>
          <p class="hook">『欧洲之父』加冕罗马皇帝，本人却几乎不识字</p>
          <div class="body"><p>查理曼征服西欧大半、推广教育、被教皇加冕为『罗马人的皇帝』，可据传记他本人不识字，晚年才学写字，把石板压在枕下练到指间长茧。一个文盲缔造了『加洛林文艺复兴』的土壤。伟大常常不靠本人多博学，而靠他肯为后人点亮灯火。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他在 800 年加冕，等于宣称『罗马还在，只是换人』——欧洲『两个帝国（东西）』的格局从此开始。今天德国法国边界，仍是他当年征战的余波。</p></div>
