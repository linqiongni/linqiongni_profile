          <h1>张居正</h1>
          <p class="hook">明朝最管用的首相，死后被抄家、长子逼死、差点掘墓</p>
          <div class="body"><p>张居正辅佐幼帝万历，推行考成法、一条鞭法，整顿财政边防，把衰颓的明王朝硬拉回正轨十年。可他柄国太专、作风凌厉，一死即遭清算：家产抄没、长子自尽、子弟流放，诏夺谥号。他救了江山，却救不了自己与家人的身后。能干的政治家，最怕遇到被自己扶上位的少年天子。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他推行『一条鞭法』把杂税折银、徭役归亩，是中国财政货币化的关键一步；同时用戚继光、李成梁守边。十年『万历中兴』的水，全靠他一个人压着。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《中国通史·明》》 · 《《大明宫》（看唐代另一盛世的制度底色）》</div>
