          <h1>乾隆</h1>
          <p class="hook">坐拥千古未有的盛世，却在巅峰礼貌地拒绝了整个世界的新时代</p>
          <div class="body"><p>1793年，英国马戛尔尼使团带着蒸汽机模型、地球仪来叩关，乾隆回以『天朝物产丰盈，无所不有』，拒绝对等通商。此时工业革命已在英国起跑，而东方帝国把门轻轻关上。三十多年后鸦片战争轰开这扇门时，代价是百年屈辱。最兴盛的时刻，往往最危险地错过了变局。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他编《四库全书》、修园林、十全武功，是把『盛世』做到极致的一代；同时文字狱、闭关、拒机器。巅峰与拐点的同一年，只隔了几年。</p></div>
