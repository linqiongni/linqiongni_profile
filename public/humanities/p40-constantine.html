          <h1>君士坦丁</h1>
          <p class="hook">让基督教合法的皇帝，直到断气前才受洗——信仰于他，或许首先是治国之术</p>
          <div class="body"><p>君士坦丁在米尔维安桥之战前见异象、获胜，次年颁布《米兰敕令》承认基督教，迁都君士坦丁堡，奠定中世纪格局。可他终其执政都未受洗，直到临终才由阿里乌派主教施洗。把信仰与帝国绑在一起的人，自己却把入门礼留到了最后一刻。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他选拜占庭建都，看中的是欧亚枢纽与城墙地形；这座城此后守了千年，直到1453年才陷落。信仰换了旗，城还在原地。</p></div>
