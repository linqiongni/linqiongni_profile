          <h1>岳飞</h1>
          <p class="hook">最该被铭记的忠臣，死于自己誓死保卫的朝廷，罪名只有三个字『莫须有』</p>
          <div class="body"><p>岳飞抗金屡破强敌，收复大片失地，却因力主迎回徽钦二帝、功高震主，被宋高宗与秦桧构陷。风波亭赐死时年仅三十九，所谓罪名『莫须有』（或许有）——堂堂大宋，用最暧昧的理由杀掉最忠诚的将军。忠而被戮，才是中国历史最沉的那块碑。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>南宋最痛的不是打不过，是『自己人先动手』：1140年郾城大捷后即被一日之内连下十二道金牌催回。『莫须有』三字，是中国民族主义叙事里最不能翻过的一页。</p></div>
