          <h1>李鸿章</h1>
          <p class="hook">被骂作『卖国贼』的一代人，其实也是那个时代唯一拼命想裱糊破屋的人</p>
          <div class="body"><p>李鸿章办淮军、建北洋水师、修铁路、开工厂，是清廷最懂洋务的裱糊匠；可甲午一败、马关辛丑接连签约，举国把怒火全泼在他一人头上。他临终诗云『三百年来伤国步，八千里外吊民残』。裱糊匠救不了将塌的房子，却替所有人挡下了砸下来的梁。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他签条约时已 79 岁，一手建起的北洋一败于黄海、再败于谈判桌。『卖国』与『救国』同时刻发生在一个身上，是近代中国最残酷的双重身份。</p></div>
