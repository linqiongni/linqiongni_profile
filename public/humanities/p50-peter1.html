          <h1>彼得大帝</h1>
          <p class="hook">为学造船微服混进外国作坊的沙皇，也亲手把亲儿子折磨至死</p>
          <div class="body"><p>彼得身高两米多，1697年化名随使团出访西欧，在荷兰船厂抡斧学造船，回国强推西化。可他专断至极，因储君阿列克谢亲西保守，将其逮捕严刑拷打致死。一个拖着整个俄国向西跑的人，连亲生骨肉都成了绊脚石的代价。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他1703年建圣彼得堡、迁都于此，把俄国的『朝西看』钉成国策；又强制剪须、改服饰，用羞辱式法令改写国民外观。</p></div>
          <div class="docs"><b>纪录片延伸</b>《A&amp;E《Peter the Great》（1986 传记系列）》 · 《CCTV《大国崛起》（彼得与俄国起步）》</div>
