          <h1>维多利亚</h1>
          <p class="hook">象征『日不落帝国』的女王，余生三十九年只穿黑衣，是个丧夫的寡妇</p>
          <div class="body"><p>维多利亚在位六十三年，领土上太阳永不落下，可1840年丈夫阿尔伯特去世后，她长期隐居、终身缟素，国事渐委内阁。帝国的金光，是一袭黑衣寡妇的背影撑起的。强盛与孤独，在她身上同框。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>帝国扩张的同时靠鸦片贸易与棉纺织把亚洲、非洲绑进市场——『日不落』的另一半账本，是鸦片战争与印度大饥荒。</p></div>
