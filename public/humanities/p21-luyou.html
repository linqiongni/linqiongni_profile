          <h1>陆游</h1>
          <p class="hook">诗里天天哭穷的大诗人，实则家境宽裕、靠田产收租养活一大家子数十口</p>
          <div class="body"><p>陆游一生写诗近万首，动辄『饥卧骨欲折』『囊空如洗』，考其生平，却出身仕宦、山阴有田有宅，做过几任实缺，家累子孙数十口，日子远非诗中那般凄惨。他爱用穷自况，是把失志的闷写成了清贫的调。读史要分清楚：诗人笔下的自己，和账本上的自己，常常是两个人。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>南宋士大夫普遍『有田而不自耕，靠租养家』，陆游只是把阶层常态写成了个人悲情。他一生力主北伐却屡遭主和派压制，『穷』其实是『位卑未敢忘忧国』的另一种写法。</p></div>
