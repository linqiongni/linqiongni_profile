          <h1>杜甫</h1>
          <p class="hook">『诗圣』生前默默无闻，幼子活活饿死，死后才被奉上神坛</p>
          <div class="body"><p>杜甫一生困顿：困居长安十年求官，安史乱中逃难，幼子因饥荒夭亡，他自己晚年漂泊舟中、靠友接济。他写『朱门酒肉臭，路有冻死骨』，是把血泪写进格律。可同时代没人把他当回事，诗集散乱，直到中晚唐才被杜牧、韩愈推崇，宋代方封『诗圣』。最伟大的现实主义诗人，是过了好几百年才被读懂的。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他剩下三千多首诗几乎全是记实的编年史：安史之乱、蜀地漂泊、夔州登高，都能按年月坐实。读杜甫其实是读一部用五言写成的唐代新闻片。</p></div>
