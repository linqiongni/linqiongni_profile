          <h1>达尔文</h1>
          <p class="hook">撼动人类自我认知的巨著，他足足拖延了二十年才敢出版</p>
          <div class="body"><p>达尔文乘『小猎犬号』环球考察后，早在1830年代就形成进化思想，却因怕触犯宗教与社会，压了二十年，直到华莱士也得出类似结论、倒逼他1859年才发表《物种起源》。一个颠覆了世界的人，差点被自己的谨慎永远按下。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他在贝格尔号上记满地质与物种笔记，把『物种随时间变化』从猜想变成证据链；《起源》一出版即被抢购，把人类从宇宙中心挪到了一员的位置。</p></div>
          <div class="docs"><b>纪录片延伸</b>《BBC《The Ascent of Man》》 · 《BBC《The Voyage of the Beagle》（小猎犬号航程）》</div>
