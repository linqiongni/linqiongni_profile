          <h1>韩愈</h1>
          <p class="hook">『文起八代之衰』的文坛宗师，仕途就是一部反复被贬、险些送命的硬骨头史</p>
          <div class="body"><p>韩愈掀古文运动、辟佛老、奖后进，可脾气太硬：上《谏迎佛骨表》直怼唐宪宗，一句『伤风败俗』惹得皇帝要杀他，贬到鳄鱼横行的潮州。他在那儿祭鳄、兴学、释奴，把蛮荒教成礼义。一个靠文章立身的人，偏偏每次都拿性命去撞皇权。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他把散文从骈偶的华丽里拽回散文的『载道』，从此古文成了科举主流。同期和尚大颠、李翱皆受他影响——韩愈其实也是唐代思想场域里最会『用文章做公共议题』的人。</p></div>
