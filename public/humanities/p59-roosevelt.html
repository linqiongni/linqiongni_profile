          <h1>罗斯福</h1>
          <p class="hook">带领美国走出大萧条与二战的总统，是坐轮椅、藏着瘫痪秘密上台的</p>
          <div class="body"><p>富兰克林·罗斯福39岁患小儿麻痹、双腿瘫痪，却刻意隐瞒、被人搀扶站立演讲，连任四届总统，撑过经济崩溃与世界大战。一个要靠钢铁支架才能起身的人，扛起了最动荡的年代。弱与强，在他身上完成了最戏剧的反转。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>『新政』用公共工程、社保、央行改革把美国从崩盘边缘拉回，也把『政府该管民生』写进现代政治共识；1945年他赴雅尔塔三周后去世。</p></div>
