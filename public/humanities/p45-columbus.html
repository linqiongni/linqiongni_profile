          <h1>哥伦布</h1>
          <p class="hook">『发现新大陆』的人，到死都坚称自己到了亚洲</p>
          <div class="body"><p>哥伦布1492年向西航行，登陆巴哈马，至死认定那是『印度』的外缘（故称土著为『印第安人』），还曾因治理殖民地暴虐被西班牙铐回。他开启了对接两个半球的『大交换』，却始终活在自己认错的坐标里。改写世界的人，未必懂得自己改写了什么。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>马铃薯、玉米、番茄入亚欧，天花、麻疹扫荡美洲——人口结构、饮食、疾病全被改写。一个『认错地方』的航行，是全球化真正的起跑枪。</p></div>
