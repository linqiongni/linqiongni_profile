          <h1>陶渊明</h1>
          <p class="hook">『采菊东篱下』的隐逸偶像，其实是个体制内混不下去、又穷得揭不开锅的失意人</p>
          <div class="body"><p>陶渊明做过几任小官，每次都因不堪应酬、不愿折腰而辞职，四十一岁彻底归隐。他笔下悠然见南山，现实却是『草盛豆苗稀』的歉收，晚年穷到出门乞食、寒冬无酒。他的『归隐』一半是清醒，一半是被生计逼出来的退场——也正因如此，那句『不为五斗米折腰』才格外有重量。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他不是在田园里诗意的富人，是连酒都要向邻居乞的寒士。中国文人把『归隐』美化成风骨，陶渊明却提供了最真实版本：不想上班，且真的上不起班。</p></div>
