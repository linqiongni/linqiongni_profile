          <h1>王阳明</h1>
          <p class="hook">明代最后一位大哲，是在被廷杖、流放蛮荒的绝境里『悟』出道的</p>
          <div class="body"><p>王阳明少年立志做圣贤，却因得罪权宦刘瑾被廷杖四十、贬到贵州龙场——那是瘴疠横行、言语不通的绝地。他在生死边缘默坐省悟，终于证出『心即理』『知行合一』。若没有那场险些送命的贬谪，或许就没有阳明心学。苦难没打败他，反倒替他想通了天大的问题。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>悟道后他数年即平定宁王之乱、平断藤峡盗贼，证明『知行合一』是能拿刀用的学问。心学后来东传日本，成了明治维新志士的精神弹药——一个被贬到悬崖的人，思想却走了很远。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《中国通史·明》》 · 《《书简阅中国》》</div>
