          <h1>项羽</h1>
          <p class="hook">史上最能打的将军，却赢下每一场仗、输掉整场战争</p>
          <div class="body"><p>项羽二十四岁起兵，巨鹿一战破釜沉舟，二十七八岁已是天下共主，平生七十余战未尝一败。可他刚愎、吝赏、放不下脸面，鸿门宴放走刘邦，定都彭城而非关中，最后被困垓下，不肯渡江苟活，自刎时年仅三十。力拔山兮气盖世，到头来，败给的不是敌人，是自己的骄傲。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>他也不识字、不耐烦统筹后勤，打仗全靠本能，分封十八诸侯后立刻众叛亲离。楚汉之争的本质，是『个人武勇 + 贵族义气』对『官僚体系 + 封赏办法』的失败。</p></div>
          <div class="docs"><b>纪录片延伸</b>《《从秦始皇到汉武帝》》 · 《《中国通史·秦汉》》</div>
