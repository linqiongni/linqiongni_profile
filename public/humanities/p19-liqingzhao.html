          <h1>李清照</h1>
          <p class="hook">中国文学史上最耀眼的女词人，晚年是国破家亡、改嫁又离婚的难民</p>
          <div class="body"><p>李清照前半生琴瑟和鸣、赌书泼茶，靖康之变后南渡，丈夫赵明诚病故，毕生收藏的金石书画散尽。她五十三岁再嫁张汝舟，不堪家暴又告发离婚——在宋代，妻告夫要反坐坐牢，她宁肯坐牢也要离。一个闺秀，被时代撕成战士。『生当作人杰』，是孤身一人的怒吼。</p></div>
          <div class="deepen"><h2>再深一层 · 时代背景</h2><p>她与丈夫编《金石录》后序，是中国最早的文物学/目录学女性作者之一。南渡前后词风从『婉约』陡转『沉痛』，几乎是半部宋室南迁史的私人档案。</p></div>
