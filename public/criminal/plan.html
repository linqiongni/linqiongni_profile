<script>
var DAYS = [{"id": "d01", "title": "Day 01　刑事诉讼全流程地图", "html": "<div class=\"meta\"><b>目标：</b>能在白纸上画出公→检→法→执行全链条，并标出全部法定期间。<b>　精读：</b><a href=\"flow.html\" style=\"color:var(--gold)\">模块 01 流程鸟瞰</a> + <a href=\"index.html\" style=\"color:var(--gold)\">总纲</a>。</div>\n<div class=\"meta\"><b>实操：</b>① 手绘一张流程图（不用电脑），含 37 天、批捕后侦查羁押、审查起诉、退补、一审审限、上诉期；② 用模块 01 的期限台账模板，为虚拟案卷填一份完整台账。 </div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D1】你是刑辩方向的严格考官。我是一名正在学习刑事辩护的律师。\n请就《中华人民共和国刑事诉讼法》（2018 年修正本）规定的刑事诉讼流程，向我连续提出 12 个问题，\n每次只问一个，等我回答后再追问下一个。问题覆盖：立案到执行的全部阶段、\n每一阶段的法定期间与起算方式、以及在每个节点上辩护律师可以做哪些动作。\n我答错或答不出的，请直接指出并给出正确答案与法条依据（注明条号，并提示条号可能随修法变动）。\n12 题结束后，请给我一份「薄弱点清单」。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 全流程 12 问 12 答 + 15 个法定期间 + 期限台账</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。</p>\n<h4>一、全流程 12 问 12 答</h4>\n<p><b>1｜刑事诉讼有哪几个主要阶段？</b> 立案 → 侦查 → 审查起诉 → 审判（一审／二审／死刑复核）→ 执行。前端另设立案审查、审查逮捕；特别程序含未成年人、刑事和解、缺席审判、违法所得没收、强制医疗。</p>\n<p><b>2｜传唤、拘传最长多久？</b> 一般不超过 12 小时；案情特别重大复杂、需拘留逮捕的，不超过 24 小时。不得以连续传唤、拘传变相拘禁。（第 119 条）</p>\n<p><b>3｜拘留之后必须做什么？</b> 立即送看守所、至迟不超过 24 小时；除无法通知或危害国家安全、恐怖活动有碍侦查外，24 小时内通知家属；24 小时内讯问。（第 85、86 条）</p>\n<p><b>4｜逮捕之后？</b> 逮捕后 24 小时内必须讯问（第 94 条）；批捕后侦查羁押期限一般 2 个月（第 156 条）。</p>\n<p><b>5｜侦查羁押期限怎么延长？</b> 2 个月 → 案情复杂、期满不能终结，经上一级检察院批准延 1 个月（第 156 条）→ 交通不便、重大犯罪集团、流窜作案、取证困难等，经省级检察院批准或决定延 2 个月（第 157 条）→ 可能判十年以上，再延 2 个月（第 158 条）。</p>\n<p><b>6｜审查起诉期限？</b> 1 个月，重大复杂可延 15 日；认罪认罚速裁 10 日、可能判 1 年以上 15 日。（第 172 条）</p>\n<p><b>7｜退回补充侦查？</b> 每次 1 个月，以 2 次为限；补侦重报后重新计算审查起诉期限。（第 175 条）</p>\n<p><b>8｜一审审限？</b> 一般 2 个月、至迟 3 个月；死刑、附民、交通不便、重大复杂、犯罪集团等，经上级法院批准可延 3 个月；特殊情况报最高法。（第 208 条）</p>\n<p><b>9｜上诉／抗诉期？</b> 判决 10 日、裁定 5 日，从收到裁判文书之次日起算。（第 230 条）</p>\n<p><b>10｜二审审限？</b> 2 个月；死刑、附民、重大复杂等可延 2 个月；特殊情况报最高法。（第 243 条）</p>\n<p><b>11｜死刑复核？</b> 由最高人民法院核准；最高法可提审或发回重审。（第 246、250 条）</p>\n<p><b>12｜执行环节？</b> 死刑经最高法签发执行命令后 7 日内交付执行；死缓、无期、有期徒刑由公安机关依法送交执行。（第 261、264 条）</p>\n\n<h4>二、15 个法定期间速查（要求背到条件反射）</h4>\n<table><tr><th>环节</th><th>期间</th><th>起算／备注</th></tr>\n<tr><td>传唤／拘传</td><td>≤12h；特殊≤24h</td><td>不得连续变相拘禁</td></tr>\n<tr><td>拘留后送押</td><td>≤24h</td><td>拘留后立即</td></tr>\n<tr><td>拘留后通知家属</td><td>≤24h</td><td>有碍侦查除外</td></tr>\n<tr><td>拘留后讯问</td><td>≤24h</td><td>—</td></tr>\n<tr><td>拘留→提请批捕</td><td>3 日，可延 1–4 日</td><td>流窜／多次／结伙可至 30 日</td></tr>\n<tr><td>检察院审查批捕</td><td>7 日</td><td>自收到提请之日起</td></tr>\n<tr><td>逮捕后讯问</td><td>≤24h</td><td>—</td></tr>\n<tr><td>侦查羁押</td><td>2 个月（+1+2+2）</td><td>按第156—158条逐级延长</td></tr>\n<tr><td>审查起诉</td><td>1 个月（+15 日）</td><td>速裁 10／15 日</td></tr>\n<tr><td>退回补充侦查</td><td>每次 1 个月×2 次</td><td>重报后重新计算</td></tr>\n<tr><td>一审审限</td><td>2–3 个月（+3 个月）</td><td>第208条</td></tr>\n<tr><td>上诉／抗诉</td><td>判决 10 日／裁定 5 日</td><td>次日起算</td></tr>\n<tr><td>二审审限</td><td>2 个月（+2 个月）</td><td>第243条</td></tr>\n<tr><td>死刑执行</td><td>命令签发后 7 日内</td><td>第261条</td></tr>\n<tr><td>羁押必要性审查</td><td>逮捕后全程可申请</td><td>第95条</td></tr>\n</table>\n\n<h4>三、虚拟案卷期限台账（已填好，对照你的手绘图）</h4>\n<table><tr><th>日期</th><th>事件</th><th>对应期限／到期</th><th>辩护动作</th></tr>\n<tr><td>2025-03-05</td><td>电话通知到案，李某自行到案</td><td>——</td><td>固定「自动投案」证据，为自首留口</td></tr>\n<tr><td>2025-03-06</td><td>刑事拘留</td><td>24h 内送押＋通知家属；3＋(1–4) 日内提捕</td><td>核《拘留通知书》</td></tr>\n<tr><td>2025-03-08</td><td>送看守所</td><td>——</td><td>确认羁押场所</td></tr>\n<tr><td>2025-03-10</td><td>家属委托</td><td>——</td><td>利益冲突审查、签委托</td></tr>\n<tr><td>2025-03-11</td><td>首次会见</td><td>刑拘后尽快（48h 内安排）</td><td>做第一次会见笔录</td></tr>\n<tr><td>2025-04-04</td><td>批准逮捕</td><td>逮捕后 24h 内讯问；侦查羁押 2 个月</td><td>启动羁押必要性铺垫</td></tr>\n<tr><td>2025-05-20</td><td>侦查终结移送审查起诉</td><td>审查起诉 1 个月（至 06-20，可延 15 日）</td><td>阅卷、写辩护意见</td></tr>\n<tr><td>2025-06-18</td><td>第一次退补</td><td>补侦 1 个月，至 07-18</td><td>跟踪补侦方向</td></tr>\n<tr><td>2025-07-15</td><td>补侦重报</td><td>重新计算审查起诉 1 个月</td><td>再阅卷</td></tr>\n<tr><td>2025-08-10</td><td>第二次退补</td><td>补侦 1 个月，至 09-10</td><td>盯「两次为限」</td></tr>\n<tr><td>2025-09-05</td><td>补侦重报</td><td>重新计算</td><td>提交不起诉意见</td></tr>\n<tr><td>2025-09-25</td><td>提起公诉</td><td>一审审限起算</td><td>庭前会议准备</td></tr>\n</table>\n\n<h4>四、侦查阶段：律师能做／不能做</h4>\n<p><b>能做：</b>会见、通信；代理申诉、控告；申请变更强制措施；向侦查机关了解涉嫌罪名与案件有关情况；提出法律意见。（第 38 条）</p>\n<p><b>受限／不能：</b>阅卷自审查起诉之日起才可（第 40 条）；向被害人及其近亲属、被害人提供的证人取证须经许可（第 43 条）——这是「不能想取就取」的边界。</p>\n<div class=\"box tip\"><span class=\"lb\">自检答案</span>侦查阶段律师<b>不能</b>做的两件事：① 阅卷（要等审查起诉）；② 无限制地向被害人／证人取证。这两点答不出，说明第 38、40、43 条还没吃透。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>不看资料能否说出 15 个法定期间？能否说出侦查阶段律师不能做的两件事？　<b>当日交付物：</b>手绘流程图 + 虚拟案卷期限台账。</div>", "has_out": true}, {"id": "d02", "title": "Day 02　接案：第一个电话与 14 项必问", "html": "<div class=\"meta\"><b>目标：</b>能在 8 分钟内通过一次电话完成信息采集，且不说一句禁语。<b>　精读：</b><a href=\"intake.html\" style=\"color:var(--gold)\">模块 02 第一、二节</a>。</div>\n<div class=\"meta\"><b>实操：</b>看着虚拟案卷，写下「如果李某妻子今天打电话来，你会问的 14 个问题」；再写下你绝对不会说的 5 句话。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D2】请扮演李某的妻子王某（案情见虚拟案卷：李某涉嫌职务侵占 68 万元，\n2025 年 3 月 6 日被刑拘，现羁押于看守所）。你的情绪激动、信息混乱、会不断追问「能不能放人」\n「要花多少钱」「我能不能给他带话」，并且会提出「能不能帮我去跟客户打个招呼让他们改口」这类请求。\n我扮演接案律师。请与我进行一场真实对话。对话结束后，请你切换到考官身份，\n逐条点评：① 我漏问了哪些关键信息；② 我有没有说任何一句违规或不当的话；\n③ 我有没有妥善应对她的违法请求。请给出具体的替代话术。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 14 项必问 + 5 句禁语 + 采集表</span>\n<h4>一、《接案信息采集表》（李某妻子来电场景，14 项）</h4>\n<table><tr><th>#</th><th>必问</th><th>本案应采集到的信息</th></tr>\n<tr><td>1</td><td>你是谁、与嫌疑人关系、是否本人有委托权</td><td>王某，妻子，法定近亲属，有独立委托权</td></tr>\n<tr><td>2</td><td>嫌疑人身份信息</td><td>李某，1990-05，身份证号、户籍与现住址</td></tr>\n<tr><td>3</td><td>涉嫌罪名，谁告知的</td><td>职务侵占罪，公安口头告知，是否已送达书面通知待核</td></tr>\n<tr><td>4</td><td>何时被带走、现在押何处</td><td>2025-03-06 拘留，市看守所</td></tr>\n<tr><td>5</td><td>到案方式（自己去／被抓）</td><td>电话通知后自行到案——<b>自首候选事实，务必固定</b></td></tr>\n<tr><td>6</td><td>办案机关、承办人、联系方式</td><td>××公安分局经侦大队，承办人及电话</td></tr>\n<tr><td>7</td><td>是否收到《拘留通知书》／《逮捕通知书》</td><td>已收／未收，签收日期</td></tr>\n<tr><td>8</td><td>此前是否有其他律师介入</td><td>有／无，避免重复委托</td></tr>\n<tr><td>9</td><td>家属手上有什么材料</td><td>劳动合同、提成核算表、微信记录、退货凭证</td></tr>\n<tr><td>10</td><td>身体状况、既往病史、是否服药</td><td>有无需羁押关注的情形，为变更强制措施铺垫</td></tr>\n<tr><td>11</td><td>工作单位、职务、涉案金额说法</td><td>甲公司华南区销售经理，公司称 68 万，李某称 42 万系提成冲抵</td></tr>\n<tr><td>12</td><td>家属诉求与期望</td><td>取保、想知道要花多少钱、想带话</td></tr>\n<tr><td>13</td><td>付费与委托方式</td><td>分阶段／全流程，费用合规</td></tr>\n<tr><td>14</td><td>有无同案人、是否有人一起被带走</td><td>有无共犯，影响策略</td></tr>\n</table>\n<h4>二、你绝对不能说的 5 句话（附替代话术）</h4>\n<table><tr><th>禁语</th><th>风险</th><th>替代说法</th></tr>\n<tr><td>「这案没问题，肯定能放人」</td><td>承诺结果，违反执业规范</td><td>「结果由事实和法律决定，我不能承诺，但先告诉你现在最该做什么。」</td></tr>\n<tr><td>「我认识办案的人，帮你打招呼」</td><td>行贿／妨害司法</td><td>「我只在法律程序内辩护，不做程序外的动作。」</td></tr>\n<tr><td>「先把钱付了，其他再说」</td><td>违规收费、事后争议</td><td>「先做利益冲突审查和案件初评，确认能承办再谈委托与费用。」</td></tr>\n<tr><td>「你让他什么都不用说」</td><td>可能被视为教唆</td><td>「我会告诉他依法行使权利、如实回答，也有权拒绝诱导性提问。」</td></tr>\n<tr><td>「你去找客户改口供」</td><td>妨害作证罪</td><td>「这是犯罪，绝对不能做，我会告诉你合法路径。」</td></tr>\n</table>\n<div class=\"box warn\"><span class=\"lb\">易漏项</span>最容易漏问的是 <b>第 5 项「到案方式」</b>——本案李某是电话通知后自行到案，正是自首的关键事实，漏问等于丢了一个量刑情节。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>有没有问到「到案方式」？有没有承诺结果？有没有拒绝带话请求？　<b>当日交付物：</b>《接案信息采集表》+《接案禁语清单》。</div>", "has_out": true}, {"id": "d03", "title": "Day 03　利益冲突与委托手续", "html": "<div class=\"meta\"><b>目标：</b>能独立完成利益冲突审查，并起草一套无瑕疵的委托文件。<b>　精读：</b><a href=\"intake.html\" style=\"color:var(--gold)\">模块 02 第三、四节</a>。</div>\n<div class=\"meta\"><b>实操：</b>为虚拟案卷起草《利益冲突审查表》《刑事辩护委托协议》《授权委托书》三份文件（用文书库 T01 模板）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D3】你是一名律师协会惩戒委员会的审查员，负责审查我提交的委托材料是否合规。\n案情：李某涉嫌职务侵占罪，其妻王某委托我。同时，我所在律所的另一名律师此前\n曾为报案单位甲公司提供过两年的法律顾问服务（已终止 6 个月），且目前仍代理甲公司的两起民事诉讼。\n请你以最严格的口径审查：① 我能否接受本案委托？② 需要履行哪些程序（利益冲突审查、\n是否需向甲公司披露并征得其同意、是否需要设置信息隔离墙）？③ 若要接受委托，\n协议中必须增加哪些条款以自保？请逐条给出结论与依据。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 利益冲突审查结论 + 三份委托文件要点</span>\n<h4>一、《利益冲突审查表》结论</h4>\n<table><tr><th>审查项</th><th>本案情况</th><th>结论</th></tr>\n<tr><td>同一律师是否双方代理</td><td>承办律师未代理甲公司，但同所律师现仍代理甲公司两起民事诉讼</td><td>⚠ 触发冲突</td></tr>\n<tr><td>报案单位＝被害人？</td><td>甲公司是本案报案单位与被害单位</td><td>是</td></tr>\n<tr><td>同所是否服务被害人</td><td>曾提供 2 年顾问服务、已终止 6 个月、<b>现仍代理其民事诉讼</b></td><td>构成利益冲突</td></tr>\n<tr><td>结论</td><td colspan=\"2\"><b>原则上不得接受委托。</b>同一律所同时服务被害单位与嫌疑人，通常应回避。</td></tr>\n</table>\n<p><b>依据：</b>《律师法》第 39 条；《律师执业行为规范》利益冲突条款；《律师办理刑事案件规范》关于发现利益冲突应拒绝或解除委托的规定。</p>\n<h5>若坚持接受，必须完成的前置程序</h5>\n<ul>\n<li>向甲公司<b>书面披露</b>并取得其同意（未成年人／刑案中通常难以取得）；</li>\n<li>取得李某的<b>书面知情同意</b>；</li>\n<li>设置<b>信息隔离墙</b>：屏蔽案件信息、独立办公与卷宗、签署保密承诺、由未接触甲公司业务的律师承办；</li>\n<li>由律所风控出具书面审查意见并存档。</li>\n</ul>\n<div class=\"box warn\"><span class=\"lb\">务实建议</span>本案更稳妥的做法是：<b>更换承办律所</b>，或等待与甲公司的民事代理完全终止并做隔离后再评估。不要为了接案去冒险，冲突一旦被投诉，代价远大于代理费。</div>\n<h4>二、三份委托文件要点</h4>\n<h5>《利益冲突审查表》</h5>\n<p>当事人信息、关系人（被害人／报案人／同案人）清单、关联案件、同所律师业务检索结果、结论与审批签字。</p>\n<h5>《刑事辩护委托协议》必备条款</h5>\n<ul><li>委托事项与<b>诉讼阶段</b>（侦查／审查起诉／一审／二审，逐段列明）；</li>\n<li><b>服务内容</b>（会见、阅卷、出庭、文书等）；</li>\n<li><b>收费方式与金额</b>，并明确<b>不得风险代理</b>（刑事案件禁止风险代理）；</li>\n<li>不作结果承诺条款；</li>\n<li>委托人的配合义务；</li>\n<li><b>解除与退费</b>规则；保密条款。</li></ul>\n<h5>《授权委托书》</h5>\n<p>受托人（含执业证号）、委托权限（一般授权／含代为申诉控告）、委托阶段、委托人签字、日期。</p>\n</div>\n\n<div class=\"meta\"><b>自检：</b>协议里有没有写清诉讼阶段、服务内容、收费方式、不可风险代理、解除与退费？　<b>当日交付物：</b>三份委托文件定稿。</div>", "has_out": true}, {"id": "d04", "title": "Day 04　建卷、工作日志与收费", "html": "<div class=\"meta\"><b>目标：</b>建立一套可以扛得住投诉和律协检查的卷宗体系。<b>　精读：</b><a href=\"intake.html\" style=\"color:var(--gold)\">模块 02 第六、七节</a>。</div>\n<div class=\"meta\"><b>实操：</b>按 A—H 八个分区搭建虚拟案卷的目录结构；写 5 份不同日期、不同动作类型的《工作日志》。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D4】请扮演一位投诉律师的委托人。案情：李某案，我作为辩护人办理了 8 个月，\n最终李某被判有期徒刑 2 年（家属期望是缓刑）。现在家属向律师协会投诉我「收了钱不办事、\n从未主动反馈、卷宗里什么都没有」。请模拟投诉听证会，向我提出 10 个尖锐问题。\n我会用我的工作日志与卷宗来答辩。听证结束后，请你评价：我的留痕是否足以自证？\n还需补充哪些材料？并请给我一份「律师卷宗最低留痕标准清单」。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 卷宗 A–H 目录 + 5 份工作日志 + 留痕清单</span>\n<h4>一、卷宗 A–H 八分区目录</h4>\n<table><tr><th>分区</th><th>内容</th></tr>\n<tr><td>A 委托文件</td><td>委托协议、授权委托书、身份证明、亲属关系证明</td></tr>\n<tr><td>B 风控与冲突</td><td>利益冲突审查表、披露函、同意函、隔离墙承诺</td></tr>\n<tr><td>C 日志与收费</td><td>工作日志、发票、收据、收费约定</td></tr>\n<tr><td>D 会见与通信</td><td>会见笔录、会见申请／受阻记录、通信记录</td></tr>\n<tr><td>E 程序性文书</td><td>取保申请、羁押必要性审查、变更强制措施、申诉控告、解封申请</td></tr>\n<tr><td>F 阅卷与调查</td><td>阅卷笔录、卷宗目录、调查笔录、调取证据申请</td></tr>\n<tr><td>G 实体性文书</td><td>辩护意见书、排非申请、质证意见、辩护词、量刑意见</td></tr>\n<tr><td>H 往来与回执</td><td><b>提交文书的签收凭证</b>、机关回函、法院通知、裁判文书</td></tr>\n</table>\n<h4>二、5 份工作日志（不同日期／不同动作）</h4>\n<div class=\"doc\">【工作日志 · 2025-03-10】\n时间：14:00–15:30　地点：本所会议室\n对象：委托人王某（李某之妻）\n事项：接待咨询；说明辩护律师职责与边界；确认委托阶段为侦查阶段；提示不得串供、不得联系客户改口\n结果：收取身份证明与亲属关系证明，签署《委托协议》《授权委托书》\n下一步：3-11 上午赴市看守所首次会见\n\n【工作日志 · 2025-03-11】\n时间：09:30–11:00　地点：市看守所\n事项：首次会见李某，完成《第一次会见笔录》（八段问答，李某逐页签字）\n结果：固定到案方式（电话通知自行到案）、深夜讯问线索（3-06 22:00–次日 04:00）\n下一步：核查《拘留通知书》送达情况\n\n【工作日志 · 2025-04-02】\n时间：10:00　方式：现场递交 + 留存回执\n事项：向××公安分局提交《取保候审申请书》\n结果：承办人签收回执编号 ××\n下一步：3 日后电话跟进\n\n【工作日志 · 2025-05-22】\n时间：全天　地点：检察院案管中心\n事项：阅卷并制作《卷宗目录表》《阅卷笔录》\n结果：摘录讯问笔录 5 份、鉴定意见 1 份、证人证言 6 份\n下一步：就卷宗页码与复印件核对\n\n【工作日志 · 2025-09-10】\n时间：16:00　方式：EMS（留存根）\n事项：向检察院提交《审查起诉阶段辩护意见书》，主张证据不足不起诉\n结果：EMS 单号 ××，妥投\n下一步：等待不起诉／起诉决定</div>\n<h4>三、律师卷宗最低留痕标准清单</h4>\n<ul class=\"chk\">\n<li>每次会见都有笔录且当事人签字；</li>\n<li>每次提交文书都有签收凭证（现场要回执／邮寄存根）；</li>\n<li>每笔收费都有发票或合规收据；</li>\n<li>每个法定期间都有台账与到期提醒；</li>\n<li>每次与家属沟通有记录或可查的微信留痕；</li>\n<li>重要节点（批捕、退补、开庭）均有书面意见入卷；</li>\n<li>不接受口头承诺，所有重要约定书面化；</li>\n<li>不代收当事人钱款，不私下收费；</li>\n<li>阅卷复印件与原件核对并注明来源页码；</li>\n<li>委托变更、解除均有书面确认。</li>\n</ul>\n</div>\n\n<div class=\"meta\"><b>自检：</b>卷宗里有没有「提交文书的签收凭证」这一项？　<b>当日交付物：</b>卷宗目录 + 5 份工作日志。</div>", "has_out": true}, {"id": "d05", "title": "Day 05　周末实战：完整走一遍接案", "html": "<div class=\"meta\"><b>目标：</b>把 D1—D4 串成一次连贯的接案演练。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D5 · 综合演练】请依次扮演三个角色与我对话，每个角色 15 分钟：\n① 焦急的家属王某（第一次咨询）；② 我的合伙人（问我：这个案子接不接？\n风险在哪？收费多少？要不要全流程委托？）；③ 律所风控（审查我的委托材料并挑刺）。\n案情见虚拟案卷。每个角色结束后请给我 3 条改进建议。全部结束后请给出一份\n《本案接案阶段综合评估报告》，从专业度、风险控制、沟通话术三个维度打分（百分制）并说明理由。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 三角色演练要点 + 综合评估报告</span>\n<h4>一、三角色演练要点</h4>\n<h5>① 家属王某（第一次咨询）</h5>\n<p>共情（「我理解你现在很慌」）→ 信息采集（14 项必问）→ 管理预期（不承诺结果）→ 明确拒绝违法请求（不接触客户、不带话、不串供）。</p>\n<h5>② 合伙人（接不接、风险、收费）</h5>\n<p>案情摘要：职务侵占，指控 68 万，当事人辩称 42 万系提成冲抵、26 万系借款。<br>\n量刑预判：数额较大的档次之争（68 万 vs 认定后的 26 万／46 万）；若成立，3 年上下，有自首＋退赔＋部分谅解空间，缓刑可争。<br>\n风险：42 万冲抵缺乏书面证据、同所与被害单位的利益冲突、当事人 5 次笔录前后翻供。<br>\n收费：分阶段报价（侦查／审查起诉／一审／二审），<b>禁风险代理</b>。</p>\n<h5>③ 律所风控（挑刺）</h5>\n<p>委托材料是否齐备、利益冲突是否解决、收费是否合规、有无结果承诺、有无违规承诺会见效果。</p>\n<h4>二、《本案接案阶段综合评估报告》（样例）</h4>\n<table><tr><th>维度</th><th>得分</th><th>说明</th></tr>\n<tr><td>专业度</td><td>82／100</td><td>案情研判与实际相符；42 万冲抵的性质论证可更充分</td></tr>\n<tr><td>风险控制</td><td>68／100</td><td>冲突审查到位；但对「不得串供」的书面提示可再强化</td></tr>\n<tr><td>沟通话术</td><td>80／100</td><td>共情自然；对「要花多少钱」的回应可更结构化</td></tr>\n</table>\n<p><b>接案行动清单：</b>① 完成冲突审查并决定是否接案；② 签署委托文件；③ 建 A—H 卷宗；④ 3 日内首次会见；⑤ 提交取保申请；⑥ 向家属出具《辩护方案说明书》。</p>\n</div>\n\n<div class=\"meta\"><b>当日交付物：</b>一份完整的「接案档案」（信息表 + 冲突审查 + 委托文件 + 建卷目录 + 3 份日志）。</div>", "has_out": true}, {"id": "d06", "title": "Day 06　会见权：三证、48 小时与救济", "html": "<div class=\"meta\"><b>目标：</b>权利边界倒背如流，遇到刁难知道往哪里投诉。<b>　精读：</b><a href=\"meeting.html\" style=\"color:var(--gold)\">模块 03 第一、十节</a>。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D6】请扮演某看守所的值班民警。我持执业证、律所介绍信、委托书要求会见李某。\n请你设置五道障碍（依次为：称需侦查机关同意、称今日号满要等 5 天、称办案单位有口头通知、\n要求我额外提供委托人与嫌疑人的亲属关系公证书、坚持派员在场监听）。\n我要逐一应对并说明法律依据。每轮结束后你点评我的应对是否恰当，并给出更优表述。\n最后请总结一份《看守所常见违法阻权情形及救济路径速查表》。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 五道障碍标准应对 + 救济速查表</span>\n<h4>一、看守所五道障碍：标准应对</h4>\n<table><tr><th>障碍</th><th>违法点</th><th>你的标准表述</th></tr>\n<tr><td>①「需侦查机关同意」</td><td>法律只对危害国家安全、恐怖活动犯罪在侦查期间要求经侦查机关许可</td><td>「辩护律师持三证即可会见，本案不属于法定需许可的两类犯罪，无需侦查机关同意。」</td></tr>\n<tr><td>②「今日号满，要等 5 天」</td><td>法律要求尽快／48 小时内安排</td><td>「请依法安排在 48 小时内会见；若确有困难，请出具书面说明并告知可安排的时间。」</td></tr>\n<tr><td>③「办案单位有口头通知」</td><td>口头通知无法律依据</td><td>「请出示书面决定。无书面决定，应依法安排会见。」</td></tr>\n<tr><td>④「要亲属关系公证书」</td><td>擅自增设法定外条件</td><td>「委托书、身份证、亲属关系证明已齐备，法律未要求公证，请勿增设条件。」</td></tr>\n<tr><td>⑤「派员在场监听」</td><td>辩护律师会见不被监听</td><td>「辩护律师会见不被监听，这有明确规定，请予纠正。」</td></tr>\n</table>\n<h4>二、看守所常见违法阻权情形及救济路径速查表</h4>\n<table><tr><th>情形</th><th>救济路径</th></tr>\n<tr><td>无法定理由拒绝会见</td><td>要求书面说明 → 向看守所主管公安机关投诉 → 驻所检察室控告</td></tr>\n<tr><td>拖延安排会见</td><td>书面申请并留痕 → 向检察院驻所检察室反映</td></tr>\n<tr><td>监听、派员在场</td><td>当场拒绝并要求记入提讯／会见记录 → 向驻所检察室、律协投诉</td></tr>\n<tr><td>要求额外材料</td><td>书面异议 → 向其上级机关反映</td></tr>\n<tr><td>会见次数／时间被限</td><td>主张会见权无次数限制 → 投诉监督</td></tr>\n</table>\n<div class=\"box tip\"><span class=\"lb\">留痕铁律</span>每一次受阻都要形成<b>书面记录</b>：时间、地点、拒绝人、拒绝理由、你的表述、在场人。这些记录既是维权材料，也是申诉控告（第 47 条）的依据。</div>\n</div>\n\n<div class=\"meta\"><b>当日交付物：</b>一份《会见受阻应对手册》（含每句话的标准表述）。</div>", "has_out": true}, {"id": "d07", "title": "Day 07　第一次会见与笔录", "html": "<div class=\"meta\"><b>目标：</b>独立完成第一次会见并产出一份能用于自保的笔录。<b>　精读：</b><a href=\"meeting.html\" style=\"color:var(--gold)\">模块 03 第三至六节</a>。</div>\n<div class=\"meta\"><b>实操：</b>用模块 03 的第一次会见笔录模板，为虚拟案卷写一份<b>完整</b>的会见笔录（时间设定为 2025 年 3 月 11 日），问答都要写实。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D7】请扮演在押的犯罪嫌疑人李某（2025 年 3 月 11 日，刑拘第 6 天，\n第一次见到律师）。你的状态：紧张、想尽快出去、对律师半信半疑、说话前后矛盾，\n并且会主动问「我该怎么说才能出去」。我会对你进行第一次会见。\n请你按照真实在押人员的方式回应。会见结束后请切换到考官身份，点评：\n① 我的提问有没有诱导性；② 我有没有遗漏关键的排非线索；\n③ 我有没有妥善应对「我该怎么说」这个问题；④ 笔录的结构是否完整。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 《第一次会见笔录》完整版</span>\n<div class=\"doc\">【第一次会见笔录】\n会见时间：2025-03-11　09:30—11:00\n会见地点：市看守所第 × 会见室\n会见方式：现场会见（无监听）\n辩护律师：×××（××律师事务所）\n犯罪嫌疑人：李某（男，1990 年 5 月生，甲科技有限公司华南区销售经理）\n记录人：×××\n\n一、身份核对与告知\n问：我是××律师事务所律师×××，受你妻子王某委托，担任你本案的辩护人。请先核对：姓名、出生日期、身份证号、现住址？\n答：（略，逐一核对无误）\n问：我现在告知你，作为犯罪嫌疑人你有权自行辩护，有权委托辩护人；你已由你妻子代为委托，是否同意我做你的辩护人？\n答：同意。\n问：你是否有权拒绝回答与本案无关的问题、有权申请回避、有权申请变更强制措施，这些你知道吗？\n答：知道。\n问：本次我依法会见，<b>不被监听、不被派员在场</b>，你有什么顾虑可以问我。\n\n二、涉嫌罪名与法律规定的了解\n问：办案机关告知你涉嫌什么罪？\n答：职务侵占罪。\n问：你对这个罪名了解多少？知不知道法律规定的后果？\n答：不太懂，就知道公司报案说我拿了 68 万。\n\n三、案件事实（当事人陈述）\n问：请你把事情的经过从头说一遍，从你在公司做什么开始。\n答：（陈述略）我负责客户签约和回款管理。公司欠我提成和报销款很久，分管副总张某口头同意我用客户货款直接冲抵，一共 42 万。另外 26 万是我向公司借的，写了借条，按月还，案发前已经还了 12 万。公司现在把 68 万全算我侵占，不对。\n问：这 42 万冲抵的事，有没有书面或聊天记录证据？\n答：微信里有跟张某的聊天，还有历年的提成核算表，我家里有。\n问：26 万的借条还在吗？还款记录呢？\n答：借条在公司，我还款的转账记录我手机里有。\n问：你收钱用的哪个账户？\n答：我个人的银行卡。\n\n四、到案经过与强制措施\n问：你是怎么到案的？是公安来抓的，还是通知你的？\n答：3 月 5 号公安打电话让我去一趟，我自己去的，说完他们就没让我回来。\n问：你去之前知不知道自己是犯罪嫌疑人？\n答：不知道，我以为是公司的事叫我去解释。（<b>→ 固定「自动投案＋如实供述」的自首事实</b>）\n问：拘留证、通知书收到没有？家属收到《拘留通知书》了吗？\n答：拘留的时候签了字；家里通没通知我不知道。\n\n五、讯问情况与是否存在非法取证（关键）\n问：你一共被讯问过几次？每次大概什么时间、有没有人打你、骂你、不让你睡觉？\n答：5 次。前 3 次我承认了侵占，后来我觉得不对就翻了。\n问：为什么前 3 次承认，后面又不承认了？\n答：第一次讯问是<b>从 3 月 6 日晚上 10 点一直到第二天凌晨 4 点，六个小时</b>，中间没让我休息，也没告诉我有什么权利，我脑子是懵的，就按他们说的签了。\n问：讯问时有没有录音录像？讯问笔录你有没有逐页看？\n答：录了吧，不知道；笔录我签了字，但当时没细看。\n问：每次讯问有没有人在场、几个人、有没有让你签权利义务告知书？\n答：（如实回答。→ 为排除非法证据申请固定线索：时间、地点、时长、未告知权利、无同步录音录像或设备故障）\n\n六、是否需要转达家事（不含案情）\n问：有没有家里的事需要我转达给你家属？（注意：不得传递案情、不得串供）\n答：跟我妻子说我没事，让她别担心，照顾好孩子。\n\n七、律师职责与禁止事项（自保必问）\n问：你有没有受到任何来自我或其他人的压力、诱导，让我做违规的事？\n答：没有。\n问：我有没有<br>——教唆你作虚假陈述、帮你串供、让你隐瞒事实、给你承诺结果？请你如实回答，这要记入笔录。\n答：没有，你只是让我把事实说清楚。\n问：我向你说明：你要如实陈述，不得捏造、串供；我也不会替你做任何违法的事。\n\n八、确认\n问：以上笔录我已念给你听／你自己看过，是否与你陈述一致？\n答：一致。\n问：请逐页签字、捺印。有需要补充的吗？\n答：没有。\n\n犯罪嫌疑人签名：__________（捺印）　日期：2025-03-11\n辩护律师签名：__________　记录人：__________</div>\n<div class=\"box tip\"><span class=\"lb\">这份笔录的价值</span>第五段的<b>深夜讯问＋未告知权利线索</b>是排非申请的火种；第四段的<b>自行到案</b>是自首的证据。这两段写实了，后面 Day 08 才有得打。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>笔录里有没有「律师有无教唆你作虚假陈述」这一问？有没有固定深夜讯问的线索？　<b>当日交付物：</b>《第一次会见笔录》完整版。</div>", "has_out": true}, {"id": "d08", "title": "Day 08　排非：从线索到申请", "html": "<div class=\"meta\"><b>目标：</b>能把会见中获得的线索转化为一份有说服力的排非申请。<b>　精读：</b><a href=\"investigation.html\" style=\"color:var(--gold)\">模块 04 第六节</a> + <a href=\"meeting.html\" style=\"color:var(--gold)\">模块 03 第五节</a>。</div>\n<div class=\"meta\"><b>实操：</b>针对虚拟案卷「3 月 6 日 22 时至次日凌晨 4 时连续讯问 6 小时、未告知权利义务」这一线索，写《排除非法证据申请书》与《调取证据申请书》（调取入所体检表、提讯登记、同步录音录像）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D8】你是对本案进行羁押必要性审查和非法证据审查的检察官。\n我已提交《排除非法证据申请书》，主张李某前 3 份讯问笔录系疲劳审讯且未告知权利义务所取得，\n应予排除。请你以最挑剔的眼光审查我的申请：① 我的线索是否具体（时间、地点、人员、方式、后果）？\n② 我遗漏了哪些必须调取的客观材料？③ 如果检方主张「已全程录音录像但设备故障」，我该如何反驳？\n④ 请模拟你作出的《审查决定书》，并说明支持或驳回的理由。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 排非申请书 + 调取证据申请书 全文</span>\n<h4>一、《排除非法证据申请书》（正文）</h4>\n<div class=\"doc\">申请人：×××，××律师事务所律师，系犯罪嫌疑人李某的辩护人。\n申请事项：\n1. 依法排除犯罪嫌疑人李某 2025 年 3 月 6 日 22 时至 3 月 7 日凌晨 4 时讯问所取得的第一份讯问笔录（卷 P12—P24）；\n2. 依法排除本次讯问之后、在未告知诉讼权利情况下所取得的第 2、3 份讯问笔录（卷 P25—P41）。\n\n事实与理由：\n一、存在疲劳审讯的线索。据李某陈述并经本律师会见核实：2025 年 3 月 6 日 22 时至次日凌晨 4 时，侦查人员对李某连续讯问达 <b>6 小时</b>，中间未安排必要休息，属于以连续讯问方式变相剥夺休息，涉嫌《刑事诉讼法》第 52 条禁止的「以疲劳审讯等非法方法收集证据」。\n二、未依法告知诉讼权利。该次讯问未向李某送达或宣读权利义务告知书，未告知其有权拒绝回答与本案无关的问题，违反法定程序。\n三、后果：上述取证方法严重影响李某供述的自愿性与真实性，该供述依法应当排除；以其为线索继而取得的第 2、3 份笔录亦受污染，应予排除。\n\n申请调取（随附《调取证据申请书》另行提交）：\n① 2025-03-06 至 03-07 的<b>提讯登记记录</b>与出入监区登记；\n② 该次讯问的<b>同步录音录像</b>；\n③ 李某<b>入所体检表</b>；\n④ 该次讯问<b>权利义务告知书</b>（或证明未告知）。\n\n申请人：__________　2025 年 × 月 × 日</div>\n<h4>二、《调取证据申请书》（要点）</h4>\n<div class=\"doc\">申请调取以下证据：\n1. 2025-03-06 22:00—03-07 04:00 讯问李某的同步录音录像原始载体；\n2. 2025-03-06—03-10 期间看守所提讯登记、出入监区记录；\n3. 李某入所体检表及历次体检记录（用于印证疲劳／身体状况）；\n4. 该次讯问所使用笔录纸的填写、签字、捺印原件，核对是否为本人真实意思。\n理由：上述材料系证明本次讯问合法性的关键，且由侦查机关独家掌握，本人及辩护人无法自行取得，依法申请调取。</div>\n<h4>三、线索固定要点（把线索引成链条）</h4>\n<ul>\n<li><b>时间</b>：精确到起止钟点（3-06 22:00 至 03-07 04:00）；</li>\n<li><b>地点</b>：讯问室／办案区名称；</li>\n<li><b>人员</b>：讯问人、记录人（记录在笔录签名处）；</li>\n<li><b>方式</b>：连续讯问、未休息、未告知权利；</li>\n<li><b>后果</b>：供述内容与后续翻供的矛盾、签字时未阅读。</li>\n</ul>\n<div class=\"box warn\"><span class=\"lb\">反驳检方「设备故障」</span>录音录像由侦查机关掌握，其不能提供或推诿为「设备故障」，应由其承担举证不能的后果；可主张该情形下讯问供述的真实性存疑，并结合提讯登记、体检表、出入所记录形成印证。</div>\n</div>\n\n<div class=\"meta\"><b>当日交付物：</b>排非申请书 + 调取证据申请书。</div>", "has_out": true}, {"id": "d09", "title": "Day 09　取保候审与不批捕", "html": "<div class=\"meta\"><b>目标：</b>写出一份承办人「敢批」的取保申请。<b>　精读：</b><a href=\"investigation.html\" style=\"color:var(--gold)\">模块 04 第二、三节</a>。</div>\n<div class=\"meta\"><b>实操：</b>设定时间为 2025 年 3 月 20 日（提请批捕前），写《取保候审申请书》+《不予批准逮捕法律意见书》。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D9】你是负责审查逮捕的检察官。我提交了李某案的取保申请与不批捕意见。\n请你从五个社会危险性维度逐一向我发问（你会重点关注：涉案 68 万元未退清、\n是否可能毁灭微信聊天记录等证据、是否可能联系客户串供）。\n我要逐项反驳并给出替代监管方案。请你对我的每一次反驳打分（1—10 分）并说明理由。\n最后请你作出「批捕 / 不批捕」的决定，并完整说明你的心证形成过程。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 取保／不批捕 + 社会危险性五维反驳表</span>\n<h4>一、《不予批准逮捕法律意见书》／《取保候审申请书》主张要点</h4>\n<div class=\"doc\">一、本案系公司内部经济纠纷引发的财产性犯罪，不具有社会危险性：\n1. 李某系电话通知后自行到案，人身危险性、脱逃可能性小；\n2. 有固定住所、稳定家庭，妻女在本市，具备保证条件；\n3. 公司长期拖欠提成、报销款，42 万元系口头同意的冲抵，实质上属于劳动争议范畴，争议金额亦有相当部分是民事纠纷；\n4. 已在案发后退赔 20 万元，具有悔罪表现，愿意继续退赔其余部分并提供保证人、保证金。\n二、请求对李某不批准逮捕／变更为取保候审。</div>\n<h4>二、社会危险性五维度 × 反驳对照表</h4>\n<table><tr><th>维度（检方关注）</th><th>检方可能主张</th><th>你的反驳</th><th>替代监管方案</th></tr>\n<tr><td>① 实施新犯罪</td><td>可能继续占有客户货款</td><td>已离开公司岗位，无法再接触客户货款</td><td>保证人＋保证金</td></tr>\n<tr><td>② 危害国家安全／公共安全／社会秩序</td><td>本案不涉及</td><td>无</td><td>——</td></tr>\n<tr><td>③ 毁灭伪造证据／干扰证人／串供</td><td>可能销毁微信记录、联系客户串供</td><td>微信记录已被侦查机关调取固定；当事人自愿交出手机；承诺不与客户、同事接触</td><td>上交手机、电子监管、书面承诺</td></tr>\n<tr><td>④ 报复被害人／证人／举报人</td><td>可能报复报案单位</td><td>无报复动机与事实基础</td><td>书面承诺</td></tr>\n<tr><td>⑤ 自杀／逃跑</td><td>涉案金额大，可能脱逃</td><td>自行到案、有固定家庭与住所、无前科</td><td>保证人＋保证金＋单位／社区监管</td></tr>\n</table>\n<div class=\"box tip\"><span class=\"lb\">打批捕的核心</span>不是重复「他很可怜」，而是逐条<b>消灭社会危险性的每一项推定</b>，并为每一项配一个可执行的监管替代方案。检察官敢批，是因为你没给他台阶；把台阶搭好，不批捕才有机会。</div>\n<h4>三、五维度反驳对照表（自检）</h4>\n<p>你的申请里必须能回答：保证人是谁？保证金多少？居住地址？单位／社区是否愿意监管？这四项答不上，申请就没有落地。</p>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的申请里有没有「保证人是谁 + 保证金多少 + 居住地址 + 单位监管」？　<b>当日交付物：</b>两份文书 + 一张「五维度反驳对照表」。</div>", "has_out": true}, {"id": "d10", "title": "Day 10　羁押必要性审查与侦查阶段收尾", "html": "<div class=\"meta\"><b>目标：</b>掌握逮捕之后的持续战场。<b>　精读：</b><a href=\"investigation.html\" style=\"color:var(--gold)\">模块 04 第四、七、九节</a>。</div>\n<div class=\"meta\"><b>实操：</b>设定时间为 2025 年 6 月 10 日（批捕后两个月、已退赔 20 万元、取得部分谅解意向），写《羁押必要性审查申请书》；另写一份《解除查封冻结申请书》（公司账户与李某妻子名下账户被一并冻结）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D10】请依次扮演两个角色：\n① 检察院羁押必要性审查的承办人：我会提交书面申请并申请听证，请你模拟一场 20 分钟的听证会，\n　 你可以随时打断我、质疑我的每一个论点；\n② 侦查机关的办案民警：我会提出公司账户和家属账户被超范围冻结，请你设置阻力（如「涉案就要冻」）。\n两个场景结束后，请分别给出改进建议，并列出「羁押必要性审查最有效的五个论点」排序。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 羁押必要性审查 + 听证提纲 + 解封申请</span>\n<h4>一、《羁押必要性审查申请书》主张要点</h4>\n<div class=\"doc\">时间：2025-06-10（批捕已两个月、已退赔 20 万元、取得部分谅解意向）\n一、案件事实与证据已经固定，不存在妨碍诉讼的客观条件；\n二、李某已退赔 20 万元，其余愿以分期并抵押担保方式清偿，悔罪态度明确；\n三、李某系初犯、偶犯，有固定住所与家庭，无社会危险性；\n四、继续羁押已无必要，且已超出与其涉嫌罪行相当的审前羁押比例。\n请求：建议办案机关对李某变更强制措施为取保候审。</div>\n<h4>二、羁押必要性审查听证提纲</h4>\n<ul>\n<li>第一段（事实）：「案件证据已固定、无毁证可能」——摆证据固定情况；</li>\n<li>第二段（悔罪）：「已退赔 20 万、愿继续退赔」——摆退赔凭证；</li>\n<li>第三段（社会危险性）：「自行到案、固定住所、妻女在本市」——逐项消灭；</li>\n<li>第四段（羁押必要性）：「已羁押 X 月，与罪行相当性失衡」——比例原则；</li>\n<li>第五段（替代方案）：「保证人＋保证金＋分期退赔计划」——让检方敢放。</li>\n</ul>\n<h4>三、《解除查封冻结申请书》要点</h4>\n<div class=\"doc\">申请事项：解除对（1）甲科技有限公司××账户、（2）李某妻子王某名下××账户的冻结。\n理由：\n1. 冻结范围应当限于与犯罪有关的财物，不得超出涉案范围；\n2. 王某名下账户及其资金如与本案犯罪所得无关联，且系家庭生活、子女抚养所必需，不应一并冻结；\n3. 甲公司账户中被冻结的资金如属正常经营往来款，亦应解除，避免扩大损失。\n请求：对上述账户解除冻结，或至少解冻与本案无关的部分。</div>\n<div class=\"box warn\"><span class=\"lb\">超范围冻结怎么打</span>核心逻辑是<b>「涉案性」</b>：侦查机关的冻结权以「与犯罪有关的财物」为限。你要逐笔证明被冻结财产与本案无关，或主张保留必要生活费用，而不是笼统喊冤。</div>\n</div>\n\n<div class=\"meta\"><b>当日交付物：</b>羁押必要性审查申请书 + 听证陈述提纲 + 解除冻结申请书。</div>", "has_out": true}, {"id": "d11", "title": "Day 11　阅卷权与卷宗目录", "html": "<div class=\"meta\"><b>目标：</b>独立完成一次阅卷并建立可检索的目录。<b>　精读：</b><a href=\"review.html\" style=\"color:var(--gold)\">模块 05 第一、二节</a>。</div>\n<div class=\"meta\"><b>实操：</b>为虚拟案卷制作《卷宗目录表》（按模板，把 10 类证据全部编号、标页码、写证明对象）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D11】你是检察院案管中心的书记员。我（辩护律师）于 2025 年 5 月 22 日\n到检察院要求阅卷。请你设置三道障碍：① 称本案涉及商业秘密需审批；② 只允许摘抄不允许拍照复制；\n③ 称电子卷宗系统故障，一周后再来。我逐一应对并引用法律依据。\n之后请切换到考官，考我 8 个阅卷相关的细节问题（阅卷起点、范围、方式、\n能否给当事人看、能否给家属看、保密义务边界、被拒如何救济等）。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 阅卷三道障碍应对 + 8 个细节问答 + 卷宗目录表</span>\n<h4>一、阅卷三道障碍：应对</h4>\n<table><tr><th>障碍</th><th>应对</th></tr>\n<tr><td>①「涉商业秘密需审批」</td><td>「辩护律师阅卷权是法定权利，自审查起诉之日起即可；如涉密应依法提供，并可由我作出保密承诺，不能以此拒绝阅卷。」</td></tr>\n<tr><td>②「只能摘抄，不能拍照复制」</td><td>「法律明确可以查阅、摘抄、<b>复制</b>。请在案管中心依法提供复制服务，或以拍照方式复制。」</td></tr>\n<tr><td>③「系统故障，一周后再来」</td><td>「请书面说明故障与可安排的阅卷时间；我可以据此安排，也请你们尽快恢复。」（留痕）</td></tr>\n</table>\n<h4>二、8 个阅卷细节问答</h4>\n<ul>\n<li><b>开始时间</b>：审查起诉之日起（第 40 条）。</li>\n<li><b>范围</b>：本案案卷材料（指控犯罪事实的材料）。</li>\n<li><b>方式</b>：查阅、摘抄、复制；可拍照。</li>\n<li><b>能否给当事人看</b>：可以将与辩护相关的案卷内容告知当事人，但涉及其他同案人、证人信息应谨慎；不得将案卷材料提供给当事人以外的第三人。</li>\n<li><b>能否给家属看</b>：一般不得，案卷材料涉及侦查秘密与他人隐私。</li>\n<li><b>保密边界</b>：不得公开、不得用于本案辩护以外的用途。</li>\n<li><b>被拒救济</b>：向检察院控申部门、上级检察院、律协投诉，或申请监督。</li>\n<li><b>二审／补侦后</b>：补侦新增材料应再次阅卷；二审可继续查阅新增卷宗。</li>\n</ul>\n<h4>三、《卷宗目录表》（按模板填好关键项）</h4>\n<table><tr><th>编号</th><th>证据名称</th><th>卷宗页码</th><th>证明对象</th></tr>\n<tr><td>1</td><td>报案材料与甲公司说明</td><td>P1—P11</td><td>指控前提</td></tr>\n<tr><td>2</td><td>李某讯问笔录 5 份</td><td>P12—P60</td><td>供述／翻供矛盾</td></tr>\n<tr><td>3</td><td>证人证言 6 份（王某／张某／客户）</td><td>P61—P80</td><td>冲抵是否经同意</td></tr>\n<tr><td>4</td><td>银行流水与付款凭证</td><td>P81—P87</td><td>资金流向与金额</td></tr>\n<tr><td>5</td><td>司法会计鉴定意见</td><td>P88—P110</td><td>涉案金额 68 万</td></tr>\n<tr><td>6</td><td>微信聊天记录截图</td><td>P111—P118</td><td>冲抵合意（部分无原始载体）</td></tr>\n<tr><td>7</td><td>扣押清单</td><td>P119—P120</td><td>手机 1 部、电脑 1 台（无见证人签名）</td></tr>\n<tr><td>8</td><td>到案经过说明</td><td>P121—P122</td><td>是否自动投案</td></tr>\n<tr><td>9</td><td>退赔凭证</td><td>P123—P126</td><td>已退 20 万</td></tr>\n<tr><td>10</td><td>谅解意向函</td><td>P127—P128</td><td>部分谅解</td></tr>\n</table>\n</div>\n\n<div class=\"meta\"><b>当日交付物：</b>卷宗目录表（含页码索引）。</div>", "has_out": true}, {"id": "d12", "title": "Day 12　阅卷笔录：找矛盾", "html": "<div class=\"meta\"><b>目标：</b>产出一份能直接用于辩护的阅卷笔录。<b>　精读：</b><a href=\"review.html\" style=\"color:var(--gold)\">模块 05 第二节</a>。</div>\n<div class=\"meta\"><b>实操：</b>写完整的《阅卷笔录》，重点是第三部分「证据矛盾点表」——虚拟案卷至少要挖出 6 组矛盾（提示：42 万元冲抵与微信记录、26 万元借条与借款性质、鉴定意见与公司账目、5 份讯问笔录前后变化、客户证言与付款时间、扣押清单与设备同一性）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D12】我把我的《阅卷笔录》发给你（见上）。请你扮演本案的主诉检察官，\n用最严苛的方式逐条反驳我列出的每一个矛盾点，为控方辩护。\n之后请切换为资深刑辩律师，指出：① 我列出的矛盾中，哪些是「真矛盾」（有辩护价值），\n哪些是「伪矛盾」（法庭上会被轻易化解）；② 我遗漏了哪些可能的矛盾点；\n③ 请按「对定罪的影响程度」给我的矛盾点重新排序。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 阅卷笔录矛盾点表（8 组，按影响排序）</span>\n<table><tr><th>#</th><th>矛盾</th><th>卷内出处</th><th>对定罪的影响</th></tr>\n<tr><td>1</td><td><b>42 万冲抵合意</b>：李某称经副总张某口头同意；张某证言称从未同意</td><td>讯问笔录 vs 证人证言 P61—P66＋微信 P111</td><td>★★★★★ 直接影响「非法占有目的」</td></tr>\n<tr><td>2</td><td><b>26 万性质</b>：李某称是借款并已还 12 万；卷内借条还款性质与鉴定口径不一致</td><td>讯问笔录 vs 借条、还款流水</td><td>★★★★★ 决定 26 万能否计入犯罪数额</td></tr>\n<tr><td>3</td><td><b>5 份讯问笔录前后翻转</b>：前 3 次认罪、后 2 次翻供，且第一次系深夜 6 小时讯问</td><td>P12—P60</td><td>★★★★ 供述自愿性存疑，排非抓手</td></tr>\n<tr><td>4</td><td><b>鉴定意见与公司账目</b>：鉴定认定的 68 万未扣除公司应付提成、报销款</td><td>P88—P110 vs 账目</td><td>★★★★ 数额认定事实不清</td></tr>\n<tr><td>5</td><td><b>客户证言与付款时间</b>：证人称某笔款系公司间往来，与付款凭证时间不符</td><td>证人证言 vs P81—P87</td><td>★★★ 部分款项归属存疑</td></tr>\n<tr><td>6</td><td><b>微信记录无原始载体</b>：截图内容与李某手机原始记录是否一致无法验证</td><td>P111—P118</td><td>★★★ 真实性存疑</td></tr>\n<tr><td>7</td><td><b>扣押清单无见证人签名</b>：手机与电脑的同一性、来源不清</td><td>P119—P120</td><td>★★ 合法性瑕疵</td></tr>\n<tr><td>8</td><td><b>到案经过与自首认定</b>：说明称「传唤到案」，但李某称电话通知后自行前往</td><td>P121—P122 vs 会见笔录</td><td>★★★ 自首情节可能被漏</td></tr>\n</table>\n<h4>真矛盾 vs 伪矛盾（资深刑辩律师视角）</h4>\n<ul>\n<li><b>真矛盾（可打）：</b>#1 冲抵合意、#2 26 万性质、#4 鉴定未扣应付账款——直击构成要件与数额。</li>\n<li><b>伪矛盾（法庭易被化解）：</b>#6 微信截图形式瑕疵（可被补正）、#7 扣押清单形式瑕疵（可补正），单独用很难翻盘，只能作为辅助。</li>\n<li><b>排序建议：</b>先打 #1、#2、#4（定性＋数额），再用 #3（排非）动摇供述，最后用 #5—#8 补强枝节。</li>\n</ul>\n</div>\n\n<div class=\"meta\"><b>当日交付物：</b>完整阅卷笔录 + 矛盾点排序表。</div>", "has_out": true}, {"id": "d13", "title": "Day 13　证据三性与八类证据审查", "html": "<div class=\"meta\"><b>目标：</b>能对每一份证据说出「能不能用、能证明什么」。<b>　精读：</b><a href=\"review.html\" style=\"color:var(--gold)\">模块 05 第三节</a>。</div>\n<div class=\"meta\"><b>实操：</b>把虚拟案卷的 10 类证据逐份过一遍三性 + 两力，做成表格。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D13】请就虚拟案卷中的以下四份证据，分别扮演质证方与我辩论，\n每份 5 分钟：① 微信聊天记录截图（部分无原始载体）；② 司法会计鉴定意见；\n③ 证人公司副总张某的证言（称从未同意冲抵）；④ 扣押清单（手机 1 部、电脑 1 台，\n清单上无见证人签名）。你要为控方辩护，我会从合法性、真实性、关联性、证明力四个层次攻击。\n每份结束后请指出我攻击得最有力的一点和最无力的一点。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 四份证据质证要点 + 三性审查表</span>\n<h4>一、四份证据质证要点</h4>\n<h5>① 微信聊天记录截图（部分无原始载体）</h5>\n<p><b>合法性：</b>提取程序是否合法、有无提取笔录与见证。<b>真实性：</b>截图易删改，无原始载体难以验证内容完整；应要求出示原始手机或调取服务器记录。<b>关联性／证明力：</b>即便属实，也要看是否指向「冲抵合意」。</p>\n<h5>② 司法会计鉴定意见</h5>\n<p><b>合法性：</b>鉴定机构与人员资质、委托程序。<b>真实性：</b>依据的账目是否完整。<b>关联性／证明力：</b>核心缺陷是未扣除公司应付李某的提成与报销款，导致 68 万虚高；可申请鉴定人出庭或专家辅助人出庭。</p>\n<h5>③ 证人公司副总张某的证言（称从未同意冲抵）</h5>\n<p><b>关联性：</b>张某系公司管理人员，与被害单位有利害关系，证言存在归责动机。<b>证明力：</b>可与其在职期间的审批记录、微信、邮件对照；申请其出庭接受发问。</p>\n<h5>④ 扣押清单（手机 1 部、电脑 1 台，无见证人签名）</h5>\n<p><b>合法性：</b>无见证人签名违反扣押程序规定。<b>真实性：</b>被扣押设备与本案证据的同一性存疑，应要求补正或以其他证据印证。</p>\n<h4>二、《证据三性审查表》（10 类证据 × 5 维度）</h4>\n<table><tr><th>证据</th><th>合法性</th><th>真实性</th><th>关联性</th><th>证明力</th></tr>\n<tr><td>报案材料</td><td>✔</td><td>✔</td><td>✔</td><td>一般（当事人单方陈述）</td></tr>\n<tr><td>讯问笔录×5</td><td>△ 第1份存疑</td><td>△ 前后矛盾</td><td>✔</td><td>低（有排非线索）</td></tr>\n<tr><td>证人证言×6</td><td>✔</td><td>△ 利害关系</td><td>✔</td><td>中</td></tr>\n<tr><td>银行流水</td><td>✔</td><td>✔</td><td>✔</td><td>强（客观证据）</td></tr>\n<tr><td>会计鉴定</td><td>✔</td><td>△ 口径存疑</td><td>✔</td><td>中（未扣应付账款）</td></tr>\n<tr><td>微信截图</td><td>△</td><td>△ 无原始载体</td><td>△</td><td>低</td></tr>\n<tr><td>扣押清单</td><td>× 无见证人</td><td>△</td><td>✔</td><td>低</td></tr>\n<tr><td>到案经过</td><td>✔</td><td>△</td><td>✔</td><td>影响自首</td></tr>\n<tr><td>退赔凭证</td><td>✔</td><td>✔</td><td>✔</td><td>强（量刑）</td></tr>\n<tr><td>谅解意向函</td><td>✔</td><td>✔</td><td>✔</td><td>量刑情节</td></tr>\n</table>\n<p style=\"font-size:12.5px;color:var(--tx3)\">✔ 无重大问题｜△ 有瑕疵需质疑｜× 重大瑕疵建议排除</p>\n</div>\n\n<div class=\"meta\"><b>当日交付物：</b>《证据三性审查表》（10 类证据 × 5 个维度）。</div>", "has_out": true}, {"id": "d14", "title": "Day 14　审查起诉辩护意见书", "html": "<div class=\"meta\"><b>目标：</b>写出一份检察官愿意读、且会入卷的意见书。<b>　精读：</b><a href=\"review.html\" style=\"color:var(--gold)\">模块 05 第四、五节</a>。</div>\n<div class=\"meta\"><b>实操：</b>设定时间为 2025 年 9 月 10 日（二次退补重报后），写《审查起诉阶段辩护意见书》，主张<b>证据不足不起诉</b>（备选：改变定性为挪用资金或民事纠纷）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D14】你是本案的主诉检察官，正在撰写审查报告。\n我提交了主张「证据不足不起诉」的辩护意见书。请你：\n① 列出你会如何逐条回应我的意见；② 指出我的意见书里哪些是「正确的废话」（说了等于没说）；\n③ 指出哪些论点真正触动了你；④ 模拟你撰写的《退回补充侦查提纲》和最终的《起诉决定书》\n（说明为何仍决定起诉，或为何决定不起诉）。最后请给我一份\n「能让检察官真正改变心证的意见书写作要点清单」。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 审查起诉辩护意见书（主张证据不足不起诉）</span>\n<div class=\"doc\">【审查起诉阶段辩护意见书】\n致：××市人民检察院\n辩护人：×××，××律师事务所律师\n案由：李某涉嫌职务侵占罪\n\n辩护意见：\n一、涉案数额认定事实不清、证据不足。\n指控的 68 万元中，42 万元系公司长期拖欠李某提成、报销款并经分管副总口头同意由其代收货款冲抵；鉴定意见未扣除公司对李某的应付账款，直接以 68 万元认定，缺乏依据。另有 26 万元系李某向公司借款并已归还 12 万元，属民事借贷关系。据此，真正可能构成刑事问题的数额远低于指控数额，且存在重大争议（卷 P88—P110；账目见卷 P××）。\n\n二、非法占有目的的证据不充分。\n李某与公司之间就提成、报销款存在真实的债权债务关系，其收款系「债权实现」之争，而非「将单位财物占为己有」。其在案发前按月归还借款，无逃避返还的行为，难以认定具有非法占有目的。（卷 P12—P60，会见笔录）\n\n三、据以定案的供述存在非法取证线索。\n第一次讯问系自 2025-03-06 22:00 至次日 04:00 连续 6 小时进行，未保障必要休息、未告知诉讼权利，其后的供述亦受污染。依法不应作为定案依据。\n\n四、本案实质系公司与员工之间的劳动争议与借贷纠纷，宜通过民事诉讼、劳动仲裁解决，不宜以刑事手段介入。\n\n综上，本案事实不清、证据不足，不符合起诉条件。请求依据《刑事诉讼法》第 175 条第 4 款（存疑不起诉）对李某作出不起诉决定；退一步，亦请改变定性为挪用资金罪或建议按民事纠纷处理。\n\n辩护人：×××　2025 年 9 月 10 日</div>\n<div class=\"box tip\"><span class=\"lb\">写意见书的三条铁律</span>① 每一个论点都标<b>卷宗页码</b>；② 有<b>具体请求</b>（不起诉／改变定性）；③ 附<b>类案</b>支持。缺一条，检察官就当「正确的废话」处理。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的意见书里有没有具体请求？有没有标卷宗页码？有没有附类案？　<b>当日交付物：</b>审查起诉阶段辩护意见书。</div>", "has_out": true}, {"id": "d15", "title": "Day 15　认罪认罚：战略选择", "html": "<div class=\"meta\"><b>目标：</b>能就认罪认罚与当事人做一次完整的利弊沟通并留痕。<b>　精读：</b><a href=\"review.html\" style=\"color:var(--gold)\">模块 05 第四节第 3 点</a>。</div>\n<div class=\"meta\"><b>实操：</b>写一份《认罪认罚利弊告知与选择确认书》+ 对应的会见笔录段落（阅卷后会见）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D15】请扮演被告人李某（已被羁押 6 个月，身心疲惫，只想尽快出去）。\n我会就「是否认罪认罚」与你沟通。你要表现出真实的纠结：一方面想出去，\n一方面坚持自己没有侵占故意、担心认了就再也说不清。\n我会向你说明：认罪认罚的含义、从宽幅度、对无罪辩护的排斥效应、\n量刑建议的谈判空间（是否缓刑、确定刑还是幅度刑）、反悔的后果。\n对话结束后请切换到考官：① 我的告知是否完整；② 我有没有代替当事人做决定；\n③ 我有没有把「律师的独立辩护立场」与「当事人的选择」区分清楚；\n④ 请给我一份《认罪认罚告知必备事项清单》。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 认罪认罚利弊告知清单 + 会见笔录段落</span>\n<h4>一、《认罪认罚告知必备事项清单》</h4>\n<ul>\n<li><b>含义</b>：承认指控的犯罪事实、同意量刑建议、同意程序适用（速裁／简易／普通）。</li>\n<li><b>法律后果</b>：可以从宽（量刑从宽、程序从简）；但一旦认罪，无罪辩护空间基本关闭。</li>\n<li><b>从宽幅度</b>：一般为基准刑的 10%—30%，具体视罪名、阶段、退赔而定（以本省实施细则为准）。</li>\n<li><b>排斥效应</b>：认罪后翻供，可能丧失从宽并影响可信度，甚至被认定认罪态度差。</li>\n<li><b>量刑建议谈判空间</b>：争取确定刑优于幅度刑；争取适用缓刑；争取明确「如按期退赔则不再追究」与谅解挂钩。</li>\n<li><b>反悔后果</b>：庭审中推翻认罪认罚，检察机关可能撤回从宽建议、调整量刑建议。</li>\n<li><b>律师立场</b>：律师可作独立辩护，但必须尊重当事人选择；不得代替当事人做认罪决定。</li>\n<li><b>留痕</b>：必须形成书面《认罪认罚利弊告知与选择确认书》，由当事人签字。</li>\n</ul>\n<h4>二、阅卷后会见笔录段落（含当事人签字确认）</h4>\n<div class=\"doc\">【会见笔录 · 认罪认罚沟通段落】\n问：今天我向你说明「认罪认罚从宽制度」，你要听清楚，最后由你自己决定，不能由我替你做决定。\n答：好。\n问：认罪认罚的意思是，你承认指控的犯罪事实、同意检察院的量刑建议、同意用较简的程序审。好处是可以从宽，可能少判；坏处是一旦认了，再主张无罪就很难了。\n答：我明白。\n问：本案你一直说自己有 42 万是提成冲抵、26 万是借的。如果你认罪认罚，就等于承认了职务侵占，包括那 42 万，这一点你要想清楚。\n答：我不想认那 42 万，那不是侵占。\n问：那你的选择是什么？是继续主张「数额有争议、部分不构成犯罪」，还是全部认罪换从宽？\n答：先不认，让律师继续争。\n问：好。如果你之后改变主意，随时告诉我。我会把今天的沟通写进笔录，你看后签字确认。\n答：可以。\n\n当事人签字：__________（捺印）　律师：__________　日期：____</div>\n<div class=\"box warn\"><span class=\"lb\">最容易踩的线</span>不要替当事人做决定，也不要在笔录里留下「律师劝其认罪」的表述。你的角色是把利弊讲全，把选择权交回去，并且<b>把这次沟通写实、让当事人签字</b>——这既是保护当事人，也是保护你自己。</div>\n</div>\n\n<div class=\"meta\"><b>当日交付物：</b>利弊告知确认书 + 会见笔录段落（含当事人签字确认）。</div>", "has_out": true}, {"id": "d16", "title": "Day 16　此罪与彼罪：定性之辩", "html": "<div class=\"meta\"><b>目标：</b>掌握改变定性这条最容易被忽略的辩护路径。<b>　精读：</b><a href=\"index.html\" style=\"color:var(--gold)\">总纲 第三部分</a>。</div>\n<div class=\"meta\"><b>实操：</b>就虚拟案卷论证：职务侵占罪 vs 挪用资金罪 vs 民事纠纷（不构成犯罪）的界限，写一份 1500 字的定性分析。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D16】请分别扮演三个角色，就李某案的定性与我辩论：\n① 主诉检察官（坚持职务侵占罪）；② 民法教授（主张这是劳动争议与民间借贷，不涉刑）；\n③ 资深刑辩律师（主张即便入罪也应认定为挪用资金罪）。三方各 10 分钟。\n你要抓住「非法占有目的」这一核心争点穷追不舍。结束后请给出\n《本案定性之争的攻防要点对照表》，并指出我论证中最薄弱的环节。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 定性之争攻防要点对照表 + 我的薄弱环节</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<p>三方法官/学者围绕同一事实各执一词，争点的枢纽只有一个：<b>李某是否具有「非法占有目的」</b>。把三方立场压到同一张表里对撞，才能看清哪些论点真正致命。</p>\n<h4>一、定性之争攻防要点对照表</h4>\n<table>\n<thead><tr><th>争点</th><th>主诉检察官（职务侵占罪）</th><th>民法教授（劳动争议＋民间借贷）</th><th>资深刑辩（挪用资金罪）</th></tr></thead>\n<tbody>\n<tr><td>42 万元提成冲抵</td><td>口头同意无书面授权，不能对抗公司账务；仍属单位应收货款被转移占有</td><td>有提成核算表＋微信记录印证，是真实债权债务，冲抵合法</td><td>即便成立，也只是「应收款」争议，不构成对单位财物的非法占有</td></tr>\n<tr><td>26 万元借款</td><td>已签借条≠民事，仍进入单位账户前被截留，客观上是侵占</td><td>签借条、按月归还 12 万，是典型民间借贷，有还款行为</td><td>有归还行为即难证「非法占有」，更像临时占用</td></tr>\n<tr><td>非法占有目的</td><td>截留货款归个人消费，推定具有非法占有目的</td><td>是为实现自身合法债权/借用，无非法占有之故意</td><td>无证据显示不打算归还，应定性为挪用而非侵占</td></tr>\n<tr><td>客观行为</td><td>利用回款管理职务便利，将单位应收转入个人账户</td><td>系客户按李某指示付款，属于履行职务中的结算混乱</td><td>资金进入个人账户但未挥霍，有归还轨迹</td></tr>\n<tr><td>数额认定</td><td>68 万全额计入</td><td>真正涉刑部分应扣除 42 万＋（26 万−12 万已还）= 仅 12 万存疑</td><td>即便定罪，也只应就无争议部分评判</td></tr>\n<tr><td>罪名与刑档</td><td>职务侵占，数额较大（6 万≤×＜100 万），3 年以下或拘役</td><td>不构成犯罪，驳回刑事追诉</td><td>挪用资金，若归个人使用/营利/超 3 月未还，刑档更低且可退赔了结</td></tr>\n<tr><td>程序走向</td><td>坚持起诉，建议实刑</td><td>建议撤案或转劳动仲裁/民事诉讼</td><td>若必须追诉，争取改变定性、降低刑档</td></tr>\n</tbody>\n</table>\n<h4>二、我的论证中最薄弱的环节</h4>\n<ol>\n<li><b>举证责任分配说反了。</b>我口头主张「42 万是提成」，但对「公司拖欠提成」的举证责任落在己方，我没有把提成核算表、历年发放记录、微信记录形成闭环，检察官一句「无书面授权」就能打回。</li>\n<li><b>挪用与侵占的界分只在嘴上。</b>我用「有归还行为」论证无非法占有目的，但没有用<b>客观时间线</b>（借款按月还、案发前已还 12 万）去支撑主观意图，界分软弱。</li>\n<li><b>「民事纠纷」抗辩没有落到具体证据。</b>民教授的立场最有利，但我没把它转化为卷宗里的证据组合，只是观点对抗。</li>\n</ol>\n<div class=\"box tip\"><span class=\"lb\">定性之辩三条铁律</span>① 先锁定「非法占有目的」这一总开关；② 把「民事纠纷」抗辩落到具体证据（提成核算表、微信记录、借条、还款流水），而非口头主张；③ 挪用资金与职务侵占的界分，用「是否打算归还」的主观意图去切割，并用客观行为（按月还款）佐证。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你能否用一句话说清「为什么 68 万里至少有 42 万不具备非法占有目的」？　<b>当日交付物：</b>定性之争攻防要点对照表。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>定性分析备忘录（含三个罪名构成要件对比表）。</div>", "has_out": true}, {"id": "d17", "title": "Day 17　量刑三步法实操", "html": "<div class=\"meta\"><b>目标：</b>能把量刑算成一道算术题。<b>　精读：</b><a href=\"trial.html\" style=\"color:var(--gold)\">模块 06 第六节</a> + <a href=\"tools.html\" style=\"color:var(--gold)\">量刑试算器</a>。</div>\n<div class=\"meta\"><b>实操：</b>为虚拟案卷做一份完整的《量刑计算表》：确定量刑起点（职务侵占罪数额较大的档次）、基准刑（按 68 万元或争议后的 26 万元计算）、情节调节（自首/坦白、退赔 20 万、部分谅解、认罪认罚），得出建议宣告刑，并论证缓刑适用。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D17】你是本案的承办法官，正在撰写量刑评议。\n我把我的《量刑计算表》提交给你。请你：\n① 逐项质疑我的量刑起点与基准刑（尤其是数额认定——是 68 万还是 26 万还是 46 万）；\n② 质疑我主张的每一个从宽情节是否有证据支撑；\n③ 就缓刑适用提出你的疑虑（如：退赔未清、未取得完全谅解、公司强烈要求严惩）；\n④ 最后给出你认为恰当的宣告刑区间。请务必说明你的推理过程。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 李某案量刑计算表 + 对法官质疑的回应</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、量刑三步法（起点 → 基准刑 → 宣告刑）</h4>\n<table>\n<thead><tr><th>步骤</th><th>项目</th><th>依据/计算</th><th>结果</th></tr></thead>\n<tbody>\n<tr><td>① 量刑起点</td><td>职务侵占 68 万（辩护人主张以无争议部分计）</td><td>依 2016 贪贿解释，6 万≤×＜100 万为「数额较大」，法定刑 3 年以下或拘役；在幅度内按数额取点</td><td>起点 18 个月</td></tr>\n<tr><td>② 基准刑</td><td>在起点上叠加/扣减情节</td><td>自首 −20%～−40%；退赔 20 万 −10%～−20%；部分谅解 −5%～−10%；初犯、认罪各 −5%</td><td>基准刑约 12 个月</td></tr>\n<tr><td>③ 宣告刑</td><td>综合全案裁量</td><td>结合退赔进度、谅解程度、社会危险性</td><td>建议 10–14 个月，争取缓刑</td></tr>\n</tbody>\n</table>\n<h4>二、对法官四点质疑的回应</h4>\n<ol>\n<li><b>数额认定（68 万 / 26 万 / 46 万？）。</b>辩护人主张：42 万提成冲抵部分应有证据优先剔除；26 万借款已还 12 万，仅 14 万存疑；真正应以充分证据支撑的部分为量刑基准，而非一概按 68 万顶格。</li>\n<li><b>从宽情节的举证。</b>自首：电话通知后主动到案＋首次如实供述（卷 P12—P60），虽后翻供但一审前若再如实供述仍可认定；退赔 20 万有凭证；部分谅解有意向函——均附卷，非空口。</li>\n<li><b>缓刑疑虑。</b>障碍：退赔未清、未取得完全谅解、公司要求严惩。破解：制定分期退赔方案并当庭承诺；继续推动谅解书（见 Day 20）；公司「严惩」诉求不能替代法定从轻情节。</li>\n<li><b>宣告刑区间。</b>即便全额认定 68 万，因数额刚过「较大」线、有自首＋退赔＋初犯，亦应在低档量刑；若采纳部分剔除，更宜缓刑。</li>\n</ol>\n<div class=\"box warn\"><span class=\"lb\">法官最在意的不是你多惨</span>缓刑审查看的是「再犯危险＋对社区影响＋退赔诚意」。家庭困难是背景，<b>可量化、可执行的退赔与谅解方案</b>才是硬通货。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的计算表每个调节比例是否都标了依据？法官的每条质疑你都有卷宗页码回应吗？　<b>当日交付物：</b>李某案量刑计算表。</div>\n\n<div class=\"meta\"><b>自检：</b>你的情节清单里有没有「被害人过错」「初犯偶犯」「家庭特殊情况」？每个情节有没有证据出处？　<b>当日交付物：</b>量刑计算表 + 量刑情节清单。</div>", "has_out": true}, {"id": "d18", "title": "Day 18　类案检索报告", "html": "<div class=\"meta\"><b>目标：</b>会用类案给法官递台阶。<b>　精读：</b><a href=\"trial.html\" style=\"color:var(--gold)\">模块 06 第六节</a>。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D18】请为李某案生成一份《类案检索报告》的<b>结构与检索式</b>（你不需要编造具体判例，\n请给出可执行的检索路径）：① 应检索哪些数据库（中国裁判文书网、人民法院案例库、\n威科先行、北大法宝等）；② 检索关键词与法条组合（职务侵占罪 + 数额 + 提成冲抵 +\n自首 + 退赔 + 缓刑）；③ 筛选标准（地域、审级、年份、数额区间）；\n④ 报告格式模板（含类案对比表：案号隐去后四位、数额、情节、宣告刑、是否缓刑）；\n⑤ 如何在辩护词和庭审中引用类案（含话术）。最后请提醒我类案检索的五个常见错误。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 类案检索方案 + 报告模板 + 五误区</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、应检索的数据库</h4>\n<table>\n<thead><tr><th>数据库</th><th>覆盖特点</th><th>用法</th></tr></thead>\n<tbody>\n<tr><td>中国裁判文书网</td><td>海量生效裁判，但近年新案上网少</td><td>主搜「职务侵占＋提成冲抵/民间借贷抗辩」</td></tr>\n<tr><td>人民法院案例库</td><td>经最高法审核，权威性强、宜引用</td><td>优先用于庭审引用，增强说服力</td></tr>\n<tr><td>威科先行 / 北大法宝</td><td>检索式强、可跨库、有类案推送</td><td>做系统化检索与对比表</td></tr>\n</tbody>\n</table>\n<h4>二、检索关键词与法条组合</h4>\n<table>\n<thead><tr><th>维度</th><th>关键词</th><th>组合逻辑</th></tr></thead>\n<tbody>\n<tr><td>罪名</td><td>职务侵占罪 / 挪用资金罪</td><td>主词</td></tr>\n<tr><td>抗辩事理</td><td>提成冲抵 / 劳动报酬 / 民间借贷 / 非法占有目的</td><td>AND 主词</td></tr>\n<tr><td>从宽情节</td><td>自首 / 退赔 / 谅解 / 缓刑</td><td>AND 主词</td></tr>\n<tr><td>数额</td><td>「60 万–100 万」区间</td><td>限定刑档</td></tr>\n</tbody>\n</table>\n<h4>三、筛选标准</h4>\n<table>\n<thead><tr><th>维度</th><th>标准</th></tr></thead>\n<tbody>\n<tr><td>地域</td><td>优先本省/邻省，次及长三角、珠三角同经济水平地区</td></tr>\n<tr><td>审级</td><td>中院以上、案例库入选优先</td></tr>\n<tr><td>年份</td><td>2016 贪贿解释之后（数额标准一致）</td></tr>\n<tr><td>数额区间</td><td>与本案 68 万同档（6 万–100 万）</td></tr>\n</tbody>\n</table>\n<h4>四、报告格式模板（类案对比表）</h4>\n<table>\n<thead><tr><th>案号（隐后四位）</th><th>涉案数额</th><th>关键情节</th><th>宣告刑</th><th>是否缓刑</th></tr></thead>\n<tbody>\n<tr><td>（2024）粤××刑初□□□□</td><td>72 万</td><td>提成争议＋自首＋退赔</td><td>1 年 2 月</td><td>是</td></tr>\n<tr><td>（2023）苏××刑初□□□□</td><td>65 万</td><td>民间借贷抗辩＋谅解</td><td>11 月</td><td>是</td></tr>\n<tr><td>（2024）浙××刑初□□□□</td><td>80 万</td><td>无退赔、拒不认罪</td><td>2 年 6 月</td><td>否</td></tr>\n</tbody>\n</table>\n<h4>五、辩护词/庭审中引用类案话术</h4>\n<p>「审判员，同级法院（2024）粤××刑初□□□□案，事实与本案高度相似——同样存在提成冲抵争议、同样数额在 70 万左右、同样具备自首与退赔情节，该院对被告人宣告缓刑。恳请合议庭在类案同判原则下，对李某从宽并考虑缓刑。」</p>\n<h4>六、类案检索五个常见错误</h4>\n<ol>\n<li>只搜「职务侵占」不看数额档，拿来重罪的案子反而帮倒忙；</li>\n<li>用已失效的 1997 旧数额标准；</li>\n<li>只引用未入库的网文裁判，法庭不认；</li>\n<li>隐瞒对己方不利的类似案例（对方律师一查就穿）；</li>\n<li>把「相似」说成「相同」，被法官当庭纠正后信用破产。</li>\n</ol>\n<div class=\"box tip\"><span class=\"lb\">类案检索本质</span>不是找「一样的案子」，而是找<b>可类比的裁量逻辑</b>——把法官的酌情空间，用同行判决「锚定」下来。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的检索式能否复现？对比表是否隐去了案号后四位？是否同时备好了有利与不利案例？　<b>当日交付物：</b>类案检索报告（结构＋检索式＋模板）。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>类案检索报告模板 + 检索式清单 + 庭审引用话术。</div>", "has_out": true}, {"id": "d19", "title": "Day 19　调查取证与专家辅助人", "html": "<div class=\"meta\"><b>目标：</b>知道哪些证据要自己去取、哪些必须申请调取。<b>　精读：</b><a href=\"investigation.html\" style=\"color:var(--gold)\">模块 04 第七节</a>。</div>\n<div class=\"meta\"><b>实操：</b>为虚拟案卷写《律师调查笔录》（调查对象：原公司财务王某，证明历年提成核算与冲抵惯例）+《专家辅助人出庭申请书》（针对司法会计鉴定意见）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D19】请扮演原公司财务王某（已离职，与甲公司有劳动争议，对李某既有同情也有顾虑）。\n我要就「历年提成核算方式与冲抵惯例」对你做调查取证。\n你要真实地犹豫：担心得罪老东家、担心被追究、说不清细节。\n调查结束后请切换到考官：① 我的提问有没有诱导；② 笔录格式是否合规；\n③ 我有没有告知你的权利义务；④ 在「自己取证」与「申请检法调取」之间，本案应当如何选择，为什么。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 对王某调查笔录 + 取证决策</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、对证人王某（原公司财务）调查笔录（节选）</h4>\n<div class=\"doc\">调查笔录\n\n时间：2025 年 9 月 12 日 10:00–11:30\n地点：王某住所（本市××区××路××号）\n调查人：×××律师　记录人：×××律师助理\n被调查人：王某，原甲公司财务，2025 年 6 月离职\n\n【告知】调查人：王姐，今天只是了解情况，你有权拒绝回答与本案无关的问题，所说内容可能作为证据提交，请如实陈述，否则要承担法律责任。你愿意继续吗？\n王某：愿意。\n\n问：李某在职时，销售提成是怎么核算、怎么发的？\n王某：提成是按季度算的，公式在财务群里发过。但公司经常拖，有时候拖大半年才发，中间就用客户回款先「顶」一下，这是张总（副总张某）口头同意的老规矩。\n\n问：所谓「顶一下」，具体怎么操作？\n王某：客户把钱打给李某私人账户，算他先拿走了自己该得的提成，等公司账上宽裕了再补手续。不止李某一个销售这么干。\n\n问：42 万那笔，你能确认是提成吗？\n王某：数字我不敢打包票，但流程上确实是按提成口子走的。微信记录里张总说过「先顶着」。\n\n问：你怕不怕得罪老东家？\n王某：有点怕……所以我今天说的，你们别写我同意公开啊。\n\n【记录人注明】王某情绪犹豫，关键事实（提成冲抵惯例、张某口头同意）与其此前证言部分一致，建议申请法院调取财务群聊天记录及提成核算底稿印证。</div>\n<h4>二、考官四问点评</h4>\n<ol>\n<li><b>我有没有诱导？</b>「所谓顶一下具体怎么操作」暗含了引导，应改为开放式：「客户回款和李某个人卡之间，当时是怎么处理的？」</li>\n<li><b>笔录格式合规吗？</b>缺「被调查人核对无误后签名」收尾语与逐页签字栏，需补。</li>\n<li><b>权利义务告知了吗？</b>告知了，但应明确「有权拒绝回答」「陈述不实的法律后果」并记入。</li>\n<li><b>自己取证 vs 申请检法调取？</b>王某顾虑大、易翻证，<b>本案应优先申请检察院/法院调取</b>财务群记录与提成底稿；律师自行取证仅作留痕补充，避免取证合法性被质疑。</li>\n</ol>\n<div class=\"box warn\"><span class=\"lb\">证人取证的红线</span>证人有顾虑时，自行制作的笔录证明力弱且易被质疑诱导；把「申请调取」作为主路径，既合法又稳。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>笔录有无权利义务告知与签名栏？你的问题是否开放而非诱导？本案取证主路径选对了吗？　<b>当日交付物：</b>调查笔录＋取证决策说明。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>调查笔录 + 专家辅助人出庭申请书。</div>", "has_out": true}, {"id": "d20", "title": "Day 20　附民、和解与退赔谈判", "html": "<div class=\"meta\"><b>目标：</b>把谅解书变成量刑杠杆。<b>　精读：</b><a href=\"special.html\" style=\"color:var(--gold)\">模块 08 第二、三节</a>。</div>\n<div class=\"meta\"><b>实操：</b>设计一套退赔方案（68 万元中争议部分如何安排、分期还是一次性、能否以取保候审保证金/房产抵押作担保），并起草《赔偿协议》与《谅解书》。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D20】请扮演甲公司的法务总监（你的立场：公司要追回全部损失、\n要杀一儆百、但也不想官司打三年）。我就退赔与谅解与你谈判。\n你的初始立场是「68 万一分不少、不写谅解书」。我要争取：分期方案、\n部分谅解（写明「若按约履行则不再追究并请求从宽」）、以及对 42 万元提成冲抵部分的书面确认。\n谈判结束后请点评：① 我有没有过早让步；② 我有没有为公司提供「体面下台阶」的方案；\n③ 请给出一份最优的《谅解书》条款建议（注意避免「以钱买刑」的表述）。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 谅解书条款建议 + 谈判复盘</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、谈判策略要点</h4>\n<ol>\n<li><b>先给台阶：</b>承认公司损失、表达歉意，让法务总监「立场可守」；</li>\n<li><b>分期退赔：</b>提出「已退 20 万＋6 个月内分期补足余款」的可执行方案，比一次性掏不出更有诚意；</li>\n<li><b>部分确认：</b>要求公司在谅解书中书面确认「42 万提成冲抵部分双方存在争议」，为定性之辩留口子；</li>\n<li><b>换谅解：</b>以「分期履行＋书面确认争议」换取「若按约履行则不再追究并请求从宽」的部分谅解。</li>\n</ol>\n<h4>二、《谅解书》最优条款建议（草稿）</h4>\n<div class=\"doc\">谅解书（建议条款）\n\n1. 受害人甲公司确认：李某及家属已退赔人民币 20 万元，并就剩余款项达成分期偿付方案（附还款计划）。\n2. 甲公司确认：对其中 42 万元款项是否属销售提成冲抵，双方仍存在民事争议，本谅解书不对该等争议事实作最终认定。\n3. 鉴于李某已积极退赔并制定履行计划，甲公司对李某的涉案行为表示谅解，并请求办案机关在法定幅度内对其从宽处理。\n4. 本谅解以李某按约履行为前提；若按期履行，甲公司不再就本案提起附带民事诉讼或另行索赔。\n\n（注意：避免使用「只要赔钱就不追究」「以赔偿换轻判」等可能被解读为「以钱买刑」的表述，统一用「积极退赔＋请求从宽」中性措辞。）</div>\n<h4>三、谈判复盘点评</h4>\n<ol>\n<li><b>我有没有过早让步？</b>若开局就承诺「68 万全赔」，等于放弃提成争议抗辩。正确做法是「先确认争议部分、再谈可赔部分」。</li>\n<li><b>有没有给公司下台阶？</b>「分期＋书面确认争议」既保住公司面子，又锁定我方有利事实，是体面方案。</li>\n<li><b>关键提醒：</b>谅解书是「从宽」筹码而非「免罪」保证；措辞必须中性，防止被认定为交易司法。</li>\n</ol>\n<div class=\"box tip\"><span class=\"lb\">谈判的终局</span>不是让对方「认错」，而是让对方在<b>不丢面子</b>的前提下，签下对你最有利的那张纸。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>谅解书是否回避了「以钱买刑」表述？是否保留了提成争议的书面确认？分期方案是否可执行？　<b>当日交付物：</b>谅解书条款建议＋谈判复盘。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>退赔方案 + 赔偿协议 + 谅解书。</div>", "has_out": true}, {"id": "d21", "title": "Day 21　庭前会议与庭前辩护意见", "html": "<div class=\"meta\"><b>目标：</b>用庭前会议把庭审压缩到真正的争点上。<b>　精读：</b><a href=\"trial.html\" style=\"color:var(--gold)\">模块 06 第一、二节</a>。</div>\n<div class=\"meta\"><b>实操：</b>写《庭前辩护意见》+《庭前会议提纲》（列明要提出的 5 项程序性申请）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D21】请扮演本案的审判长，主持庭前会议。我会提出：管辖异议（可选）、\n排非申请、证人（公司副总张某、财务王某）出庭申请、鉴定人出庭申请、\n专家辅助人出庭申请、调取同步录音录像申请。请你对每一项作出裁定（准许或驳回），\n并说明理由；我被驳回时要当庭提出异议并要求记入笔录。\n会议结束后请点评：① 哪些申请我提得对；② 哪些申请注定被驳回、\n我是否应该换一种方式（比如改为「留痕为二审做准备」）；\n③ 请给我一份《庭前会议发言顺序与措辞清单》。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 庭前会议申请清单 + 发言措辞清单</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、六项申请及预期处理</h4>\n<table>\n<thead><tr><th>申请事项</th><th>依据</th><th>预期裁定</th><th>被驳回时的异议/留痕</th></tr></thead>\n<tbody>\n<tr><td>管辖异议（可选）</td><td>认为本院不便管辖</td><td>多驳回</td><td>当庭提出、记入笔录，留二审</td></tr>\n<tr><td>非法证据排除</td><td>夜间连续讯问 6 小时、未告知权利（卷 P12—P60）</td><td>可能召开排非庭/部分采信</td><td>坚持，要求当庭播放同步录像</td></tr>\n<tr><td>证人张某、王某出庭</td><td>对定性有关键影响</td><td>王某准、张某视情况</td><td>申请复议，留二审</td></tr>\n<tr><td>鉴定人出庭</td><td>司法会计鉴定方法存疑（卷 P88—P110）</td><td>多准许</td><td>—</td></tr>\n<tr><td>专家辅助人出庭</td><td>辅助质疑鉴定方法</td><td>视必要性</td><td>留二审</td></tr>\n<tr><td>调取同步录音录像</td><td>排非调查必需</td><td>多准许</td><td>申请复议</td></tr>\n</tbody>\n</table>\n<h4>二、庭前会议发言顺序与措辞清单</h4>\n<ol>\n<li><b>开场：</b>「审判长，辩护人就本案程序事项依次说明，先谈排非，再谈证人、鉴定人出庭与调取申请。」</li>\n<li><b>排非：</b>「2025-03-06 22:00 至次日 04:00 连续讯问 6 小时，未保障必要休息、未告知诉讼权利，依据第 52 条、第 56 条及相关排非规定，申请排除该次及受污染后续供述。」</li>\n<li><b>证人：</b>「张某、王某的证言直接关系 42 万提成冲抵事实，申请二人出庭；王某庭前笔录显示其顾虑明显，出庭更利查明。」</li>\n<li><b>鉴定：</b>「鉴定意见未扣除公司对李某应付账款，方法存疑，申请鉴定人出庭，并请专家辅助人协助质询。」</li>\n<li><b>调取：</b>「排非与证人核实均需同步录像及财务群记录，申请法院调取。」</li>\n</ol>\n<h4>三、哪些申请注定被驳回、如何应对</h4>\n<p>管辖异议、部分证人出庭大概率被驳回。应对策略<b>不是硬争</b>，而是「提出—被驳—要求记入笔录—为二审留痕」三步法，把程序异议做成可上诉的钉。</p>\n<div class=\"box tip\"><span class=\"lb\">庭前会议的本质</span>不是「一次赢」，而是<b>把争点固定、把程序异议留痕</b>。能当场准许的赚到，驳回的变成二审弹药。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的每项申请都标了法条依据吗？被驳回的事项是否都要求记入笔录？　<b>当日交付物：</b>庭前会议申请清单＋发言措辞清单。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>庭前辩护意见 + 庭前会议提纲。</div>", "has_out": true}, {"id": "d22", "title": "Day 22　发问：把有利事实问出来", "html": "<div class=\"meta\"><b>目标：</b>写出一份每个问题都预知答案的发问提纲。<b>　精读：</b><a href=\"trial.html\" style=\"color:var(--gold)\">模块 06 第三节</a>。</div>\n<div class=\"meta\"><b>实操：</b>写三份发问提纲：① 对自己的当事人李某（20 问）；② 对公司副总张某（12 问）；③ 对鉴定人（10 问）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D22】请依次扮演三个角色接受我的法庭发问，每个角色 10 分钟：\n① 被告人李某（配合但有紧张）；② 证人公司副总张某（敌意、回避关键问题、\n会说「记不清了」）；③ 司法会计鉴定人（专业但会回避方法缺陷）。\n你要真实地「不好对付」。每轮结束后请点评：① 我的问题是不是太开放/太诱导；\n② 有没有哪个问题我其实不知道答案就问了（这是大忌）；\n③ 当对方说「记不清」时，我有没有备用打法（用先前的书面证言进行弹劾）。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 三套法庭发问提纲 + 「记不清」弹劾预案</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<div class=\"box law\"><span class=\"lb\">发问总原则</span>只问<b>你知道答案</b>的问题；用封闭/半封闭问题把有利事实「钉死」；开放问题只用于让对方自己说出对你有利的话，绝不问自己不知结果的问题。</div>\n<h4>一、对被告人李某发问（配合但紧张）</h4>\n<ol>\n<li>「2025 年 3 月 5 日，是公司电话通知你，你主动去的派出所，对吗？」→ 锁定自首中「自动投案」。</li>\n<li>「那 42 万，是不是你一直找公司要、公司拖着没发的提成？」→ 引出债权背景。</li>\n<li>「26 万那笔，你签了借条、每个月都在还，案发前已经还了 12 万，对吗？」→ 否定非法占有目的。</li>\n<li>「第一次做笔录那天，是不是从晚上 10 点一直问到第二天早上 4 点，中间没让你休息？」→ 为排非铺垫，且用被告人自己口述固定。</li>\n</ol>\n<h4>二、对副总张某发问（敌意、爱说「记不清」）</h4>\n<ol>\n<li>「张总，李某的提成是不是你分管的？」</li>\n<li>「公司资金紧张时，有没有让销售先用客户回款顶提成？」→ 若答「记不清」，转入弹劾（见下）。</li>\n<li>「微信里你说『先顶着』，是指先用回款抵提成吗？」→ 用书面证言弹劾其当庭模糊。</li>\n</ol>\n<h4>三、对鉴定人发问（专业、回避方法缺陷）</h4>\n<ol>\n<li>「鉴定意见的 68 万，是否扣除了公司对李某的应付账款？」</li>\n<li>「提成核算表、微信记录你方是否作为检材纳入？」→ 暴露检材不完整。</li>\n<li>「若未扣除，68 万数额是否据此存疑？」→ 逼其承认方法局限。</li>\n</ol>\n<h4>四、当对方说「记不清」的弹劾预案</h4>\n<ol>\n<li>不纠缠，立即说：「请法庭注意，证人庭前 2025-×-× 笔录第×页明确写明……」；</li>\n<li>当庭宣读其书面证言原文，问：「这份笔录是你签认的，对吗？」；</li>\n<li>若仍称记不清，申请法庭将该矛盾记入笔录，作为证言可信度瑕疵固定。</li>\n</ol>\n<h4>五、点评：我容易犯的两个错</h4>\n<ol>\n<li><b>太开放：</b>「你和李某之间到底怎么回事？」——把舞台让给对方，禁问。</li>\n<li><b>问不知答案的问题：</b>未核卷就问「你是不是收了回扣？」，对方一否认，反而坐实敌意、自损。</li>\n</ol>\n<div class=\"box tip\"><span class=\"lb\">发问的胜负手</span>法庭发问不是「审人」，是<b>借对方的嘴，把卷里有利的事实念给合议庭听</b>。问题越短、越封闭，越稳。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的每个问题是否都预知答案？遇到「记不清」有没有备用弹劾？有没有问过自己不知结果的问题？　<b>当日交付物：</b>三套发问提纲＋弹劾预案。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>三份发问提纲（含预期答案与备用弹劾问题）。</div>", "has_out": true}, {"id": "d23", "title": "Day 23　质证四步法", "html": "<div class=\"meta\"><b>目标：</b>质证意见表能拿起来就念。<b>　精读：</b><a href=\"trial.html\" style=\"color:var(--gold)\">模块 06 第四节</a>。</div>\n<div class=\"meta\"><b>实操：</b>把虚拟案卷的 10 类证据做成完整《质证意见表》，每份证据写满四步（合法性—真实性—关联性—证明力）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D23】你是本案的公诉人，正在逐份出示证据。我对每一份证据发表质证意见。\n请你扮演两个身份：① 出证时的公诉人（会强调证据的合法性与证明力，反驳我的质证）；\n② 之后的点评考官（指出哪些质证是有效的、哪些是「无效抗议」）。\n特别要求：当我只说「不认可」而不说理由时，请立刻打断我并要求我说明理由。\n结束后请给我一份《十类证据的高效质证话术库》（每类 3 句可直接照念的话）。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 质证四步法 + 十类证据高效质证话术库</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<p>质证不是喊「不认可」三个字，而是<b>四步走</b>：① 打三性（真实性、合法性、关联性）；② 打证明目的；③ 打排非线索；④ 立替代事实（同一待证事实的另一种解释）。只会说「不认可」的质证，等于把战场让给公诉人。</p>\n<h4>一、本案关键证据的质证演示</h4>\n<table>\n<thead><tr><th>证据</th><th>公诉人主张</th><th>我的质证意见</th></tr></thead>\n<tbody>\n<tr><td>讯问笔录（卷 P12—60，夜间连续 6 小时）</td><td>李某前 3 次承认侵占</td><td>合法性异议：3-6 22:00 至次日 4:00 连续讯问未保障休息、未告知权利，依排非规定申请排除；即便不排除，证明力应打折（后 2 次已翻供）</td></tr>\n<tr><td>司法会计鉴定（卷 P88—110）</td><td>认定 68 万被侵占</td><td>关联性/真实性异议：未扣除公司对李某应付账款（42 万提成、26 万借款已还 12 万），数额认定方法错误</td></tr>\n<tr><td>微信截图</td><td>印证私自收款</td><td>真实性异议：部分无原始载体，无法核对完整性，不得单独作为定案依据</td></tr>\n<tr><td>王某、张某证言</td><td>印证职务侵占</td><td>证明力异议：二人对提成冲抵惯例证言不一，且庭前有顾虑，应出庭对质</td></tr>\n<tr><td>银行流水、付款凭证</td><td>资金转入李某账户</td><td>关联性异议：仅证明资金走向，不能证明「非法占有目的」</td></tr>\n<tr><td>到案经过</td><td>—</td><td>证明力：可佐证自首（电话通知后主动到案）</td></tr>\n<tr><td>退赔凭证、谅解意向</td><td>—</td><td>证明力：印证悔罪、从宽情节</td></tr>\n<tr><td>提成核算表</td><td>—</td><td>真实性：印证 42 万系提成争议而非侵占</td></tr>\n</tbody>\n</table>\n<h4>二、十类证据高效质证话术库（每类 3 句，可直接照念）</h4>\n<ol>\n<li><b>书证：</b>「这份书证来源不清，无法确认是否原件。」「盖章单位与待证事实无直接关系，关联性不认可。」「关键页无签收记录，真实性有异议。」</li>\n<li><b>物证：</b>「物证提取无见证人签字，提取程序存疑。」「未附扣押清单，同一性无法确认。」「保管链条中断，不排除被替换可能。」</li>\n<li><b>证人证言：</b>「证人与被害人有利害关系，证明力应折扣。」「该证言与庭前笔录矛盾，请求当庭对质。」「证人未出庭，依规定不得作为定案依据。」</li>\n<li><b>被害人陈述：</b>「被害方系利害关系人，单方陈述需补强。」「陈述中推算部分无依据。」「与在案客观证据矛盾的部分不认可。」</li>\n<li><b>犯罪嫌疑人供述：</b>「该次供述系疲劳审讯取得，申请排除。」「笔录与同步录像不一致处，以录像为准。」「被告人已合理说明翻供原因，应采有利于被告解释。」</li>\n<li><b>鉴定意见：</b>「检材不完整，结论当然不可靠。」「鉴定机构/人资质请法庭核实。」「分析过程未载明，无法复核，关联性不认可。」</li>\n<li><b>勘验检查笔录：</b>「笔录无见证人，程序违法。」「记载地点与现场不符。」「关键物未拍照固定，真实性存疑。」</li>\n<li><b>视听/电子证据：</b>「原始载体未提交，真实性不认可。」「未做完整性校验（哈希值）。」「剪辑可能性未排除。」</li>\n<li><b>辨认笔录：</b>「辨认未混杂同类对象，程序违规。」「辨认前见过的，应排除。」「笔录无被辨认人签字确认。」</li>\n<li><b>情况说明/抓获经过：</b>「单位出具的情况说明属主观意见，非客观证据。」「抓获经过未说明通知到案细节，无法佐证自首。」「无经办人签字，形式不合法。」</li>\n</ol>\n<div class=\"box tip\"><span class=\"lb\">质证铁律</span>每一条质证必须<b>落到三性之一</b>＋<b>指向具体卷宗页码</b>。空喊「不认可」会被审判长一句「请说理由」当场打回。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你对本案 8 类证据是否都说了「三性＋页码」？有没有只喊「不认可」的地方？　<b>当日交付物：</b>质证话术库＋本案质证演示。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>质证意见表 + 质证话术库。</div>", "has_out": true}, {"id": "d24", "title": "Day 24　辩护词与法庭辩论", "html": "<div class=\"meta\"><b>目标：</b>写出一份结论前置的辩护词，并能口头发表 15 分钟。<b>　精读：</b><a href=\"trial.html\" style=\"color:var(--gold)\">模块 06 第五节</a>。</div>\n<div class=\"meta\"><b>实操：</b>写完整《辩护词》（含无罪/改定性主主张 + 量刑辩护 + 具体量刑建议），并压缩出口头发表的 3 个核心点（每点 3 分钟）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D24】请模拟一场完整的法庭辩论：你扮演公诉人，我扮演辩护人。\n流程：你先发表公诉意见（约 8 分钟量）→ 我发表辩护意见 → 你进行第二轮反驳 → 我第二轮答辩。\n你要真正针对我的论点反击，不要礼让。辩论结束后请切换到资深刑辩律师，从三个维度打分：\n① 论证的严密性；② 表达的说服力（法官会不会听进去）；③ 量刑建议的可操作性。\n每项给出 1—10 分、扣分点与修改建议。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 一审辩护词（辩论一轮）+ 二轮答辩要点 + 三维度评分</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、一审辩护词（核心论点）</h4>\n<div class=\"doc\">辩护词（节选）\n\n一、定性：李某不具有非法占有目的。42 万元系公司长期拖欠的提成、报销，经分管副总口头同意由客户货款冲抵，有提成核算表与微信记录印证；26 万元系借款并已归还 12 万。其收款系「债权实现」之争，非将单位财物据为己有。\n\n二、数额：指控 68 万认定方法错误。司法会计鉴定未扣除公司对李某的应付账款，真正无争议的涉刑部分远低于指控数额，且 42 万提成争议应留待民事途径解决。\n\n三、排非：2025-03-06 22:00 至次日 4:00 连续讯问 6 小时，未保障必要休息、未告知诉讼权利，该次及受污染后续供述依法应予排除。\n\n四、自首：电话通知后主动到案并首次如实供述，依法构成自首，可从轻或减轻。\n\n五、退赔与谅解：已退赔 20 万并取得部分谅解意向，悔罪态度明确。\n\n六、量刑建议：结合自首、退赔、初犯、家庭情况，建议从轻处罚并适用缓刑。</div>\n<h4>二、公诉人反驳与我方二轮答辩要点</h4>\n<table>\n<thead><tr><th>公诉人论点</th><th>我方二轮答辩</th></tr></thead>\n<tbody>\n<tr><td>68 万应全额认定</td><td>鉴定未扣应付账款，方法错误；应就无争议部分评判，否则举证责任倒置给被告人</td></tr>\n<tr><td>截留货款即推定非法占有</td><td>有真实债权背景且按月还款，无逃避返还行为，不能推定</td></tr>\n<tr><td>翻供说明心虚</td><td>翻供系因排非线索，一审前如实供述仍可认定自首，不能反推有罪</td></tr>\n<tr><td>公司要求严惩</td><td>量刑是法定裁量，公司诉求不能替代法定从轻情节</td></tr>\n</tbody>\n</table>\n<h4>三、资深刑辩三维度评分（1—10 分）</h4>\n<table>\n<thead><tr><th>维度</th><th>分数</th><th>扣分点</th><th>修改建议</th></tr></thead>\n<tbody>\n<tr><td>论证严密性</td><td>8</td><td>42 万提成举证责任分配论述偏弱</td><td>补强提成核算表与微信记录的闭合证据链</td></tr>\n<tr><td>表达说服力</td><td>7</td><td>语速偏快、与法官眼神交流少</td><td>关键论点放慢、面向合议庭而非公诉人</td></tr>\n<tr><td>量刑可操作性</td><td>9</td><td>缓刑论证未附分期退赔方案</td><td>当庭提交可执行的退赔/谅解履行计划</td></tr>\n</tbody>\n</table>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的辩护词每个论点是否都有卷宗依据？二轮答辩是否针锋相对而非重复？　<b>当日交付物：</b>一审辩护词＋二轮答辩要点＋评分。</div>\n\n<div class=\"meta\"><b>自检：</b>辩护词有没有具体刑期建议？有没有标卷宗页码？第一页能不能看到全部结论？　<b>当日交付物：</b>辩护词 + 口头发表提纲。</div>", "has_out": true}, {"id": "d25", "title": "Day 25　最后陈述与庭后工作", "html": "<div class=\"meta\"><b>目标：</b>不让任何一个动作在判决书之前掉链子。<b>　精读：</b><a href=\"trial.html\" style=\"color:var(--gold)\">模块 06 第七、八节</a>。</div>\n<div class=\"meta\"><b>实操：</b>① 为李某写一份《最后陈述》草稿（300 字，含认罪悔罪/辩解、家庭、请求）；② 写《庭审笔录核对要点清单》；③ 写《补充辩护意见》（针对庭审新出现的争点）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D25】请扮演本案书记员。我将核对庭审笔录。\n你故意在笔录中做了以下手脚：① 把我的质证意见简化为「辩护人有异议」；\n② 漏记我提出的排非申请；③ 把被告人的辩解记为「承认」；④ 漏记我要求记入笔录的异议。\n我必须逐条发现并要求补正。每发现一处你才承认并补正。\n结束后请给我一份《庭审笔录核对的十五个必查点》。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 庭审笔录十五必查点 + 最后陈述建议 + 庭后清单</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、庭审笔录核对演练（书记员四处手脚，逐条发现补正）</h4>\n<ol>\n<li><b>质证被简化为「辩护人有异议」</b> → 要求补记具体异议内容（排非、鉴定方法、证言矛盾）。</li>\n<li><b>漏记排非申请</b> → 要求补记「辩护人当庭提出排除 3-6 夜间讯问笔录及受污染供述」。</li>\n<li><b>被告人辩解记为「承认」</b> → 要求更正为「被告人辩解：42 万系提成冲抵，非侵占」。</li>\n<li><b>漏记要求记入笔录的异议</b> → 要求补记「辩护人对证人未出庭提出异议，请求记入」。</li>\n</ol>\n<h4>二、庭审笔录核对的十五个必查点</h4>\n<ol>\n<li>当事人身份、权利义务告知是否完整；</li>\n<li>被告人陈述与原笔录是否一致；</li>\n<li>每项质证意见是否具体记录（而非「有异议」）；</li>\n<li>排非、调取证据等程序申请是否记录；</li>\n<li>证人/鉴定人/专家辅助人出庭申请及裁定是否记录；</li>\n<li>当庭提交的新证据是否入卷；</li>\n<li>对己方有利的陈述是否被改写为不利；</li>\n<li>法官打断、制止的内容是否客观记录；</li>\n<li>辩论焦点归纳是否遗漏关键辩点；</li>\n<li>最后陈述是否完整；</li>\n<li>所有「要求记入笔录」的异议是否记全；</li>\n<li>时间、地点、到庭人员是否准确；</li>\n<li>签名栏是否逐页签署；</li>\n<li>与同步录像是否一致；</li>\n<li>补正处是否有当事人/辩护人签字确认。</li>\n</ol>\n<h4>三、被告人最后陈述建议（李某视角）</h4>\n<div class=\"doc\">最后陈述（草稿）\n审判长、审判员：我把公司当自己家一样干了五年，42 万是拖欠我的提成，26 万是借公司的钱、已经还了 12 万。我没想吞掉公司一分钱。案发后我第一时间到案、退了 20 万，也想把剩下的尽快还清。恳请法庭看在我认错、退赔、家里还有老人孩子需要照顾的份上，给我一个改过自新的机会。</div>\n<h4>四、庭后工作清单</h4>\n<ol>\n<li>三日内提交书面辩护词（与庭审辩论衔接）；</li>\n<li>整理庭审意见，对未采纳的异议固化上诉理由；</li>\n<li>跟进排非裁定结果；</li>\n<li>向被告人及其家属释明上诉权与期限（判决送达后 10 日）；</li>\n<li>推进剩余退赔与谅解书签署，作为量刑补强。</li>\n</ol>\n<div class=\"box warn\"><span class=\"lb\">笔录是二审的弹药</span>庭审中发现的不利改写，若不当庭要求补正，二审几乎无法推翻。核对笔录不是走形式。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你能否当庭发现「质证被简化」这类手脚？所有异议是否都要求记入笔录？　<b>当日交付物：</b>笔录十五必查点＋最后陈述＋庭后清单。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>最后陈述 + 笔录核对清单 + 补充辩护意见。</div>", "has_out": true}, {"id": "d26", "title": "Day 26　判决、上诉与上诉不加刑", "html": "<div class=\"meta\"><b>目标：</b>把上诉做成一次精准的外科手术。<b>　精读：</b><a href=\"post.html\" style=\"color:var(--gold)\">模块 07 第一节</a>。</div>\n<div class=\"meta\"><b>实操：</b>假设一审判决：认定职务侵占罪，数额 68 万元，判处有期徒刑 3 年 6 个月，未适用缓刑。写《刑事上诉状》（只挑 3 个最致命的理由）+《开庭审理申请书》。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D26】你是二审合议庭的承办法官。我提交了上诉状与开庭审理申请书。\n请你：① 逐条评价我的上诉理由（哪条最有力、哪条是凑数的）；\n② 裁定是否开庭审理并说明理由；③ 模拟二审评议过程，说明你会维持、改判还是发回重审；\n④ 特别就「上诉不加刑」提问：如果检察院没有抗诉、被害人没有上诉，\n二审最坏结果是什么？如果检察院在上诉期届满前一天提出抗诉，情况有何不同？\n⑤ 请给我一份《上诉状写作的五个致命错误清单》。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 上诉状 + 二审评议 + 上诉不加刑分析 + 五致命错误</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、上诉状（针对一审可能错误）</h4>\n<div class=\"doc\">刑事上诉状（节选）\n上诉人：李某\n上诉请求：撤销原判，依法改判无罪（或发回重审/减轻处罚）。\n事实与理由：\n一、原审未排除 2025-03-06 夜间连续讯问形成的供述，违反排非规定，该证据系定案关键，排除后事实不清。\n二、原审全额认定 68 万，未扣除公司对上诉人的应付账款（42 万提成、26 万借款已还 12 万），数额认定错误。\n三、上诉人电话通知后主动到案并如实供述，构成自首，原审量刑未充分体现。\n四、已退赔 20 万并取得部分谅解，原审未充分评价从宽情节。</div>\n<h4>二、二审承办法官评价</h4>\n<ol>\n<li><b>最有力理由：</b>排非＋数额重算——直接动摇事实基础。</li>\n<li><b>凑数理由：</b>「审判程序轻微瑕疵」若无实质影响，二审一眼看穿，只会稀释说服力。</li>\n</ol>\n<h4>三、开庭裁定与二审评议</h4>\n<p><b>开庭裁定：</b>对事实、证据有争议（排非、数额），应开庭审理（刑诉第 234 条）。<b>评议倾向：</b>若排非成立或数额重算后显著下降，可改判；若仅量刑偏重，可在不加刑范围内改判从轻；事实清楚则维持。</p>\n<h4>四、上诉不加刑分析</h4>\n<table>\n<thead><tr><th>情形</th><th>二审最坏结果</th></tr></thead>\n<tbody>\n<tr><td>被告人上诉，检察院未抗诉、被害人未上诉</td><td>依第 237 条不得加重刑罚，最坏＝维持原判（绝不会更重）</td></tr>\n<tr><td>检察院在上诉期届满前提出抗诉</td><td>抗诉不受不加刑限制，二审可改判更重；故须在上诉期内判断是否可能引发抗诉</td></tr>\n</tbody>\n</table>\n<h4>五、上诉状五致命错误</h4>\n<ol>\n<li>把「不服」当理由，不写具体事实与法律依据；</li>\n<li>只笼统说「事实不清」，不指明确切证据与卷页；</li>\n<li>凑数罗列无关程序瑕疵，稀释核心论点；</li>\n<li>超过上诉期（判决 10 日、裁定 5 日）才交；</li>\n<li>忽略「上诉不加刑」边界，误以为抗诉也受保护。</li>\n</ol>\n<div class=\"box tip\"><span class=\"lb\">上诉的本质</span>不是「再吵一次」，而是把一审被忽略、被错误认定的<b>具体事实与法律点</b>，用二审能改的方式重新摆出来。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的上诉状有没有具体卷页与法条？是否混入了凑数理由？上诉期算对了吗？　<b>当日交付物：</b>上诉状＋二审分析＋五错误清单。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>上诉状 + 开庭审理申请书 + 上诉期管理表。</div>", "has_out": true}, {"id": "d27", "title": "Day 27　死刑复核、再审与申诉", "html": "<div class=\"meta\"><b>目标：</b>掌握生效裁判之后的三条救济通道。<b>　精读：</b><a href=\"post.html\" style=\"color:var(--gold)\">模块 07 第二、三节</a>。</div>\n<div class=\"meta\"><b>实操：</b>假设李某案二审维持原判，三年后发现新证据（公司副总张某承认当年确实口头同意冲抵的录音）。写《刑事申诉状》+《向检察院申诉请求抗诉的意见书》。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D27】请分两段：\n① 扮演省高院申诉审查法官：我提交申诉状。请你审查是否符合「应当重新审判」的法定情形，\n　 提出你的疑虑（新证据的合法性、是否足以推翻原判、是否超过合理期限），并模拟你的审查结论；\n② 扮演检察院控告申诉部门检察官：我请求抗诉。请你说明检察院在何种情形下会提出抗诉，\n　 以及我作为辩护人应当提交哪些材料。结束后请给我一份\n《申诉成功率的现实评估与路径优先级建议》，并提醒我申诉阶段最容易犯的三个错误。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 申诉审查 + 抗诉路径 + 成功率评估 + 三误区</span>\n<p style=\"color:var(--tx3);font-size:12px\">注：本案为职务侵占（非死刑），不涉及死刑复核；以下内容以「生效裁判后的救济」为通用方法训练，方法同样适用于死刑复核等特别程序。</p>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、申诉审查（省高院）</h4>\n<p>法定「应当重新审判」情形（刑诉第 253 条）：① 有新证据足以推翻原判决；② 据以定罪的书证/物证/证言等不实或应排除而未排除；③ 原法官贪污受贿、枉法裁判；④ 主要事实依据被新裁判推翻；⑤ 违反法定程序可能影响公正审判。</p>\n<p><b>审查结论模拟：</b>申诉主张「鉴定未扣应付账款＋排非线索」。若新证据（提成核算底稿、财务群聊天记录）足以影响数额认定，可能启动再审；但若原审已质证且仅为「不服」，一般不予启动——所以申诉成败在「新证据」与「程序硬伤」，不在情绪。</p>\n<h4>二、检察院抗诉（控申部门）</h4>\n<ol>\n<li><b>抗诉情形：</b>生效裁判确有错误、审判人员贪腐枉法、量刑明显畸轻畸重。</li>\n<li><b>应提交材料：</b>申诉状、新证据材料、原审裁判文书及卷宗复印件、法律依据说明。</li>\n</ol>\n<h4>三、申诉成功率现实评估与路径优先级</h4>\n<table>\n<thead><tr><th>路径</th><th>优先级</th><th>说明</th></tr></thead>\n<tbody>\n<tr><td>向法院申请再审（有新证据/程序硬伤）</td><td>高</td><td>最直接，前提是证据扎实</td></tr>\n<tr><td>向检察院申请抗诉</td><td>中</td><td>审查周期长，需检方认同错误</td></tr>\n<tr><td>信访</td><td>低</td><td>仅作补充，不能替代法定程序</td></tr>\n</tbody>\n</table>\n<h4>四、申诉三误区</h4>\n<ol>\n<li>只有「不服」没有「新证据」，反复申诉被驳回；</li>\n<li>把一审已质证的观点换个说法再提，不算新事实；</li>\n<li>错过关键时点（如新证据出现后未及时提交），导致超合理期限。</li>\n</ol>\n<div class=\"box warn\"><span class=\"lb\">申诉的真相</span>再审是例外而非常态。能启动的申诉，靠的是<b>原审看不到的新证据或程序硬伤</b>，不是更激昂的措辞。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的申诉有没有「新证据或程序硬伤」这一硬抓手？路径优先级选对了吗？　<b>当日交付物：</b>申诉评估＋抗诉路径＋三误区。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>申诉状 + 请求抗诉意见书 + 救济路径优先级表。</div>", "has_out": true}, {"id": "d28", "title": "Day 28　执行：折抵、减刑假释、财产刑", "html": "<div class=\"meta\"><b>目标：</b>把执行阶段也变成可辩护的战场。<b>　精读：</b><a href=\"post.html\" style=\"color:var(--gold)\">模块 07 第四节</a> + <a href=\"tools.html\" style=\"color:var(--gold)\">刑期折抵计算器</a>。</div>\n<div class=\"meta\"><b>实操：</b>① 用计算器核算李某的刑期（判决 3 年 6 个月，先行羁押自 2025 年 3 月 6 日起）；② 写《减刑申请材料清单》与《财产刑履行方案》；③ 写一份针对罚金数额过高的《减免罚金申请书》。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D28】请你扮演监狱刑罚执行部门的警官 + 审理减刑案件的法官，两个身份各 15 分钟：\n① 警官：我会询问减刑的条件、计分考核、财产性判项履行对减刑的影响，你要给出实务口径；\n② 法官：我提交减刑建议相关材料与财产刑履行方案，你要审查并决定是否裁定减刑。\n结束后请给出《减刑假释实务中最容易被忽略的五个要点》（尤其是财产性判项履行与「确有悔改表现」的认定）。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 羁押折抵 + 减刑假释五要点 + 财产刑履行</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、羁押期限折抵</h4>\n<p>先行羁押 1 日折抵刑期 1 日（拘役、有期徒刑）。李某自 2025-03-06 刑拘起算，羁押日连续计算（不扣周末）。<b>举例：</b>若一审宣告刑 14 个月，已羁押约 18 个月（3 月刑拘至宣判），则判决时已是实刑届满、应当庭释放或折抵后剩余无几——这说明本案羁押已明显超过可能刑期，是量刑与强制措施审查的重要信号。</p>\n<h4>二、减刑假释实务五要点</h4>\n<ol>\n<li><b>财产性判项履行是「确有悔改表现」的硬指标</b>：不退赔、不缴罚金，一般不予减刑假释；</li>\n<li><b>计分考核：</b>需达到监狱规定的最低考核分，且近年内无严重违规；</li>\n<li><b>减刑起始与间隔：</b>依判刑罚种与刑期，有法定最低执行期与间隔月要求；</li>\n<li><b>假释评估：</b>须认定「没有再犯罪危险」，结合犯罪性质、悔罪、监管条件；</li>\n<li><b>拒履后果：</b>有能力履行而拒不履行财产刑的，减刑假释从严，甚至不批。</li>\n</ol>\n<h4>三、警官/法官问答要点</h4>\n<ol>\n<li>问警官：「计分考核如何认定？财产刑未履行是否影响提请？」→ 答：未履行原则上不提请。</li>\n<li>问法官：「提交分期退赔方案并实际履行部分，能否认定悔改？」→ 答：主动履行可体现悔罪，是重要酌定因素。</li>\n</ol>\n<h4>四、财产刑履行方案</h4>\n<p>制定剩余退赔＋罚金的分期履行计划，<b>主动、可验证地履行</b>，既是悔罪表现，也是争取减刑假释的实质条件。切勿「判了再拖」。</p>\n<div class=\"box tip\"><span class=\"lb\">执行的隐藏战场</span>很多被告人输在「判完不交钱」。财产刑履行从判决生效第一天起就影响减刑——这是辩护人庭后最该盯的事。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你有没有帮被告人算清羁押折抵？有没有把财产刑履行方案做成可执行的计划？　<b>当日交付物：</b>折抵计算＋减刑假释要点＋履行方案。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>刑期核算表 + 减刑材料清单 + 减免罚金申请书。</div>", "has_out": true}, {"id": "d29", "title": "Day 29　特别程序与企业视角", "html": "<div class=\"meta\"><b>目标：</b>从企业法务视角反过来看刑事风险。<b>　精读：</b><a href=\"special.html\" style=\"color:var(--gold)\">模块 08</a>。</div>\n<div class=\"meta\"><b>实操：</b>站在甲公司法务总监的位置，写一份《员工涉刑案件公司应对预案》（含报案决策、证据保全、账户冻结应对、员工劳动关系处理、合规整改）。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D29】我是甲公司的法务（企业法务背景）。请就以下场景与我推演：\n① 发现销售经理可能侵占货款 68 万元，应当先内部调查还是直接报案？报案前必须固定哪些证据？\n② 报案后公司账户被冻结、客户不敢回款，如何申请解除或变更？\n③ 员工被刑拘，劳动合同如何处理（能否暂停、能否解除）？\n④ 检察院提出可以做涉案企业合规考察，我们要不要申请？利弊是什么？\n⑤ 公司如何在刑事诉讼中主张民事赔偿（附带民事诉讼的时机与范围）？\n请给出可执行的动作清单与时间表（T+0、T+7、T+30、T+90）。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 企业法务动作清单与时间表（T+0/T+7/T+30/T+90）</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、先内部调查还是直接报案？</h4>\n<p>应先<b>内部固定证据</b>再决定是否报案。直接报案可能打草惊蛇、致证据转移灭失；但内部调查必须合法——不得私刑、不得隐匿证据、不得超越权限处分。</p>\n<h4>二、报案前必须固定的证据</h4>\n<ol>\n<li>劳动合同、提成/报销制度与审批流；</li>\n<li>银行流水、客户付款凭证与对账差异；</li>\n<li>客户确认函/询证函；</li>\n<li>微信、邮件等沟通记录（保留原始载体并公证）；</li>\n<li>库存/账务盘点差异报告。</li>\n</ol>\n<h4>三、账户冻结/客户回款受阻的解除</h4>\n<p>区分「涉案财物」与「合法财产」。对与犯罪无关的资金、账户，依刑诉第 245 条申请解除查封、扣押、冻结或变更强制措施，提交权属与合法性证明。</p>\n<h4>四、员工被刑拘后劳动合同处理</h4>\n<p>劳动者被依法追究刑事责任的，单位可依法解除劳动合同（劳动合同法第 39 条）；刑拘期间可暂停履行、停发工资，但不得借此加重处罚或侵害人身权。</p>\n<h4>五、涉案企业合规考察</h4>\n<p>若公司管理存在漏洞致犯罪发生，可申请合规整改考察。利：争取单位责任从宽甚至免责；弊：需投入成本、可能暴露更多内部问题，须权衡。</p>\n<h4>六、附带民事诉讼</h4>\n<p>时机：刑事案件立案后、一审法庭辩论终结前提起；范围：因犯罪遭受的<b>物质损失</b>（如被侵占货款本金），不含惩罚性赔偿。</p>\n<h4>七、动作清单与时间表</h4>\n<table>\n<thead><tr><th>时间</th><th>动作</th></tr></thead>\n<tbody>\n<tr><td>T+0</td><td>内部封存证据、冻结该员工系统权限、律师介入、评估是否报案</td></tr>\n<tr><td>T+7</td><td>完成初步核查、决定是否报案、准备报案材料与证据清单</td></tr>\n<tr><td>T+30</td><td>报案后配合侦查、申请解除合法账户冻结、依法处理劳动关系</td></tr>\n<tr><td>T+90</td><td>推进合规整改/附带民事诉讼、制定损失追偿与内部治理改进方案</td></tr>\n</tbody>\n</table>\n<div class=\"box tip\"><span class=\"lb\">企业法务的站位</span>报案是手段不是目的。目标是在<b>追回损失、固定责任、修补治理</b>三者间取得平衡，而非把人送进去就结束。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你的时间表是否区分了「合法证据固定」与「违法私力救济」？附带民事诉讼范围是否守住了「物质损失」？　<b>当日交付物：</b>企业动作清单与时间表。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>《员工涉刑案件公司应对预案》（含时间表）。</div>", "has_out": true}, {"id": "d30", "title": "Day 30　终局实战：全流程模拟庭审", "html": "<div class=\"meta\"><b>目标：</b>把 30 天全部串起来，跑一次完整的庭审。<b>　精读：</b>全部模块。</div>\n<details class=\"ins\"><summary>给 AI 的指令（点开复制 · 作为你的陪练对手）</summary><div class=\"pbox\"><button class=\"cp\" onclick=\"cp(this)\">复制</button>【指令 D30 · 终局实战】请与我完整模拟李某案的一审庭审。你同时扮演审判长、公诉人\n（必要时可自行切换角色并注明），我扮演辩护人。完整走完：\n开庭 → 核对身份与告知权利 → 宣读起诉书 → 被告人陈述 → 讯问发问 → 举证质证\n（含对排非申请的法庭调查）→ 法庭辩论（两轮）→ 被告人最后陈述 → 休庭评议 → 宣判。\n你要真实地打断我、制止我、要求我说明理由。庭审结束后：\n① 请你以审判长身份宣读判决书（含对每一项辩护意见的采纳与否及理由）；\n② 切换到总考官身份，从「庭前准备、事实之辩、法律之辩、程序之辩、量刑辩护、\n　 庭审表达、执业规范」七个维度给我打分（百分制）并给出改进清单；\n③ 给我一份《下一步 12 个月的进阶书单与训练建议》。</div></details>\n\n<div class=\"out\"><span class=\"out-h\">▶ 跑出来的内容 · 一审庭审全流程脚本 + 判决书 + 七维度评分 + 进阶书单</span>\n<p style=\"color:var(--tx3);font-size:12.5px\">条号按《刑事诉讼法》2018 年修正本及 2016 年贪污贿赂司法解释标注，并可能随修法变动；办案请以现行官方文本与本省实施细则为准。内容仅供学习训练，非正式法律意见。</p>\n<h4>一、模拟一审庭审脚本（关键节点）</h4>\n<ol>\n<li><b>开庭：</b>审判长核对到庭、宣布案由与合议庭；</li>\n<li><b>告知权利：</b>申请回避、辩护、最后陈述；</li>\n<li><b>宣读起诉书：</b>指控职务侵占 68 万；</li>\n<li><b>被告人陈述：</b>李某陈述提成冲抵与借款背景；</li>\n<li><b>讯问发问：</b>公诉人讯问→辩护人就李某、证人张某/王某、鉴定人分别发问；</li>\n<li><b>举证质证：</b>含对 3-6 夜间讯问笔录的排非法庭调查；</li>\n<li><b>法庭辩论（两轮）：</b>公诉意见→辩护词→反驳→答辩；</li>\n<li><b>最后陈述：</b>李某悔罪并请求从宽；</li>\n<li><b>休庭评议 → 宣判。</b></li>\n</ol>\n<h4>二、审判长判决书（对辩护意见的采纳）</h4>\n<div class=\"doc\">本院评判（节选）\n一、关于排非申请：辩护人提出 2025-03-06 夜间连续讯问程序违法，该次供述不予采纳；后续供述因受污染，证明力不予认定。\n二、关于数额：鉴定未扣除公司对被告人的应付账款，本院予以纠正——26 万元借款中已还 12 万元部分从犯罪数额中剔除；42 万元提成争议，因事实不清、证据不足，不作为犯罪数额认定，相关纠纷另行通过民事途径解决。\n三、关于自首：被告人经电话通知后主动到案并如实供述，构成自首，依法从轻处罚。\n四、关于退赔与谅解：已退赔 20 万元并取得被害单位部分谅解，酌情从轻。\n五、关于缓刑：综合犯罪事实、自首、退赔及再犯危险性，对被告人适用缓刑。\n\n综上，判处有期徒刑 × 年，缓刑 × 年，并处罚金。（模拟结论，供训练参考）</div>\n<h4>三、七维度评分（百分制）</h4>\n<table>\n<thead><tr><th>维度</th><th>得分</th><th>改进建议</th></tr></thead>\n<tbody>\n<tr><td>庭前准备</td><td>90</td><td>虚拟案卷已吃透，可补类案检索</td></tr>\n<tr><td>事实之辩</td><td>88</td><td>42 万提成证据链再夯实</td></tr>\n<tr><td>法律之辩</td><td>85</td><td>挪用与侵占界分再练</td></tr>\n<tr><td>程序之辩</td><td>92</td><td>排非时机把握精准，保持</td></tr>\n<tr><td>量刑辩护</td><td>90</td><td>附可执行退赔方案更佳</td></tr>\n<tr><td>庭审表达</td><td>84</td><td>语速、眼神、面向合议庭</td></tr>\n<tr><td>执业规范</td><td>95</td><td>权利义务告知、笔录核对到位</td></tr>\n</tbody>\n</table>\n<h4>四、下一步 12 个月进阶书单与训练建议</h4>\n<ol>\n<li><b>书单：</b>《刑事辩护的艺术》《无罪辩护》《庭审驾驭能力》《量刑规范化指引》《证据审查判断实务》；关注最高法指导案例与人民法院案例库。</li>\n<li><b>训练：</b>① 每周旁听一次真实庭审（尤其是刑庭）；② 跟办 1–2 件真实刑案做辅助；③ 每月写一篇模拟辩护词／质证意见；④ 参加一次模拟法庭并录像复盘表达；⑤ 建立自己的「质证话术库」与「量刑计算模板」。</li>\n</ol>\n<div class=\"box tip\"><span class=\"lb\">30 天之后</span>这套训练给你的不是「会办一案」，而是<b>一套可复制的刑辩工作流</b>：接案→建卷→会见→阅卷→排非→取证→量刑→庭审→上诉→执行。把它变成肌肉记忆。</div>\n</div>\n\n<div class=\"meta\"><b>自检：</b>你能独立跑完一审全流程吗？判决书对每项辩护意见是否都有交代？七维度里最弱的一项你打算怎么补？　<b>当日交付物：</b>模拟庭审脚本＋判决书＋七维评分＋进阶书单。</div>\n\n<div class=\"meta\"><b>当日交付物：</b>完整庭审记录 + 个人能力评估报告 + 一份装订成册的完整卷宗（A—H 八分区）。</div>", "has_out": true}];
var CASE = "<h2>贯穿全程的虚拟案卷（所有作业都用它）</h2>\n<div class=\"doc\">【虚拟案卷 · 李某涉嫌职务侵占罪一案】\n\n当事人：李某，男，1990 年 5 月生，甲科技有限公司华南区销售经理，户籍与经常居住地均为本市。\n　　　　无前科，已婚，有一女（6 岁），父母年迈。\n\n指控事实（公安起诉意见书版本）：\n　　2023 年 1 月至 2024 年 12 月间，李某利用负责客户签约、回款管理的职务便利，\n　　将乙、丙、丁三家客户应支付给甲公司的货款共计 <b>68 万元</b>转入其个人控制的银行账户，\n　　用于个人消费。甲公司报案后案发。\n\n诉讼经过：\n　　2025 年 3 月 2 日，甲公司向公安机关报案；\n　　2025 年 3 月 5 日，公安机关电话通知李某到案，李某当日自行到案并接受讯问；\n　　2025 年 3 月 6 日，李某被刑事拘留；3 月 8 日送看守所；\n　　2025 年 3 月 10 日，家属委托律师；3 月 11 日律师第一次会见；\n　　2025 年 4 月 4 日，经检察院批准逮捕；\n　　2025 年 5 月 20 日，侦查终结移送审查起诉；\n　　2025 年 6 月 18 日，第一次退回补充侦查；7 月 15 日补侦重报；\n　　2025 年 8 月 10 日，第二次退回补充侦查；9 月 5 日补侦重报；\n　　2025 年 9 月 25 日，检察院提起公诉。\n\n李某的辩解：\n　　1. 其中 <b>42 万元</b>系甲公司长期拖欠其提成、报销款，经公司分管副总口头同意，\n　　　 由客户货款直接冲抵，有微信聊天记录与历年提成核算表可以证明；\n　　2. 另 <b>26 万元</b>确系向公司借款，已签署借条并按月归还，案发前已还 12 万元；\n　　3. 5 次讯问笔录中，前 3 次承认「侵占」，后 2 次翻供，称前 3 次系在连续讯问\n　　　 （其中一次自 3 月 6 日 22 时至次日凌晨 4 时，共 6 小时）且未告知权利义务的情况下作出。\n\n主要证据：\n　　① 报案材料与甲公司说明；② 三家客户付款凭证与银行流水；\n　　③ 李某个人账户收款记录；④ 微信聊天记录截图（部分无原始载体）；\n　　⑤ 李某讯问笔录 5 份（卷 P12—P60）；⑥ 证人（公司财务王某、副总张某、客户对接人）证言 6 份；\n　　⑦ 司法会计鉴定意见（卷 P88—P110）；⑧ 扣押清单（手机 1 部、电脑 1 台）；\n　　⑨ 到案经过说明；⑩ 退赔凭证（已退 20 万元）与甲公司部分谅解意向函。\n\n你的任务：从被委托那天起，把这个案子办到最好。</div>\n\n<div class=\"box tip\"><span class=\"lb\">怎么用这些指令</span>每天的那段「指令」是<b>给 AI 的</b>，不是给你读的。复制出来贴进对话框，AI 会扮演你的对手（承办检察官、法官、对方律师、难缠的家属）。你要做的是<b>接住它的追问</b>，并把产出写进你的卷宗。跑完 30 天，你的产出是一份完整卷宗，而不是一堆笔记。</div>\n\n<div class=\"daynav\" id=\"daynav\"><span class=\"lbl\">日次</span><button class=\"dbtn all\" id=\"expandAll\" title=\"展开全部 30 天\">展开全部</button><button class=\"dbtn all\" id=\"collapseAll\" title=\"收起全部 30 天\">收起全部</button><button class=\"dbtn\" data-target=\"d01\" title=\"Day 01 刑事诉讼全流程地图\">01</button><button class=\"dbtn\" data-target=\"d02\" title=\"Day 02 接案：第一个电话与 14 项必问\">02</button><button class=\"dbtn\" data-target=\"d03\" title=\"Day 03 利益冲突与委托手续\">03</button><button class=\"dbtn\" data-target=\"d04\" title=\"Day 04 建卷、工作日志与收费\">04</button><button class=\"dbtn\" data-target=\"d05\" title=\"Day 05 周末实战：完整走一遍接案\">05</button><button class=\"dbtn\" data-target=\"d06\" title=\"Day 06 会见权：三证、48 小时与救济\">06</button><button class=\"dbtn\" data-target=\"d07\" title=\"Day 07 第一次会见与笔录\">07</button><button class=\"dbtn\" data-target=\"d08\" title=\"Day 08 排非：从线索到申请\">08</button><button class=\"dbtn\" data-target=\"d09\" title=\"Day 09 取保候审与不批捕\">09</button><button class=\"dbtn\" data-target=\"d10\" title=\"Day 10 羁押必要性审查与侦查阶段收尾\">10</button><button class=\"dbtn\" data-target=\"d11\" title=\"Day 11 阅卷权与卷宗目录\">11</button><button class=\"dbtn\" data-target=\"d12\" title=\"Day 12 阅卷笔录：找矛盾\">12</button><button class=\"dbtn\" data-target=\"d13\" title=\"Day 13 证据三性与八类证据审查\">13</button><button class=\"dbtn\" data-target=\"d14\" title=\"Day 14 审查起诉辩护意见书\">14</button><button class=\"dbtn\" data-target=\"d15\" title=\"Day 15 认罪认罚：战略选择\">15</button><button class=\"dbtn\" data-target=\"d16\" title=\"Day 16 此罪与彼罪：定性之辩\">16</button><button class=\"dbtn\" data-target=\"d17\" title=\"Day 17 量刑三步法实操\">17</button><button class=\"dbtn\" data-target=\"d18\" title=\"Day 18 类案检索报告\">18</button><button class=\"dbtn\" data-target=\"d19\" title=\"Day 19 调查取证与专家辅助人\">19</button><button class=\"dbtn\" data-target=\"d20\" title=\"Day 20 附民、和解与退赔谈判\">20</button><button class=\"dbtn\" data-target=\"d21\" title=\"Day 21 庭前会议与庭前辩护意见\">21</button><button class=\"dbtn\" data-target=\"d22\" title=\"Day 22 发问：把有利事实问出来\">22</button><button class=\"dbtn\" data-target=\"d23\" title=\"Day 23 质证四步法\">23</button><button class=\"dbtn\" data-target=\"d24\" title=\"Day 24 辩护词与法庭辩论\">24</button><button class=\"dbtn\" data-target=\"d25\" title=\"Day 25 最后陈述与庭后工作\">25</button><button class=\"dbtn\" data-target=\"d26\" title=\"Day 26 判决、上诉与上诉不加刑\">26</button><button class=\"dbtn\" data-target=\"d27\" title=\"Day 27 死刑复核、再审与申诉\">27</button><button class=\"dbtn\" data-target=\"d28\" title=\"Day 28 执行：折抵、减刑假释、财产刑\">28</button><button class=\"dbtn\" data-target=\"d29\" title=\"Day 29 特别程序与企业视角\">29</button><button class=\"dbtn\" data-target=\"d30\" title=\"Day 30 终局实战：全流程模拟庭审\">30</button></div>\n<p class=\"hint\">点任意一天的标题即可<b>在当前页展开</b>，无需跳转；日次条可一键定位。指令框右上角「复制」可投喂给 AI 当陪练对手。</p>\n<div class=\"wk\"><div class=\"wkn\">1</div><div class=\"wkt\">第 1 周 · 建立地图与接案</div></div>";

function cp(btn){
  var box=btn.parentNode;
  var text=box.innerText.replace(/^复制\s*/,'');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){var o=btn.innerText;btn.innerText='已复制';setTimeout(function(){btn.innerText='复制';},1200);})
    .catch(function(){fallbackCopy(box,btn);});
  } else { fallbackCopy(box,btn); }
}
function fallbackCopy(box,btn){
  var r=document.createRange();r.selectNodeContents(box);
  var s=window.getSelection();s.removeAllRanges();s.addRange(r);
  try{document.execCommand('copy');btn.innerText='已复制';}catch(e){btn.innerText='请手动复制';}
  setTimeout(function(){btn.innerText='复制';},1200);
}

  html += '<div class="sub">每天 90 分钟：<b>20 分钟精读 + 50 分钟实操 + 20 分钟自检</b>。全部实操围绕同一个虚拟案卷展开，30 天结束时你会得到一份完整的卷宗。点击任意一天，直接进入该天「跑出来的内容」页面。</div>';
  html += '<details style="margin:14px 0"><summary class="ins-sum">贯穿全程的虚拟案卷（点击展开）</summary>' + CASE + '</details>';
  var weeks = [['第 1 周 · 认知·接案·建卷','d01','d06'],['第 2 周 · 会见·排非·取保·阅卷','d07','d12'],['第 3 周 · 证据·起诉·认罪认罚·量刑','d13','d18'],['第 4 周 · 一审·庭审·质证·辩护词','d19','d24'],['第 5 周 · 二审·复核·执行·综合实战','d25','d30']];
  for(var w=0;w<weeks.length;w++){
    html += '<div class="week">'+weeks[w][0]+'</div>';

      var cls = d.has_out ? 'card' : 'card pending';
      var badge = d.has_out ? '已就绪 · 点击查看' : '内容待补充';
      html += '<a class="'+cls+'" href="#/day/'+d.id+'"><span class="d">'+d.id.toUpperCase()+'</span><span class="t">'+d.title.replace(/^Day \d+ /,'')+'</span><span class="badge">'+badge+'</span></a>';
    }
    html += '</div>';

  app.innerHTML = html;
}

function renderDay(id){

  var i = idx(id), prev = (i>0)?DAYS[i-1]:null, next = (i<DAYS.length-1)?DAYS[i+1]:null;
  var html = '';
  html += '<a class="back" href="#/">← 返回 30 天计划地图</a>';
  html += '<div class="crumb">30 天计划 › <b>'+d.id.toUpperCase()+'</b></div>';
  html += '<h1>'+d.title+'</h1>';
  html += d.html;
  html += '<div class="daynav2">';
  html += prev ? '<a href="#/day/'+prev.id+'">← 上一篇 · '+prev.title.replace(/^Day \d+ /,'')+'</a>' : '<a class="disabled">已是第一天</a>';
  html += next ? '<a href="#/day/'+next.id+'">下一篇 · '+next.title.replace(/^Day \d+ /,'')+' →</a>' : '<a class="disabled">已是最后一天</a>';
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function route(){
  var h = location.hash.replace(/^#\/?/, '');
  if(h.indexOf('day/')===0){ renderDay(h.slice(4)); }
  else { renderHome(); }
}
window.addEventListener('hashchange', route);
route();

</script>
