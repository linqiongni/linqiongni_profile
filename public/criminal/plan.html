<!DOCTYPE html><html lang="zh-CN" data-theme-default="dark"><head><meta charset="utf-8"><meta name="viewport"content="width=device-width,initial-scale=1"><title>30 天训练计划 · 刑事辩护全流程实务</title><style>

*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1115;--bg2:#161b23;--card:#141922;--line:#272e3a;--line2:#3a4351;--tx:#e9e7e2;--tx2:#a9b1be;--tx3:#6d7683;--gold:#c9a227;--jade:#4a9d9c;--red:#c05c4e;--blue:#5b8dd6}
body{background:var(--bg);color:var(--tx);font-family:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;line-height:1.85;padding:0 0 70px}
.wrap{max-width:940px;margin:0 auto;padding:0 22px}
.topbar{background:linear-gradient(180deg,#12161d,#0f1115);border-bottom:1px solid var(--line);padding:13px 0;margin-bottom:26px;position:sticky;top:0;z-index:50}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-size:12.5px;letter-spacing:.2em;color:var(--gold)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:11.5px;color:var(--tx2);text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:3px 8px}
.nav a:hover,.nav a.on{border-color:var(--gold);color:var(--gold)}
.kicker{font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px}
h1{font-size:26px;line-height:1.45;margin-bottom:12px;font-weight:600}
.sub{color:var(--tx2);font-size:13.5px;margin-bottom:18px}
h2{font-size:19px;margin:32px 0 12px;padding-left:12px;border-left:3px solid var(--gold);line-height:1.5}
h3{font-size:15.5px;margin:20px 0 8px;color:var(--gold)}
p{font-size:14.5px;margin:9px 0}
p b,li b,td b{color:var(--gold);font-weight:600}
ul,ol{margin:9px 0 9px 4px;padding-left:20px}
li{font-size:14.5px;margin:5px 0}
table{width:100%;border-collapse:collapse;margin:13px 0;font-size:13.2px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg2);color:var(--gold);font-weight:600;white-space:nowrap}
.box{border-radius:8px;padding:12px 15px;margin:14px 0;font-size:14px;border:1px solid var(--line)}
.law{background:rgba(201,162,39,.07);border-left:3px solid var(--gold)}
.warn{background:rgba(192,92,78,.09);border-left:3px solid var(--red)}
.tip{background:rgba(74,157,156,.09);border-left:3px solid var(--jade)}
.case{background:rgba(91,141,214,.09);border-left:3px solid var(--blue)}
.lb{font-size:11px;letter-spacing:.16em;margin-bottom:6px;display:block}
.law .lb{color:var(--gold)}.warn .lb{color:var(--red)}.tip .lb{color:var(--jade)}.case .lb{color:var(--blue)}
.doc{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0;white-space:pre-wrap;font-size:13.2px;line-height:1.9;color:var(--tx)}
.chk{list-style:none;padding-left:0}
.chk li{padding-left:24px;position:relative}
.chk li::before{content:"□";position:absolute;left:4px;color:var(--gold)}
.foot{margin-top:42px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
details{background:var(--card);border:1px solid var(--line);border-radius:9px;margin:9px 0;padding:0 15px}
summary{cursor:pointer;padding:12px 0;font-size:14.5px;color:var(--gold);font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--gold)}
details[open] summary::before{content:"▾ "}
summary .tag{font-size:11px;color:var(--tx3);font-weight:400;margin-left:8px;letter-spacing:.08em}
.pbox{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:30px 14px 13px;margin:10px 0;white-space:pre-wrap;font-size:13.2px;line-height:1.85;color:var(--tx2)}
.cp{position:absolute;top:9px;right:12px;font-size:10.5px;color:var(--tx3);border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer;background:var(--bg);font-family:inherit}
.cp:hover{color:var(--gold);border-color:var(--gold)}
.meta{font-size:13px;color:var(--tx2);margin:8px 0}
.meta b{color:var(--jade)}
.wk{display:flex;align-items:center;gap:12px;margin:26px 0 8px}
.wkn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:rgba(201,162,39,.13);border:1px solid var(--gold);color:var(--gold);font-size:13px;display:flex;align-items:center;justify-content:center}
.wkt{font-size:16px;color:var(--tx);font-weight:600}
@media(max-width:640px){table{display:block;overflow-x:auto;white-space:nowrap}h1{font-size:21px}}

.daynav{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:10px 2px;margin:16px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:50px;z-index:45;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.dbtn.all{flex:0 0 auto;min-width:62px;color:var(--jade);background:transparent}
.dbtn.all:hover{border-color:var(--jade);color:var(--jade)}
.hint{font-size:12px;color:var(--tx3);margin:8px 0 4px;line-height:1.6}
.daynav .lbl{flex:0 0 auto;align-self:center;font-size:11px;color:var(--tx3);letter-spacing:.12em;margin-right:2px}
.dbtn{flex:0 0 auto;min-width:38px;font-family:inherit;font-size:12px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 0;cursor:pointer;transition:all .15s}
.dbtn:hover{border-color:var(--gold);color:var(--gold)}
.dbtn.on{border-color:var(--gold);color:#0f1115;background:var(--gold);font-weight:600}

.out{background:rgba(74,157,156,.06);border:1px solid var(--line);border-left:3px solid var(--jade);border-radius:8px;padding:13px 16px;margin:13px 0}
.out-h{display:block;font-size:11px;letter-spacing:.16em;color:var(--jade);margin-bottom:10px}
.out h4{font-size:14.5px;color:var(--gold);margin:16px 0 7px;font-weight:600}
.out h5{font-size:13.6px;color:var(--jade);margin:12px 0 4px;font-weight:600}
.out p,.out li{font-size:13.8px;line-height:1.85}
.out table{font-size:12.7px;margin:10px 0}
.out .meta{margin:6px 0}
.ins{background:transparent;border:1px dashed var(--line);border-radius:8px;margin:12px 0;padding:0 13px}
.ins>summary{font-size:12.5px;color:var(--tx2);padding:9px 0}
.ins>summary::before{content:"▸ ";color:var(--tx3)}
.ins[open]>summary::before{content:"▾ "}
.ins .pbox{margin-top:4px}
.rest{background:rgba(109,118,131,.08);border-left:3px solid var(--line2);border-radius:8px;padding:11px 15px;margin:13px 0;font-size:13px;color:var(--tx2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0 8px}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;transition:all .15s;min-height:74px}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card .d{font-size:11.5px;letter-spacing:.14em;color:var(--gold)}
.card .t{font-size:14px;color:var(--tx);line-height:1.5}
.card .badge{font-size:11px;color:var(--tx3)}
.card.pending{opacity:.62}
.card.pending .t{color:var(--tx2)}
.week{font-size:13px;color:var(--gold);margin:22px 0 2px;padding-left:10px;border-left:3px solid var(--gold);font-weight:600}
.crumb{font-size:12.5px;color:var(--tx3);margin:6px 0 4px}
.crumb a{color:var(--jade);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.daynav2{display:flex;justify-content:space-between;gap:10px;margin:26px 0 6px;flex-wrap:wrap}
.daynav2 a{flex:1 1 0;min-width:120px;text-align:center;text-decoration:none;font-size:13px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:9px 10px}
.daynav2 a:hover{border-color:var(--gold);color:var(--gold)}
.daynav2 .disabled{opacity:.4;pointer-events:none}
.back{display:inline-block;margin:10px 0 4px;font-size:13px;color:var(--jade);text-decoration:none}
.back:hover{text-decoration:underline}
.note{font-size:12.5px;color:var(--tx3);margin:8px 0 2px}
</style></head><body>
