<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>韩语学习笔记 · 林琼霓</title>
<style>
  :root{
    --bg:#FDFCF9; --surface:#FFFFFF; --text:#1D1D1F; --muted:#5F5F63; --gold:#B89F6B;
    --gold-soft:rgba(184,159,107,.12); --border:#E8E8E6; --accent:#987B47;
  }
  html[data-theme="dark"]{
    --bg:#161618; --surface:#232325; --text:#F4EFE4; --muted:#A1A1A6; --gold:#C9A86A;
    --gold-soft:rgba(184,159,107,.16); --border:#2C2C2E; --accent:#C9A86A;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:fixed; top:0; left:0; right:0; height:56px; z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:0 18px; background:var(--surface); border-bottom:1px solid var(--border);
  }
  .topbar .brand{display:flex; align-items:baseline; gap:10px; min-width:0}
  .topbar .brand b{font-size:16px; font-weight:600}
  .topbar .brand span{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold)}
  .topbar .acts{display:flex; align-items:center; gap:8px}
  .topbar a.lnk, .topbar button.btn{
    font-size:13px; color:var(--gold); text-decoration:none; cursor:pointer; white-space:nowrap;
    border:1px solid var(--border); padding:6px 12px; border-radius:999px; background:transparent; transition:.2s;
  }
  .topbar a.lnk:hover, .topbar button.btn:hover{background:var(--gold-soft); border-color:var(--gold)}
  .layout{display:flex; height:calc(100% - 56px); margin-top:56px}
  .sidebar{
    width:260px; flex:0 0 260px; overflow-y:auto; padding:18px 14px 40px;
    border-right:1px solid var(--border); background:var(--bg);
  }
  .sb-item{
    display:block; width:100%; text-align:left; border:0; background:transparent; cursor:pointer;
    color:var(--muted); font-size:13.5px; padding:8px 10px; border-radius:8px; transition:.15s; margin-bottom:2px;
  }
  .sb-item:hover{background:var(--gold-soft); color:var(--text)}
  .sb-item.active{background:var(--gold-soft); color:var(--gold); font-weight:600}
  .main{flex:1; overflow-y:auto; padding:26px 40px 80px}
  .info{
    background:var(--gold-soft); border-left:3px solid var(--gold); padding:12px 16px; border-radius:0 10px 10px 0;
    font-size:13.5px; color:var(--muted); margin-bottom:22px;
  }
  .info a{color:var(--gold)}
  .unit{scroll-margin-top:14px; margin-bottom:26px}
  .unit > h2{font-size:18px; font-weight:600; margin:0 0 4px}
  .unit > .sub{font-size:13px; color:var(--gold); margin:0 0 14px; letter-spacing:.04em}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin:0 0 12px;
  }
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
  .card-title{font-size:14px; font-weight:600; color:var(--accent)}
  .card-title[contenteditable="true"]{outline:none; border-bottom:1px dashed var(--border)}
  .saved{font-size:11px; color:#3FA66A; opacity:0; transition:opacity .3s}
  .saved.show{opacity:1}
  textarea.note{
    width:100%; border:0; outline:none; resize:none; background:transparent; color:var(--text);
    font-family:inherit; font-size:14.5px; line-height:1.7; min-height:44px; overflow:hidden;
  }
  textarea.note::placeholder{color:var(--muted); opacity:.7}
  .add{
    display:inline-block; margin-top:2px; font-size:13px; color:var(--gold); cursor:pointer;
    border:1px dashed var(--border); border-radius:10px; padding:7px 14px; background:transparent; transition:.2s;
  }
  .add:hover{border-color:var(--gold); background:var(--gold-soft)}
  .del{font-size:11px; color:#C0635A; cursor:pointer; border:0; background:transparent; margin-left:8px}
  @media (max-width:900px){
    .layout{flex-direction:column; height:auto; margin-top:56px}
    .sidebar{width:100%; flex:none; border-right:0; border-bottom:1px solid var(--border);
      display:flex; gap:6px; overflow-x:auto; padding:10px}
    .sb-item{flex:0 0 auto; white-space:nowrap; margin-bottom:0}
    .main{padding:18px 16px 60px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><b>韩语学习笔记</b><span>Study Notes</span></div>
    <div class="acts">
      <a class="lnk" href="/korean-ref/index.html">📖 韩语速查</a>
      <button class="btn" id="export">导出 Markdown</button>
    </div>
  </div>

  <div class="layout">
    <nav class="sidebar"><div id="sb"></div></nav>
    <main class="main" id="main">
      <div class="info">
        这是你在多邻国学韩语时的<strong>笔记位</strong>。点任意卡片即可输入，内容自动存在<strong>本机浏览器</strong>（localStorage）。
        ⚠️ 换设备 / 清缓存会丢，重要笔记用右上「导出 Markdown」存一份。每节课的官方语法讲解请去「韩语速查 → 学习资源」外链，本页不搬运多邻国内容。
      </div>
      <div id="units"></div>
    </main>
  </div>

<script>
(function(){
  function applyTheme(m){ document.documentElement.setAttribute('data-theme', m); }
  window.addEventListener('message', function(e){
    var d=e.data; if(d && d.type==='theme' && (d.mode==='dark'||d.mode==='light')) applyTheme(d.mode);
  });
  try{ if(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark'); }catch(_){}

  var UNITS = [
    { id:'u1', title:'Unit 1 · 基础 Basics', sub:'打招呼 · 我是/你是 · 数字 1–10',
      cards:[
        {id:'words', t:'新单词', ph:'这一节学到的新词（韩文 / 罗马音 / 中文）'},
        {id:'grammar', t:'语法点', ph:'这一节讲了什么语法？用自己的话记'},
        {id:'mine', t:'我的例句', ph:'造 2–3 句，尽量结合你的生活'},
        {id:'wrong', t:'易错点', ph:'哪里总记错 / 和中文哪里不一样'},
        {id:'check', t:'复习打卡', ph:'第几次复习？还熟吗？'}
      ]},
    { id:'u2', title:'Unit 2 · 人与物 People & Things', sub:'家人 · 食物 · 颜色 · 动物',
      cards:[
        {id:'words', t:'新单词', ph:'家人/食物/颜色/动物的词'},
        {id:'grammar', t:'语法点', ph:'这一节的新语法'},
        {id:'mine', t:'我的例句', ph:'用新词造句子'},
        {id:'wrong', t:'易错点', ph:'易混点'},
        {id:'check', t:'复习打卡', ph:'复习记录'}
      ]},
    { id:'u3', title:'Unit 3 · 日常 Daily Life', sub:'动作 · 时间 · 天气 · 喜好',
      cards:[
        {id:'words', t:'新单词', ph:'动词/时间/天气/喜好词'},
        {id:'grammar', t:'语法点', ph:'时态、否定等'},
        {id:'mine', t:'我的例句', ph:'描述你的一天'},
        {id:'wrong', t:'易错点', ph:'易错点'},
        {id:'check', t:'复习打卡', ph:'复习记录'}
      ]},
    { id:'u4', title:'Unit 4 · 出行 Out & About', sub:'问路 · 交通 · 购物 · 餐厅',
      cards:[
        {id:'words', t:'新单词', ph:'地点/交通/点餐词'},
        {id:'grammar', t:'语法点', ph:'这一节的新语法'},
        {id:'mine', t:'我的例句', ph:'模拟一次外出对话'},
        {id:'wrong', t:'易错点', ph:'易错点'},
        {id:'check', t:'复习打卡', ph:'复习记录'}
      ]},
    { id:'u5', title:'Unit 5 · 语法深读 Grammar', sub:'助词 · 时态 · 敬语 반말/존댓말',
      cards:[
        {id:'words', t:'新单词', ph:'这一节的高频词'},
        {id:'grammar', t:'语法点', ph:'把速查里的语法用自己的话复述一遍（记忆更牢）'},
        {id:'mine', t:'我的例句', ph:'每个语法点造一句'},
        {id:'wrong', t:'易错点', ph:'敬语用错的场合？'},
        {id:'check', t:'复习打卡', ph:'复习记录'}
      ]}
  ];

  var PREFIX = 'krnote:';
  function get(k){ try{ return localStorage.getItem(PREFIX+k); }catch(e){ return null; } }
  function set(k,v){ try{ localStorage.setItem(PREFIX+k, v); }catch(e){} }

  var main = document.getElementById('main');
  var sb = document.getElementById('sb');
  var unitsWrap = document.getElementById('units');
  var links = [];

  function makeCard(unitId, cardId, title, placeholder, opts){
    opts = opts || {};
    var card = document.createElement('div'); card.className='card';
    var head = document.createElement('div'); head.className='card-head';
    var t = document.createElement(opts.editable ? 'span' : 'span');
    if(opts.editable){ t.setAttribute('contenteditable','true'); t.className='card-title'; }
    else { t.className='card-title'; }
    t.textContent = title;
    var saved = document.createElement('span'); saved.className='saved'; saved.textContent='已保存 ✓';
    head.appendChild(t); head.appendChild(saved);
    if(opts.canDelete){
      var del = document.createElement('button'); del.className='del'; del.textContent='删除';
      del.addEventListener('click', function(){
        // 从索引移除并清存储
        var idx = JSON.parse(get(unitId+':custom-idx')||'[]').filter(function(x){return x!==cardId;});
        set(unitId+':custom-idx', JSON.stringify(idx));
        set(unitId+':c:'+cardId, '');
        card.parentNode.removeChild(card);
      });
      head.appendChild(del);
    }
    var ta = document.createElement('textarea'); ta.className='note';
    ta.setAttribute('data-key', unitId+':'+cardId);
    ta.placeholder = placeholder || '';
    ta.value = get(unitId+':'+cardId) || '';
    card.appendChild(head); card.appendChild(ta);

    if(opts.editable){
      t.addEventListener('input', function(){
        var idx = JSON.parse(get(unitId+':custom-idx')||'[]');
        var rec = JSON.parse(get(unitId+':c:'+cardId)||'{}'); rec.title=t.textContent;
        set(unitId+':c:'+cardId, JSON.stringify(rec));
      });
    }
    ta.addEventListener('input', function(){
      autoGrow(ta);
      set(unitId+':'+cardId, ta.value);
      if(opts.editable){ var rec=JSON.parse(get(unitId+':c:'+cardId)||'{}'); rec.body=ta.value; set(unitId+':c:'+cardId, JSON.stringify(rec)); }
      saved.classList.add('show');
      clearTimeout(ta._t); ta._t=setTimeout(function(){ saved.classList.remove('show'); }, 1200);
    });
    setTimeout(function(){ autoGrow(ta); }, 0);
    return card;
  }

  function autoGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; }

  function build(){
    UNITS.forEach(function(u){
      var sec = document.createElement('section'); sec.className='unit'; sec.id=u.id;
      var h = document.createElement('h2'); h.textContent=u.title;
      var sub = document.createElement('div'); sub.className='sub'; sub.textContent=u.sub;
      sec.appendChild(h); sec.appendChild(sub);

      u.cards.forEach(function(c){
        sec.appendChild(makeCard(u.id, c.id, c.t, c.ph, {}));
      });

      // 自定义卡片
      var idx = JSON.parse(get(u.id+':custom-idx')||'[]');
      idx.forEach(function(cid){
        var rec = JSON.parse(get(u.id+':c:'+cid)||'{}');
        sec.appendChild(makeCard(u.id, cid, rec.title||'未命名', '写点什么…', {editable:true, canDelete:true}));
      });

      var add = document.createElement('div'); add.className='add'; add.textContent='＋ 加一张卡片';
      add.addEventListener('click', function(){
        var cid = 'c'+Date.now();
        var idx2 = JSON.parse(get(u.id+':custom-idx')||'[]'); idx2.push(cid); set(u.id+':custom-idx', JSON.stringify(idx2));
        set(u.id+':c:'+cid, JSON.stringify({title:'新卡片', body:''}));
        var card = makeCard(u.id, cid, '新卡片', '写点什么…', {editable:true, canDelete:true});
        sec.insertBefore(card, add);
      });
      sec.appendChild(add);

      unitsWrap.appendChild(sec);

      var b = document.createElement('button'); b.className='sb-item'; b.textContent=u.title.split('·')[0].trim();
      b.addEventListener('click', function(){ main.scrollTo({top: sec.offsetTop-12, behavior:'smooth'}); });
      sb.appendChild(b);
      links.push({btn:b, el:sec});
    });
  }
  build();

  // scrollspy
  var current=null;
  function onScroll(){
    var top=main.scrollTop, best=null, bestTop=-1e9;
    links.forEach(function(l){ var t=l.el.offsetTop; if(t-12<=top+4 && t>bestTop){ bestTop=t; best=l; } });
    if(best && best!==current){ if(current) current.btn.classList.remove('active'); best.btn.classList.add('active'); best.btn.scrollIntoView({block:'nearest'}); current=best; }
  }
  main.addEventListener('scroll', onScroll, {passive:true}); onScroll();

  // 导出 Markdown
  document.getElementById('export').addEventListener('click', function(){
    var md = '# 韩语学习笔记\n\n';
    Array.prototype.slice.call(unitsWrap.querySelectorAll('section.unit')).forEach(function(sec){
      var uId = sec.id;
      md += '## ' + sec.querySelector('h2').textContent + '\n';
      Array.prototype.slice.call(sec.querySelectorAll('.card')).forEach(function(card){
        var title = card.querySelector('.card-title').textContent;
        var body = card.querySelector('textarea.note').value.trim();
        if(!body) return;
        md += '### ' + title + '\n' + body + '\n\n';
      });
      md += '\n';
    });
    var blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'korean-notes.md';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });
})();
</script>
</body>
</html>
