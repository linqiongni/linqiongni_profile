name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download Kokoro TTS model into dist (探测可用 int8/q8 变体，统一命名为 model_q8.onnx)
        run: |
          BASE="https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main/onnx"
          DEST="dist/english/models/onnx-community/Kokoro-82M-v1.0-ONNX/onnx"
          mkdir -p "$DEST"
          # 按体积从小到大优先选 <100MB 的 int8/q8 变体（避开 GitHub Pages 单文件上限）；
          # 落地文件名统一为 model_q8.onnx，匹配 kokoro-js dtype:"q8" 的本地加载期望。
          # 硬性体积下限 10MB，防止 HF 返回的错误响应（如 "Entry not found"）蒙混过关。
          for f in model_q8.onnx model_quantized.onnx model_q4.onnx model_q8f16.onnx model_fp16.onnx model.onnx; do
            echo "尝试下载 $f ..."
            if curl -sSL --retry 3 -m 480 "$BASE/$f" -o "$DEST/model_q8.onnx" \
               && [ -s "$DEST/model_q8.onnx" ] \
               && [ "$(stat -c%s "$DEST/model_q8.onnx")" -gt 10000000 ]; then
              sz=$(stat -c%s "$DEST/model_q8.onnx")
              echo "成功：源文件 $f -> model_q8.onnx，大小 $sz 字节"
              break
            else
              echo "$f 不可用，尝试下一候选"
              rm -f "$DEST/model_q8.onnx"
            fi
          done
          if [ ! -s "$DEST/model_q8.onnx" ] || [ "$(stat -c%s "$DEST/model_q8.onnx" 2>/dev/null || echo 0)" -lt 10000000 ]; then
            echo "::error::Kokoro 模型下载失败（所有候选均不可用或体积异常）"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
